name: release-windows

# Builds Windows NSIS installers (x64 + ARM64) and publishes them to a
# GitHub Release for the pushed tag. Triggered only on v* tags.
#
# Strategy: two matrix jobs run the Tauri CLI directly to BUILD the installers
# and upload them as workflow artifacts (the CLI build does not touch GitHub
# releases, so parallel jobs cannot race to create the same release). A third
# `publish` job collects both artifacts and creates the GitHub release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      npm_config_registry: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            extra_args: '--bundles nsis'
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            extra_args: '--bundles nsis --target aarch64-pc-windows-msvc'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Install Tauri CLI (desktop shell, outside the pnpm workspace)
        working-directory: apps/desktop-tauri
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org/

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build web frontend
        run: pnpm -r build

      - name: Tauri build (NSIS, ${{ matrix.arch }})
        working-directory: apps/desktop-tauri
        run: pnpm exec tauri build ${{ matrix.extra_args }}

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsis-${{ matrix.arch }}
          path: |
            apps/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List installers
        run: |
          echo "::group::Installers collected"
          find artifacts -type f -name '*.exe' -print
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: drawpaper ${{ github.ref_name }}
          # rc / beta / alpha tags are prereleases; final vX.Y.Z is stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/nsis-x64/*.exe
            artifacts/nsis-arm64/*.exe
          generate_release_notes: false
          body: |
            ## drawpaper ${{ github.ref_name }}

            Windows desktop installers (NSIS, Win10/11).

            - `drawpaper_*_x64-setup.exe` — 64-bit Intel/AMD
            - `drawpaper_*_aarch64-setup.exe` — ARM64 (Copilot+, Surface Pro X, etc.)

            Local-first: all data stays on-device. No account, no cloud sync.
