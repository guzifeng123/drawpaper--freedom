name: release-windows

# Builds Windows NSIS installers (x64 + ARM64) and publishes them to a
# GitHub Release for the pushed tag.
#
# Strategy: two matrix jobs run the Tauri CLI directly to BUILD the installers
# and upload them as workflow artifacts (the CLI build does not touch GitHub
# releases, so parallel jobs cannot race to create the same release). A third
# `publish` job collects both artifacts and creates the GitHub release.
#
# The build jobs also run on feat/p2-tauri-ci pushes and manual dispatch so the
# Windows toolchain is exercised BEFORE a release tag is cut. The publish job
# only runs on tag pushes.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'develop'
      - 'feat/p2-tauri-ci'
      - 'feat/desktop-shell-polish'
      - 'chore/windows-ci-smoke'
      - 'feat/desktop-native-gaps'
      - 'chore/nsis-smoke2-guide'
      - 'fix/desktop-open-zoom'
      - 'feat/win-portable-mode'
      - 'feat/win-updater'
      - 'feat/win-msi-bundle'
      - 'chore/win-smoke-gap-audit'
      - 'feat/win-diagnostics-webview2'
      - 'feat/desktop-coldstart-race'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      npm_config_registry: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            extra_args: '--bundles nsis,msi'
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            extra_args: '--bundles nsis,msi --target aarch64-pc-windows-msvc'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Install Tauri CLI (desktop shell, outside the pnpm workspace)
        working-directory: apps/desktop-tauri
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org/

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build web frontend
        run: pnpm -r build

      # Wave15 C: run the pure-Rust unit tests (diagnostics privacy walk / log
      # tail cap / filename). Gates to x64: the runner CPU is x64, so the host
      # triple tests compile and link natively. arm64 matrix skips (never faked).
      - name: 'cargo test (x64): diagnostics privacy unit tests'
        if: matrix.arch == 'x64'
        working-directory: apps/desktop-tauri/src-tauri
        shell: bash
        timeout-minutes: 20
        env:
          # src-tauri/Cargo.toml enables the `protocol-asset` feature but tauri.conf.json
          # does not declare an `assetProtocol` block. When cargo runs the tauri-build
          # script directly (not via `tauri build`), that feature/allowlist mismatch makes
          # the build script exit 1. Merging assetProtocol.enable here satisfies the same
          # check the CLI performs — no tauri.conf.json change.
          TAURI_CONFIG: '{"app":{"security":{"assetProtocol":{"enable":true}}}}'
        run: |
          set -euo pipefail
          # NOTE: no --locked — Wave15 C adds the `zip` crate; Cargo.lock is refreshed
          # by cargo in the runner workspace. The lockfile update is NOT committed.
          cargo test 2>&1 | tr '\r' '\n' | tee /tmp/cargo-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "::error title=cargo-test::unit tests failed"
            tail -n 60 /tmp/cargo-test.log
            exit "$code"
          fi

      - name: Tauri build (NSIS + MSI, ${{ matrix.arch }})
        working-directory: apps/desktop-tauri
        shell: bash
        env:
          # Wave15 A: updater signing key, read from repo secrets. On branch
          # runs these secrets are NOT configured -> empty -> we skip signing
          # (build still produces the installers, just no .sig sidecars). On
          # tag releases the maintainer sets them and `tauri build` additionally
          # writes <installer>.exe.sig next to each bundle.
          TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set +e
          # Map the (optional) secrets onto the env vars the Tauri CLI actually
          # reads. Only export when a key is present, so a missing secret (the
          # branch-run norm) means "skip signing", never "fail the build".
          if [ -n "${TAURI_SIGNING_KEY:-}" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$TAURI_SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_KEY_PASSWORD:-}"
            echo "updater signing: ENABLED (private key loaded from TAURI_SIGNING_KEY secret)"
          else
            echo "updater signing: SKIPPED (TAURI_SIGNING_KEY secret not set) — installers built unsigned, no .sig produced"
          fi
          echo "::group::tauri CLI version"
          ./node_modules/.bin/tauri --version
          echo "::endgroup::"
          # Invoke the CLI binary directly: the desktop shell lives outside the
          # pnpm workspace, so `pnpm exec` resolves against the root and fails
          # to find the local tauri binary. Normalize CR so cargo progress does
          # not collapse into one giant line.
          start_ts=$(date +%s)
          ./node_modules/.bin/tauri build --ci ${{ matrix.extra_args }} 2>&1 | tr '\r' '\n' | tee /tmp/tauri-build.log
          code=${PIPESTATUS[0]}
          echo "tauri build exit=$code elapsed=$(( $(date +%s)-start_ts ))s"
          if [ "$code" != "0" ]; then
            echo "::group::tauri build failure tail"
            tail -n 20 /tmp/tauri-build.log
            echo "::endgroup::"
            # Annotations are readable on the run page anonymously. GitHub caps
            # each level at 10 per step, so emit the previous 10 lines as
            # warnings and the LAST 10 as errors.
            tail -n 20 /tmp/tauri-build.log | sed -n '1,10p' | while IFS= read -r line; do
              echo "::warning title=tauri-${{ matrix.arch }}-ctx::${line:0:900}"
            done
            tail -n 20 /tmp/tauri-build.log | sed -n '11,20p' | while IFS= read -r line; do
              echo "::error title=tauri-${{ matrix.arch }}-tail::${line:0:900}"
            done
            exit "$code"
          fi

      # ------------------------------------------------------------------
      # Wave15 C: WebView2 离线策略实测取数。See docs/wave15/webview2-offline.md.
      #   (a) baseline NSIS package size (current conf = downloadBootstrapper,
      #       installs the runtime over the network at install time).
      #   (b) embedBootstrapper variant size delta — built via `tauri build
      #       --config` JSON override into a separate target dir, WITHOUT
      #       touching the committed tauri.conf.json.
      #   (c) Microsoft Evergreen Standalone (offline) Runtime installer sizes
      #       for x64/x86/arm64 — the artifact Tauri `offlineInstaller` would
      #       embed.
      # ------------------------------------------------------------------
      - name: 'Measure (a): baseline NSIS installer size'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Select-Object -First 1
          $mb = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "::notice title=wv2-baseline-${{ matrix.arch }}::NSIS baseline setup.exe = $mb MB ($($installer.Name))"
          Write-Host "BASELINE_NSIS_MB_${{ matrix.arch }}=$mb"

      - name: 'Measure (c): download Evergreen Standalone Runtime installers, print sizes'
        shell: bash
        timeout-minutes: 10
        # Informational data collection only (records offline runtime sizes for
        # the WebView2 bundling decision). Microsoft fwlinks occasionally drop
        # the transfer on shared runners (curl exit 18); a failed download must
        # never gate the release: retry, then warn and continue.
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /tmp/wv2
          # Microsoft fwlinks: Evergreen Standalone (offline) installers.
          #   x64 = LinkId 2124703, x86 = 2124701, arm64 = 2124699
          declare -A LINKS=(
            [x64]="https://go.microsoft.com/fwlink/p/?LinkId=2124703"
            [x86]="https://go.microsoft.com/fwlink/p/?LinkId=2124701"
            [arm64]="https://go.microsoft.com/fwlink/p/?LinkId=2124699"
          )
          for arch in x64 x86 arm64; do
            out="/tmp/wv2/MicrosoftEdgeWebView2RuntimeInstaller${arch}.exe"
            code=$(curl -L --silent --show-error --retry 3 --retry-all-errors               --output "$out" --write-out '%{http_code}' "${LINKS[$arch]}" || echo "000")
            sz=$(stat -c %s "$out" 2>/dev/null || echo 0)
            mb=$(awk "BEGIN{printf \"%.2f\", $sz/1048576}")
            echo "::notice title=wv2-standalone-$arch::HTTP $code, Evergreen Standalone $arch = $mb MB ($sz bytes)"
          done
          ls -la /tmp/wv2 || true

      - name: 'Measure (b): embedBootstrapper variant build + size (x64)'
        if: matrix.arch == 'x64'
        continue-on-error: true
        working-directory: apps/desktop-tauri
        shell: bash
        timeout-minutes: 25
        run: |
          set -uo pipefail
          # Measurement step (data collection, not a gate). Reuse the warm default
          # target dir so this is an incremental relink+rebundle (fast) instead of a
          # clean rebuild; the conf override is passed inline to `tauri build --config`,
          # tauri.conf.json on disk is NOT modified. A failure here must NOT fail the
          # release job — it only costs the (b) number, and the baseline installer the
          # smoke consumes is the one from the earlier normal build.
          echo "::group::tauri build --config embedBootstrapper"
          ./node_modules/.bin/tauri build --ci --bundles nsis \
            --config '{"bundle":{"windows":{"nsis":{"webviewInstallMode":{"embedBootstrapper":true}}}}}' 2>&1 | tr '\r' '\n' | tee /tmp/tauri-embed.log
          code=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$code" != "0" ]; then
            echo "::warning title=embed-build-failed::tauri build --config embedBootstrapper exited $code (non-fatal measurement)"
            tail -n 30 /tmp/tauri-embed.log
            exit 0
          fi
          installer=$(find apps/desktop-tauri/src-tauri/target -path '*bundle/nsis/*-setup.exe' -type f | head -n1)
          sz=$(stat -c %s "$installer")
          mb=$(awk "BEGIN{printf \"%.2f\", $sz/1048576}")
          echo "::notice title=wv2-embedBootstrapper::embedBootstrapper setup.exe = $mb MB ($(basename "$installer"))"
          # Restore the baseline (downloadBootstrapper) bundle for the install/canary
          # smoke below: rebuild once more without the override (incremental, fast).
          echo "::group::restore baseline bundle for smoke"
          ./node_modules/.bin/tauri build --ci --bundles nsis 2>&1 | tr '\r' '\n' | tail -5
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # Smoke tests (Wave 12 C). See docs/wave12/windows-smoke.md for design.
      #
      # - "fresh web assets" runs on BOTH arches: it only inspects files on
      #   disk, no execution.
      # - install / launch / uninstall steps are gated to `matrix.arch ==
      #   'x64'`: the windows-latest runner is x64 hardware, so an aarch64
      #   PE built here cannot be launched (Win32 loader rejects it). The
      #   steps stay in the YAML for arm64 but are skipped, never faked green.
      # ------------------------------------------------------------------
      - name: 'Smoke (both arches): bundled web assets contain a fresh index-*.js'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Search both the raw frontend build output (packages/web/dist,
          # produced by `pnpm -r build` in the previous step) and the Tauri
          # target tree (where tauri copies the bundle for packaging). The
          # actual copy location differs between the default x64 target dir
          # and the aarch64-pc-windows-msvc cross target, so cast a wide net.
          $roots = @(
            'packages/web/dist',
            'apps/desktop-tauri/src-tauri/target'
          )
          Write-Host "::group::Scanning roots for index-*.js"
          $files = @()
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $found = Get-ChildItem -Path $r -Recurse -Filter 'index-*.js' -File -ErrorAction SilentlyContinue
              if ($found) { $files += $found }
              Write-Host "  scanned: $r"
            } else {
              Write-Host "  (missing root, skipped): $r"
            }
          }
          if (-not $files) {
            Write-Error "Smoke FAIL: no index-*.js found under any of: $($roots -join ', ') (packaged web bundle may be missing)"
          }
          $newest = $files | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          Write-Host ("Found {0} index-*.js file(s):" -f $files.Count)
          $files | ForEach-Object { Write-Host ("  - {0}  ({1:o})" -f $_.FullName, $_.LastWriteTimeUtc) }
          $ageMin = (New-TimeSpan -Start $newest.LastWriteTimeUtc -End (Get-Date).ToUniversalTime()).TotalMinutes
          Write-Host ("Newest index-*.js age = {0:N1} min" -f $ageMin)
          if ($ageMin -gt 15) {
            Write-Error ("Smoke FAIL: newest index-*.js is {0:N1} min old (>15 min); packaged resources look stale" -f $ageMin)
          }
          Write-Host "Smoke OK: bundled web assets are fresh"
          Write-Host "::endgroup::"

      - name: 'Smoke (x64): silent NSIS install, exe present, ProductVersion matches tauri.conf'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          # 1) Expected version straight from tauri.conf.json (branch runs have
          #    no release tag name; the source of truth is the conf file).
          $tauriConf = Get-Content -Raw 'apps/desktop-tauri/src-tauri/tauri.conf.json' | ConvertFrom-Json
          $expectedVersion = $tauriConf.version
          Write-Host "tauri.conf.json version (raw) = '$expectedVersion'"

          # 2) Locate the NSIS installer produced by `tauri build`.
          $installer = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1
          if (-not $installer) { Write-Error 'Smoke FAIL: NSIS *-setup.exe not found under target/**/bundle/nsis' }
          Write-Host "Installer = $($installer.FullName)"

          # 3) Silent install. nsis.installMode is "both": on an elevated
          #    runner (GitHub windows-latest runs as admin) the bare /S install
          #    defaults to perMachine and lands under Program Files. To keep the
          #    CI smoke on the stable per-user path (no UAC, predictable install
          #    dir), pass /CURRENTUSER explicitly. Tauri 2 NSIS "both" mode
          #    accepts the standard NSIS /CURRENTUSER flag; if it is ignored on
          #    a future Tauri bump, the Program Files candidates in step 4 will
          #    still catch the per-machine landing and log it for diagnosis.
          Write-Host "Running silent install: Start-Process /S /CURRENTUSER"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S','/CURRENTUSER' -PassThru
          for ($w = 0; $w -lt 120; $w++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
          }
          Write-Host "Installer exited = $($p.HasExited)"
          if (-not $p.HasExited) { Write-Error 'Smoke FAIL: silent installer did not exit within 120s (likely a blocking dialog)' }
          Write-Host "Installer exit code = $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "Smoke FAIL: silent installer exited $($p.ExitCode)" }

          # 4) Discover install dir. installMode="both" means the silent
          #    installer may land in either:
          #      - currentUser: %LOCALAPPDATA%\Programs\drawpaper
          #      - perMachine: %ProgramFiles%\drawpaper (C:\Program Files)
          #    Probe both; fall back to a generic child-dir discovery under
          #    each root.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (${env:ProgramFiles(x86)} | ForEach-Object { Join-Path $_ 'drawpaper' })
          )
          $installDir = $null
          foreach ($c in $candidates) {
            if ($c) {
              Write-Host "  candidate: $c => exists=$(Test-Path $c)"
              if ((Test-Path $c) -and -not $installDir) { $installDir = $c }
            }
          }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) {
            Write-Host "::group::Leftover dirs under %LOCALAPPDATA% / Program Files"
            Get-ChildItem $env:LOCALAPPDATA -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem $env:ProgramFiles -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL: install dir not found after silent install (tried LOCALAPPDATA\Programs\drawpaper, LOCALAPPDATA\drawpaper, ProgramFiles\drawpaper, ProgramFiles(x86)\drawpaper)'
          }
          Write-Host "Install dir (matched) = $installDir"

          # 5) Locate drawpaper.exe.
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { Write-Error "Smoke FAIL: drawpaper.exe not found under $installDir" }
          Write-Host "App exe = $exe"

          # 6) Version assertion with normalization.
          #    Windows ProductVersion can rewrite a pre-release tag:
          #    tauri.conf '0.1.0-rc.4' may come back as '0.1.0.4' (the 'rc'
          #    label dropped, revision number bumped). We therefore compare
          #    the NUMERIC token sequences (split on any non-digit run),
          #    padding the shorter side with trailing zeros, and print both
          #    raw values for the log.
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed exe ProductVersion (raw) = '$productVersion'"
          Write-Host "tauri.conf version           (raw) = '$expectedVersion'"
          function Get-NumTokens([string]$v) {
            if (-not $v) { return @() }
            return @([regex]::Matches($v, '\d+') | ForEach-Object { [int]$_.Value })
          }
          $exp = Get-NumTokens $expectedVersion
          $got = Get-NumTokens $productVersion
          Write-Host ("Normalized numeric tokens - expected: [{0}]" -f ($exp -join '.'))
          Write-Host ("Normalized numeric tokens - got:      [{0}]" -f ($got -join '.'))
          # Pad to equal length with trailing zeros.
          $max = [Math]::Max($exp.Count, $got.Count)
          while ($exp.Count -lt $max) { $exp += 0 }
          while ($got.Count -lt $max) { $got += 0 }
          $mismatch = @(Compare-Object $exp $got -SyncWindow 0)
          if ($mismatch.Count -ne 0) {
            Write-Error ("Smoke FAIL: version mismatch. tauri.conf='$expectedVersion' vs ProductVersion='$productVersion'")
          }
          Write-Host "Smoke OK: installed exe present and numeric version tokens match"

      - name: 'Smoke (x64): .kbnote registry association registered (HKCU/HKLM)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: Tauri fileAssociations (bundle.fileAssociations[].ext =
          # ["kbnote"]) makes the NSIS installer write a per-ext registration.
          # For installMode=currentUser the hive is HKCU:\Software\Classes;
          # for a per-machine (elevated) install it lands in HKLM. Probe BOTH
          # hives and accept whichever exists with a non-empty default value
          # (the default value is the ProgID). This way the step stays green
          # whether the runner installed per-user (currentUser) or per-machine
          # (both + UAC).
          $hives = @(
            'HKCU:\Software\Classes\.kbnote',
            'HKLM:\Software\Classes\.kbnote'
          )
          $hit = $null
          foreach ($h in $hives) {
            $exists = Test-Path $h
            $default = ''
            if ($exists) {
              try {
                $item = Get-Item -Path $h -ErrorAction Stop
                $default = [string]$item.GetValue('')
              } catch {
                $default = ''
              }
            }
            Write-Host ("  probe {0} => exists={1} default='{2}'" -f $h, $exists, $default)
            if ($exists -and $default.Trim() -ne '') { $hit = $h; break }
          }
          if (-not $hit) {
            Write-Host "::group::HKCU/HKLM Classes\.kbnote dump"
            foreach ($h in $hives) {
              if (Test-Path $h) {
                Write-Host "  $h :"
                Get-ItemProperty -Path $h -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
              } else {
                Write-Host "  $h : (missing)"
              }
            }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL: .kbnote registry association not found (HKCU or HKLM) with non-empty default value'
          }
          Write-Host "Smoke OK: .kbnote file association registered at $hit (ProgID default non-empty)"

      - name: 'Smoke (x64): desktop + start-menu shortcuts present (user/public)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: NSIS installer should drop a drawpaper.lnk on the desktop
          # and an entry under Start Menu. installMode=currentUser writes to the
          # per-user desktop ([Environment]::GetFolderPath('Desktop') resolves
          # localized "桌面" correctly) and per-user Start Menu Programs.
          # installMode=both with elevation additionally writes to public/common
          # desktop and common Start Menu. Probe BOTH user and public locations;
          # at least one desktop lnk and at least one start-menu lnk must exist.
          $desktopUser = [Environment]::GetFolderPath('Desktop')
          $desktopCommon = [Environment]::GetFolderPath('CommonDesktopDirectory')
          Write-Host ("  user desktop   = '{0}'" -f $desktopUser)
          Write-Host ("  public desktop = '{0}'" -f $desktopCommon)
          $desktopHits = @()
          foreach ($d in @($desktopUser, $desktopCommon)) {
            if ($d -and (Test-Path $d)) {
              $lnk = Join-Path $d 'drawpaper.lnk'
              Write-Host ("    probe {0} => exists={1}" -f $lnk, (Test-Path $lnk))
              if (Test-Path $lnk) { $desktopHits += $lnk }
            }
          }
          $smRoots = @(
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'),
            (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs')
          )
          $smHits = @()
          foreach ($r in $smRoots) {
            Write-Host ("  start menu root: {0} => exists={1}" -f $r, (Test-Path $r))
            if (Test-Path $r) {
              $found = Get-ChildItem -Path $r -Recurse -Filter 'drawpaper*.lnk' -File -ErrorAction SilentlyContinue
              if ($found) { $smHits += $found.FullName }
            }
          }
          Write-Host ("Desktop shortcut hits ({0}):" -f $desktopHits.Count)
          $desktopHits | ForEach-Object { Write-Host "  - $_" }
          Write-Host ("Start-menu shortcut hits ({0}):" -f $smHits.Count)
          $smHits | ForEach-Object { Write-Host "  - $_" }
          if ($desktopHits.Count -lt 1) {
            Write-Error 'Smoke FAIL: no drawpaper.lnk found on user or public desktop'
          }
          if ($smHits.Count -lt 1) {
            Write-Error 'Smoke FAIL: no drawpaper*.lnk found under user or common Start Menu Programs'
          }
          Write-Host "Smoke OK: desktop and start-menu shortcuts present"

      - name: 'Smoke (x64): launch exe, main window title contains drawpaper, then kill'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve install dir the same way the install step does. installMode
          # "both" may land per-user (%LOCALAPPDATA%\Programs\drawpaper) or
          # per-machine (%ProgramFiles%\drawpaper); probe both.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at launch time' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host ("Start-Process returned pid={0}" -f $proc.Id)
          $ok = $false
          # WebView2 main window title can lag several seconds behind process
          # start; poll up to 20s, Refresh() each sample so MainWindowTitle is
          # re-read live, and accept ANY sample whose title contains drawpaper.
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              for ($s = 1; $s -le 3; $s++) {
                $p.Refresh()
                $title = $p.MainWindowTitle
                Write-Host ("t={0,2}s sample={1} pid={2} MainWindowTitle='{3}'" -f $i, $s, $p.Id, $title)
                if ($title -and ($title.ToLower().Contains('drawpaper'))) {
                  $ok = $true
                  break
                }
                Start-Sleep -Milliseconds 300
              }
            } else {
              Write-Host ("t={0,2}s: drawpaper process not found yet" -f $i)
            }
            if ($ok) { break }
          }
          # Best-effort cleanup of any leftover drawpaper AND its WebView2
          # child processes; otherwise the uninstaller below can hit a
          # "files in use" dialog and hang on Start-Process -Wait.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) {
            Write-Error 'Smoke FAIL: drawpaper process did not present a main window whose title contains "drawpaper" within 20s'
          }
          Write-Host "Smoke OK: process alive and main window title contains 'drawpaper'"

      - name: 'Smoke (x64): second launch absorbed by running instance (single-instance)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: tauri-plugin-single-instance is registered first in
          # Builder::default() (see apps/desktop-tauri/src-tauri/src/lib.rs).
          # Launching drawpaper.exe a second time while one instance is already
          # running must NOT spawn a second drawpaper.exe process — the plugin
          # forwards the argv (the .kbnote path, if any) to the running window
          # via the `second-instance` event and exits the second process. We
          # assert that after two Start-Process calls, the count of
          # "drawpaper" processes is exactly 1. WebView2 child processes are
          # named msedgewebview2.exe, so they do not inflate this count.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at single-instance check' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Clean slate: any leftover from the window-title step should already
          # be dead, but be explicit so the count assertion below is not
          # polluted by a previous run.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # First launch. Poll up to 20s for the process to be alive.
          Write-Host "First launch"
          $null = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          $firstAlive = $false
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $alive = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
            if ($alive) {
              Write-Host ("t={0,2}s first instance alive, count={1}" -f $i, ($alive | Measure-Object).Count)
              $firstAlive = $true
              break
            }
            Write-Host ("t={0,2}s waiting for first instance..." -f $i)
          }
          if (-not $firstAlive) {
            Write-Error 'Smoke FAIL: first drawpaper instance did not stay alive'
          }

          # Second launch — same exe, same working directory. The single-
          # instance plugin should make this second process exit itself after
          # forwarding argv to the running instance.
          Write-Host "Second launch (must be absorbed by the running instance)"
          $p2 = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          Write-Host ("Second Start-Process returned pid={0}" -f $p2.Id)

          # Poll up to 15s for the drawpaper process count to settle at 1.
          # Pass as soon as we see count==1; fail if it stays >1.
          $count = 0
          for ($i = 1; $i -le 15; $i++) {
            Start-Sleep -Seconds 1
            $procs = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
            $count = ($procs | Measure-Object).Count
            Write-Host ("t=+{0,2}s after second launch, drawpaper count = {1}" -f $i, $count)
            if ($count -eq 1) { break }
          }

          # Cleanup all drawpaper + its WebView2 children before uninstall step.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          if ($count -ne 1) {
            Write-Error ("Smoke FAIL: expected exactly 1 drawpaper process after second launch, observed {0} (single-instance not holding?)" -f $count)
          }
          Write-Host "Smoke OK: second launch absorbed by running instance (process count = 1)"

      # ------------------------------------------------------------------
      # Wave15 D: three extra x64 smokes on top of the original seven.
      # Each repeats the installDir probe (same as above), cleans up leftover
      # drawpaper + its WebView2 children on entry/exit, and uses bounded polls
      # (no bare -Wait) so a hung dialog can never hang the job. arm64 steps are
      # skipped by the matrix gate, never faked green.
      # ------------------------------------------------------------------
      - name: 'Smoke (x64): cold-start .kbnote file association (canary log + recents)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve install dir (identical probe to the install/launch steps).
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found for cold-start file assoc' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Clean slate (single-instance absorb would otherwise swallow the launch).
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # Write a minimal valid .kbnote carrying a unique canary token into a
          # temp dir, then launch drawpaper.exe WITH that path as argv[1] — this
          # mimics Explorer / command-line file-association open.
          $canary = 'CANARY-' + ([guid]::NewGuid().ToString('N'))
          $tmpDir = Join-Path $env:TEMP ('dp-smoke-' + ([guid]::NewGuid().ToString('N')))
          New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
          $docPath = Join-Path $tmpDir ($canary + '.kbnote')
          # Build a minimal valid .kbnote via a hashtable -> JSON (avoids a
          # PowerShell here-string, whose '@' closer must sit at column 0 and
          # would prematurely end this YAML block scalar).
          $doc = [ordered]@{
            format    = 'knowledge-block-notes'
            version   = 1
            id        = 'doc_coldstart_canary'
            title     = $canary
            board     = [ordered]@{ createdAt = 0; updatedAt = 0 }
            nodes     = @()
            edges     = @()
            tags      = @()
            layout    = [ordered]@{ mode = 'mindmap-right'; rankSpacing = 90; nodeSpacing = 28 }
            viewport  = [ordered]@{ x = 0; y = 0; zoom = 1 }
            page      = [ordered]@{ size='A4'; orientation='portrait'; marginMm=15; mode='fit'; showPageBreak=$true; colorMode='color'; header=$false; footer=$false; showPageNumbers=$false; edgeLabels=$true; pageBreaks=@() }
            assetRefs = @()
          }
          [System.IO.File]::WriteAllText($docPath, ($doc | ConvertTo-Json -Depth 6), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Canary doc = $docPath (token=$canary)"

          Write-Host "Launching: drawpaper.exe <canary.kbnote>"
          $null = Start-Process -FilePath $exe -ArgumentList $docPath -WorkingDirectory $installDir -PassThru

          # Bounded poll: process alive + main window title contains drawpaper.
          $ok = $false
          for ($i = 1; $i -le 25; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              $p.Refresh()
              $title = $p.MainWindowTitle
              Write-Host ("t={0,2}s pid={1} MainWindowTitle='{2}'" -f $i, $p.Id, $title)
              if ($title -and ($title.ToLower().Contains('drawpaper'))) { $ok = $true; break }
            } else {
              Write-Host ("t={0,2}s: drawpaper process not found" -f $i)
            }
          }
          if (-not $ok) {
            Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Error 'Smoke FAIL: cold-start .kbnote launch did not present a drawpaper window within 25s'
          }

          # Evidence: drawpaper.log must record the open-file (Wave15 D added the
          # success-path log line; the error path already logged). The recents JSON
          # must contain the canary path. NOTE BOUNDARY: this proves the OS->Rust
          # hand-off (argv[1] read, current_path bound, recents pushed); whether the
          # WebView canvas actually rendered the doc on cold start depends on the
          # known setup()-phase event race (see docs/wave15/desktop-gap-audit.md),
          # which CI UI automation does not assert.
          #
          # PATH DISCOVERY (not assumption): tauri-plugin-log's app_log_dir and the
          # recents app_config_dir may resolve to Roaming (%APPDATA%) OR Local
          # (%LOCALAPPDATA%) com.drawpaper.app depending on the Tauri version.
          # Search BOTH and discover where they actually landed instead of hardcoding.
          $dataRoots = @($env:APPDATA, $env:LOCALAPPDATA) | ForEach-Object { Join-Path $_ 'com.drawpaper.app' }
          Write-Host ("Searching data roots: {0}" -f ($dataRoots -join ' ; '))
          $logHit = $false
          $recentsHit = $false
          $unreadableSeen = $false
          $foundLog = $null
          $foundRecents = $null
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 1
            foreach ($root in $dataRoots) {
              $logCand = Join-Path $root 'logs\drawpaper.log'
              if (-not (Test-Path $logCand)) {
                $alt = Get-ChildItem -Path $root -Recurse -Filter 'drawpaper.log' -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($alt) { $logCand = $alt.FullName }
              }
              $recCand = Join-Path $root 'drawpaper-recents.json'
              if ((-not $logHit) -and (Test-Path $logCand)) {
                $foundLog = $logCand
                # Copy first: the appender may hold the log open; reading via a
                # copy avoids a sharing-violation on the live file.
                $copy = Join-Path $env:TEMP ('logcopy-' + [guid]::NewGuid().ToString('N') + '.log')
                Copy-Item $logCand $copy -Force
                $content = Get-Content -Raw $copy -ErrorAction SilentlyContinue
                if ($content) {
                  if (($content -match 'open-file') -and $content.Contains($canary)) { $logHit = $true }
                  if ($content -match 'unreadable') { $unreadableSeen = $true }
                }
              }
              if ((-not $recentsHit) -and (Test-Path $recCand)) {
                $foundRecents = $recCand
                $rc = Get-Content -Raw $recCand -ErrorAction SilentlyContinue
                if ($rc -and $rc.Contains($canary)) { $recentsHit = $true }
              }
            }
            if (($i % 3) -eq 0 -or $logHit -or $recentsHit) {
              Write-Host ("t=+{0,2}s logHit={1} recentsHit={2} unreadable={3} foundLog={4}" -f $i, $logHit, $recentsHit, $unreadableSeen, $foundLog)
            }
            if ($logHit -and $recentsHit) { break }
          }

          # Diagnostics dump: show exactly what landed under each data root so any
          # path mismatch is visible in the run log even on failure.
          Write-Host "::group::data tree dump (cold-start)"
          Write-Host ("APPDATA={0} ; LOCALAPPDATA={1}" -f $env:APPDATA, $env:LOCALAPPDATA)
          foreach ($root in $dataRoots) {
            Write-Host " root: $root exists=$(Test-Path $root)"
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 40 |
                ForEach-Object { Write-Host ("   {0}  ({1} bytes)" -f $_.FullName.Substring($root.Length), $_.Length) }
            }
          }
          if ($foundLog) {
            Write-Host "--- drawpaper.log tail ---"
            Get-Content $foundLog -Tail 25 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "--- no drawpaper.log found under any searched root ---"
          }
          Write-Host "::endgroup::"

          # Cleanup before the next step.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          if ($unreadableSeen) { Write-Error 'Smoke FAIL: Rust reported the canary .kbnote as unreadable (see log dump above)' }
          if (-not $logHit) { Write-Error 'Smoke FAIL: no open-file log record for the canary .kbnote (searched Roaming+Local com.drawpaper.app\logs\drawpaper.log; see data tree dump)' }
          if (-not $recentsHit) { Write-Error 'Smoke FAIL: drawpaper-recents.json does not contain the canary path (searched Roaming+Local; see data tree dump)' }
          Write-Host "Smoke OK: cold-start .kbnote association — process alive, title ok, log+recents prove Rust processed the file"

      - name: 'Smoke (x64): first-run welcome doc lands in WebView2 leveldb, no dup on 2nd run'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found for welcome-doc check' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }

          # Wipe/search BOTH Roaming (%APPDATA%) and Local (%LOCALAPPDATA%)
          # com.drawpaper.app roots — the WebView2 EBWebView user-data folder may
          # land in either depending on the Tauri version. Do not assume one.
          $dataRoots = @($env:APPDATA, $env:LOCALAPPDATA) | ForEach-Object { Join-Path $_ 'com.drawpaper.app' }

          # Kill, then wipe the WHOLE app data dir(s) so this is a true first run
          # (the earlier launch steps already wrote the welcome flag once).
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          foreach ($root in $dataRoots) {
            if (Test-Path $root) {
              Write-Host "Wiping app data dir to force first run: $root"
              Remove-Item -Path $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          # Also wipe any pre-existing EBWebView anywhere under Local/Roaming so the
          # welcome flag is truly gone regardless of where WebView2 put it.
          foreach ($root in @($env:LOCALAPPDATA, $env:APPDATA)) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Directory -Filter 'EBWebView' -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "Wiping EBWebView: $($_.FullName)"; Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
            }
          }

          # Locate EBWebView anywhere under Local/Roaming AND next to the exe —
          # Tauri 2 may place the WebView2 user-data folder outside com.drawpaper.app.
          function Find-EBWebView {
            $dirs = @()
            foreach ($root in @($env:LOCALAPPDATA, $env:APPDATA, $installDir)) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Recurse -Directory -Filter 'EBWebView' -ErrorAction SilentlyContinue
              if ($hit) { $dirs += ($hit | ForEach-Object { $_.FullName }) }
            }
            return ($dirs | Select-Object -Unique)
          }
          # Byte-level substring search. Select-String treats leveldb as text lines
          # and binary framing breaks matching; reading raw bytes + ASCII Contains
          # reliably finds the marker strings in both the uncompressed WAL (.log)
          # and any already-compacted .ldb.
          function Test-WelcomeMarkers {
            # Returns the number of files containing either welcome marker string.
            $hits = 0
            foreach ($ebRoot in (Find-EBWebView)) {
              $files = Get-ChildItem -Path $ebRoot -Recurse -File -ErrorAction SilentlyContinue
              foreach ($f in $files) {
                try {
                  $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
                  $text = [System.Text.Encoding]::ASCII.GetString($bytes)
                  if ($text.Contains('doc_welcome_v1') -or $text.Contains('drawpaper:welcome-doc-v1')) {
                    $hits += 1
                  }
                } catch { /* locked/skip */ }
              }
            }
            return $hits
          }

          Write-Host "First launch (fresh app data)"
          $null = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru

          # Confirm the app actually booted before polling leveldb (WebView2 cold
          # init after a full wipe is slow; a crash here would otherwise look like
          # 'no welcome markers').
          $booted = $false
          for ($i = 1; $i -le 25; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) { $p.Refresh(); if ($p.MainWindowTitle -and $p.MainWindowTitle.ToLower().Contains('drawpaper')) { $booted = $true; break } }
          }
          Write-Host "App booted (window title ok) = $booted"

          # Give the app time to boot React, run bootstrap(), create the welcome
          # doc and write the localStorage flag.
          Start-Sleep -Seconds 20
          # Gracefully close (WM_CLOSE) so WebView2 flushes localStorage/IndexedDB
          # to disk before we grep — an abrupt Stop-Process -Force loses the
          # in-memory writes. Fall back to force-kill if it won't close.
          $dp = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
          if ($dp) { $dp | ForEach-Object { $_.CloseMainWindow() | Out-Null } }
          for ($i = 1; $i -le 10; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue)) { break }
          }
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $firstHits = Test-WelcomeMarkers
          Write-Host "First-run welcome-marker files = $firstHits"

          # Diagnostics: show where EBWebView landed and what files exist.
          Write-Host "::group::welcome-doc diagnostics"
          Write-Host ("EBWebView dirs found: {0}" -f ((Find-EBWebView) -join ' ; '))
          foreach ($root in $dataRoots) {
            Write-Host " root: $root exists=$(Test-Path $root)"
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 50 |
                ForEach-Object { Write-Host ("   {0}  ({1} bytes)" -f $_.FullName.Substring($root.Length), $_.Length) }
            }
          }
          Write-Host "::endgroup::"

          # The log plugin forwards webview console to drawpaper.log — dump it to
          # reveal any boot error (e.g. __TAURI__ missing, bootstrap throw).
          foreach ($root in $dataRoots) {
            $logCand = Join-Path $root 'logs\drawpaper.log'
            if (Test-Path $logCand) {
              Write-Host "::group::drawpaper.log tail (welcome-doc step) :: $logCand"
              Get-Content $logCand -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
              Write-Host "::endgroup::"
            }
          }

          if ($firstHits -lt 1) {
            Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Error 'Smoke FAIL: welcome markers (doc_welcome_v1 / drawpaper:welcome-doc-v1) not found in EBWebView leveldb within 60s after confirmed boot'
          }

          # Kill, relaunch; the localStorage flag must already be set so the
          # welcome doc is NOT re-created.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Write-Host "Second launch (must not re-create welcome doc)"
          $null = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 15
          # Graceful close so WebView2 flushes, then grep.
          $dp2 = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
          if ($dp2) { $dp2 | ForEach-Object { $_.CloseMainWindow() | Out-Null } }
          for ($i = 1; $i -le 10; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue)) { break }
          }
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $secondHits = Test-WelcomeMarkers
          Write-Host "Second-run welcome-marker files = $secondHits (first = $firstHits)"

          # Marker must still be present on the second run (persistence). The
          # no-recreate guarantee is the localStorage flag already being set.
          if ($secondHits -lt 1) {
            Write-Error ("Smoke FAIL: welcome markers vanished on second run (first={0}, second={1})" -f $firstHits, $secondHits)
          }
          Write-Host "Smoke OK: welcome doc created on first run, flag persisted on second (marker files $firstHits -> $secondHits)"

      - name: 'Smoke (x64): --diag-export privacy canary (no .kbnote/asset leak)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          # Discover install dir the same way the prior steps do.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at diag-export smoke' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Plant a canary: a .kbnote whose BODY is a unique secret string, plus
          # an assets/ file with the same bytes. The diag export MUST never
          # read/pack these bytes.
          $dataDir = Join-Path $env:APPDATA 'com.drawpaper.app'
          New-Item -ItemType Directory -Force -Path (Join-Path $dataDir 'assets') | Out-Null
          $canary = "CANARY-7f3a9b2e4d5c-never-leak-body-" + [guid]::NewGuid().ToString('N')
          Set-Content -Path (Join-Path $dataDir 'SECRET-canary.kbnote') -Value $canary -NoNewline -Encoding utf8
          Set-Content -Path (Join-Path $dataDir 'assets' 'img.png') -Value $canary -NoNewline -Encoding utf8
          Write-Host "Planted canary (body length=$($canary.Length)) at $dataDir"

          $outZip = Join-Path $env:TEMP 'dp-diag.zip'
          Remove-Item $outZip -ErrorAction SilentlyContinue
          # Clear any residual drawpaper process from the prior single-instance smoke.
          Get-Process drawpaper -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1

          # GUI-subsystem exe: Start-Process redirect can lose the handle, so wrap
          # with cmd /c to capture the Rust eprintln diagnostics ([diag-export] ...).
          $outLog = Join-Path $env:TEMP 'dp-diag.out'
          Remove-Item $outLog -ErrorAction SilentlyContinue
          Write-Host "Running: cmd /c `"$exe`" --diag-export `"$outZip`" > `"$outLog`" 2>&1"
          cmd /c "`"$exe`" --diag-export `"$outZip`" > `"$outLog`" 2>&1"
          $code = $LASTEXITCODE
          Write-Host "::group::diag-export captured stdout/stderr"
          if (Test-Path $outLog) { Get-Content $outLog | ForEach-Object { Write-Host "  | $_" } } else { Write-Host "  (no output file)" }
          Write-Host "::endgroup::"
          Write-Host "diag-export exit code = $code"
          if ($code -ne 0) { Write-Error "Smoke FAIL: --diag-export exited $code" }
          if (-not (Test-Path $outZip)) { Write-Error 'Smoke FAIL: diag zip not produced' }
          $zipLen = (Get-Item $outZip).Length
          Write-Host "diag zip = $outZip ($zipLen bytes)"
          # Print first bytes to confirm it is a real ZIP (PK\x03\x04) before Expand.
          $fs = [System.IO.File]::OpenRead($outZip)
          $buf = New-Object byte[] 8; [void]$fs.Read($buf,0,8); $fs.Close()
          $hex = ($buf | ForEach-Object { $_.ToString('x2') }) -join ' '
          Write-Host "zip header bytes: $hex"

          # Extract and assert.
          $extract = Join-Path $env:TEMP 'dp-diag-extract'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          try {
            Expand-Archive -Path $outZip -DestinationPath $extract -Force -ErrorAction Stop
          } catch {
            Write-Host "Expand-Archive failed: $_"
            Write-Error "Smoke FAIL: Expand-Archive could not unpack the zip crate output"
          }
          Write-Host "::group::Extracted diag zip entries"
          Get-ChildItem $extract -Recurse -File | ForEach-Object {
            Write-Host ("  - {0}  ({1} bytes)" -f $_.FullName.Substring($extract.Length+1), $_.Length)
          }
          Write-Host "::endgroup::"

          # 1) no *.kbnote entry.
          $kbnote = Get-ChildItem $extract -Recurse -File -Filter '*.kbnote' -ErrorAction SilentlyContinue
          if ($kbnote) { $kbnote | ForEach-Object { Write-Host "LEAK: $($_.FullName)" }; Write-Error 'Smoke FAIL: zip contains a *.kbnote entry' }
          # 2) no assets/ entry.
          $assets = Get-ChildItem $extract -Recurse -File | Where-Object { $_.FullName -match '[\\/]assets[\\/]' }
          if ($assets) { $assets | ForEach-Object { Write-Host "LEAK: $($_.FullName)" }; Write-Error 'Smoke FAIL: zip contains an assets/ entry' }
          # 3) canary body string zero hits across ALL extracted files.
          $leak = Get-ChildItem $extract -Recurse -File | Select-String -SimpleMatch -Pattern $canary -List -ErrorAction SilentlyContinue
          if ($leak) { $leak | ForEach-Object { Write-Host "LEAK in $($_.Path): $($_.Line)" }; Write-Error 'Smoke FAIL: canary body string found inside diagnostic zip!' }
          Write-Host "Privacy OK: no *.kbnote, no assets/, canary string zero hits"

          # 4) system.json fields.
          $sysPath = Join-Path $extract 'system.json'
          if (-not (Test-Path $sysPath)) { Write-Error 'Smoke FAIL: system.json missing' }
          $sys = Get-Content -Raw $sysPath | ConvertFrom-Json
          Write-Host ("system.json: version={0} os={1} os_version={2} arch={3} webview2={4} collected_at={5}" -f $sys.version, $sys.os, $sys.os_version, $sys.arch, $sys.webview2_runtime_version, $sys.collected_at)
          if (-not $sys.version) { Write-Error 'Smoke FAIL: system.version empty' }
          if (-not $sys.arch) { Write-Error 'Smoke FAIL: system.arch empty' }
          if ($null -eq $sys.webview2_runtime_version) { Write-Error 'Smoke FAIL: system.webview2_runtime_version missing' }
          if ($sys.webview2_runtime_version -eq 'unknown') { Write-Host '::warning title=wv2-detect::webview2_runtime_version came back unknown on the runner' }

          # 5) manifest entries have exactly name/size/mtime.
          $manPath = Join-Path $extract 'files-manifest.json'
          if (-not (Test-Path $manPath)) { Write-Error 'Smoke FAIL: files-manifest.json missing' }
          $man = Get-Content -Raw $manPath | ConvertFrom-Json
          Write-Host ("files-manifest.json lists {0} file(s)" -f $man.Count)
          $bad = @()
          foreach ($e in $man) {
            $props = @($e.PSObject.Properties.Name | Sort-Object)
            # Sort-Object yields alphabetic order: mtime, name, size (m<n<s).
            if (($props -join ',') -ne 'mtime,name,size') { $bad += ($props -join ',') }
          }
          if ($bad.Count -gt 0) { Write-Error ("Smoke FAIL: manifest entries with unexpected fields: " + ($bad -join ' | ')) }
          $names = $man | ForEach-Object { $_.name }
          Write-Host "  manifest still lists canary by name (metadata-only): $($names -contains 'SECRET-canary.kbnote')"
          Write-Host "Smoke OK: diag-export privacy canary passed"

      - name: 'Smoke (x64): silent uninstall, install dir removed'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) {
            Write-Host "Install dir already absent; nothing to uninstall"
            exit 0
          }
          Write-Host "Install dir = $installDir"
          # Tauri NSIS currentUser uninstaller is unins000.exe in the install dir.
          $uninst = Get-ChildItem $installDir -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninst) { $uninst = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -File | Select-Object -First 1 }
          if (-not $uninst) {
            Write-Host "Entries under $installDir :"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "Smoke FAIL: uninstaller exe (unins*.exe / Uninstall*.exe) not found in $installDir"
          }
          Write-Host "Uninstaller = $($uninst.FullName)"
          # NSIS uninstaller accepts /S; some Tauri builds expect /SILENT.
          # Try /SILENT first, fall back to /S. Do NOT use -Wait blindly: a
          # "files in use" dialog would hang the step forever. Instead poll
          # the uninstaller process for up to 60s, then poll dir removal.
          $removed = $false
          foreach ($arg in @('/SILENT', '/S')) {
            Write-Host "Running uninstaller with arg '$arg'"
            $u = Start-Process -FilePath $uninst.FullName -ArgumentList $arg -PassThru
            # Wait up to 60s for the uninstaller process itself to exit.
            for ($w = 0; $w -lt 60; $w++) {
              Start-Sleep -Seconds 1
              $u.Refresh()
              if ($u.HasExited) { break }
            }
            Write-Host "Uninstaller ($arg) exited = $($u.HasExited)"
            for ($i = 1; $i -le 20; $i++) {
              Start-Sleep -Seconds 1
              if (-not (Test-Path $installDir)) { $removed = $true; break }
            }
            if ($removed) { break }
            Write-Host "  dir still present after '$arg'; trying next arg..."
          }
          if (-not $removed) {
            Write-Host "Remaining files under $installDir :"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "Smoke FAIL: install dir still present 20s after silent uninstall (tried /SILENT and /S)"
          }
          Write-Host "Smoke OK: install dir removed after silent uninstall"

      # ------------------------------------------------------------------
      # MSI smoke tests (Wave 15 B). Runs ONLY on x64 and ONLY after the NSIS
      # uninstall step above has restored a clean machine. The WiX MSI is a
      # per-machine package (InstallScope=perMachine), so msiexec /qn lands
      # under C:\Program Files\drawpaper on the (admin) runner — a different
      # directory from the per-user NSIS install, so the two never overlap.
      # arm64 MSI is built but NOT executed (no ARM runner); gated below.
      # ------------------------------------------------------------------
      - name: 'Smoke (x64): silent MSI install, exe present, ProductVersion matches tauri.conf'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          # 1) Expected version straight from tauri.conf.json.
          $tauriConf = Get-Content -Raw 'apps/desktop-tauri/src-tauri/tauri.conf.json' | ConvertFrom-Json
          $expectedVersion = $tauriConf.version
          Write-Host "tauri.conf.json version (raw) = '$expectedVersion'"

          # 2) Locate the WiX MSI produced by `tauri build --bundles nsis,msi`.
          $msi = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*.msi' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' } |
            Select-Object -First 1
          if (-not $msi) { Write-Error 'Smoke FAIL: *.msi not found under target/**/bundle/msi' }
          Write-Host "MSI = $($msi.FullName) ($([math]::Round($msi.Length/1MB,2)) MB)"

          # 3) Silent per-machine install with a verbose log. /norestart keeps
          #    the runner from rebooting; 3010 == "success, reboot recommended"
          #    which we treat as success.
          $log = Join-Path $env:RUNNER_TEMP 'drawpaper-msi-install.log'
          Write-Host "Running: msiexec /i <msi> /qn /norestart /lv* <log>"
          $p = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/lv*', "`"$log`"" `
            -PassThru
          for ($w = 0; $w -lt 180; $w++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
          }
          Write-Host "msiexec exited = $($p.HasExited)"
          if (-not $p.HasExited) { Write-Error 'Smoke FAIL: msiexec did not exit within 180s' }
          Write-Host "msiexec exit code = $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Write-Host "::group::MSI install log tail"
            Get-Content $log -Tail 50 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            Write-Error "Smoke FAIL: msiexec /i exited $($p.ExitCode) (expected 0 or 3010)"
          }

          # 4) Discover install dir. Tauri WiX MSI is perMachine -> Program Files
          #    on x64. Probe Program Files / Program Files(x86) / LOCALAPPDATA and
          #    PRINT every hit so a landing change is obvious from the log.
          $candidates = @(
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (Join-Path ${env:ProgramFiles(x86)} 'drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper')
          )
          $script:msiInstallDir = $null
          foreach ($c in $candidates) {
            if ($c) {
              $exists = Test-Path $c
              Write-Host "  candidate: $c => exists=$exists"
              if ($exists -and -not $script:msiInstallDir) { $script:msiInstallDir = $c }
            }
          }
          if (-not $script:msiInstallDir) {
            Write-Host "::group::Leftover drawpaper dirs"
            Get-ChildItem $env:ProgramFiles -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL: MSI install dir not found (Program Files / Program Files(x86) / LOCALAPPDATA\Programs)'
          }
          Write-Host "MSI install dir (matched) = $($script:msiInstallDir)"

          # 5) Locate drawpaper.exe.
          $exe = Join-Path $script:msiInstallDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $script:msiInstallDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { Write-Error "Smoke FAIL: drawpaper.exe not found under $($script:msiInstallDir)" }
          Write-Host "App exe = $exe"

          # 6) Version assertion with the SAME numeric-token normalization the
          #    NSIS smoke uses (Windows can rewrite a pre-release tag).
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed exe ProductVersion (raw) = '$productVersion'"
          Write-Host "tauri.conf version           (raw) = '$expectedVersion'"
          function Get-NumTokens([string]$v) {
            if (-not $v) { return @() }
            return @([regex]::Matches($v, '\d+') | ForEach-Object { [int]$_.Value })
          }
          $exp = Get-NumTokens $expectedVersion
          $got = Get-NumTokens $productVersion
          Write-Host ("Normalized numeric tokens - expected: [{0}]" -f ($exp -join '.'))
          Write-Host ("Normalized numeric tokens - got:      [{0}]" -f ($got -join '.'))
          $max = [Math]::Max($exp.Count, $got.Count)
          while ($exp.Count -lt $max) { $exp += 0 }
          while ($got.Count -lt $max) { $got += 0 }
          $mismatch = @(Compare-Object $exp $got -SyncWindow 0)
          if ($mismatch.Count -ne 0) {
            Write-Error ("Smoke FAIL: MSI version mismatch. tauri.conf='$expectedVersion' vs ProductVersion='$productVersion'")
          }
          Write-Host "Smoke OK: MSI installed exe present and numeric version tokens match"

      - name: 'Smoke (x64 MSI): .kbnote registry association registered (HKCU/HKLM)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Per-machine MSI should write HKLM\Software\Classes\.kbnote. Probe
          # both hives (mirrors the NSIS smoke) and accept a non-empty default.
          $hives = @(
            'HKLM:\Software\Classes\.kbnote',
            'HKCU:\Software\Classes\.kbnote'
          )
          $hit = $null
          foreach ($h in $hives) {
            $exists = Test-Path $h
            $default = ''
            if ($exists) {
              try {
                $item = Get-Item -Path $h -ErrorAction Stop
                $default = [string]$item.GetValue('')
              } catch { $default = '' }
            }
            Write-Host ("  probe {0} => exists={1} default='{2}'" -f $h, $exists, $default)
            if ($exists -and $default.Trim() -ne '') { $hit = $h; break }
          }
          if (-not $hit) {
            Write-Host "::group::HKCU/HKLM Classes\.kbnote dump"
            foreach ($h in $hives) {
              if (Test-Path $h) {
                Write-Host "  $h :"
                Get-ItemProperty -Path $h -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
              } else {
                Write-Host "  $h : (missing)"
              }
            }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL (MSI): .kbnote registry association not found (HKLM or HKCU) with non-empty default'
          }
          Write-Host "Smoke OK (MSI): .kbnote file association registered at $hit (ProgID default non-empty)"

      - name: 'Smoke (x64 MSI): desktop + start-menu shortcuts present'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Per-machine install writes to COMMON desktop + common Start Menu.
          # Probe both user and common locations; at least one desktop lnk and
          # at least one start-menu lnk must exist (same contract as NSIS).
          $desktopUser = [Environment]::GetFolderPath('Desktop')
          $desktopCommon = [Environment]::GetFolderPath('CommonDesktopDirectory')
          Write-Host ("  user desktop   = '{0}'" -f $desktopUser)
          Write-Host ("  public desktop = '{0}'" -f $desktopCommon)
          $desktopHits = @()
          foreach ($d in @($desktopUser, $desktopCommon)) {
            if ($d -and (Test-Path $d)) {
              $lnk = Join-Path $d 'drawpaper.lnk'
              Write-Host ("    probe {0} => exists={1}" -f $lnk, (Test-Path $lnk))
              if (Test-Path $lnk) { $desktopHits += $lnk }
            }
          }
          $smRoots = @(
            (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs')
          )
          $smHits = @()
          foreach ($r in $smRoots) {
            Write-Host ("  start menu root: {0} => exists={1}" -f $r, (Test-Path $r))
            if (Test-Path $r) {
              $found = Get-ChildItem -Path $r -Recurse -Filter 'drawpaper*.lnk' -File -ErrorAction SilentlyContinue
              if ($found) { $smHits += $found.FullName }
            }
          }
          Write-Host ("Desktop shortcut hits ({0}):" -f $desktopHits.Count)
          $desktopHits | ForEach-Object { Write-Host "  - $_" }
          Write-Host ("Start-menu shortcut hits ({0}):" -f $smHits.Count)
          $smHits | ForEach-Object { Write-Host "  - $_" }
          if ($desktopHits.Count -lt 1) {
            Write-Error 'Smoke FAIL (MSI): no drawpaper.lnk found on user or public desktop'
          }
          if ($smHits.Count -lt 1) {
            Write-Error 'Smoke FAIL (MSI): no drawpaper*.lnk found under user or common Start Menu Programs'
          }
          Write-Host "Smoke OK (MSI): desktop and start-menu shortcuts present"

      - name: 'Smoke (x64 MSI): launch exe, main window title contains drawpaper, then kill'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (Join-Path ${env:ProgramFiles(x86)} 'drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper')
          )
          $installDir = $null
          foreach ($c in $candidates) { if ($c -and (Test-Path $c)) { $installDir = $c; break } }
          if (-not $installDir) { Write-Error 'Smoke FAIL (MSI): install dir not found at launch time' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host ("Start-Process returned pid={0}" -f $proc.Id)
          $ok = $false
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              for ($s = 1; $s -le 3; $s++) {
                $p.Refresh()
                $title = $p.MainWindowTitle
                Write-Host ("t={0,2}s sample={1} pid={2} MainWindowTitle='{3}'" -f $i, $s, $p.Id, $title)
                if ($title -and ($title.ToLower().Contains('drawpaper'))) { $ok = $true; break }
                Start-Sleep -Milliseconds 300
              }
            } else {
              Write-Host ("t={0,2}s: drawpaper process not found yet" -f $i)
            }
            if ($ok) { break }
          }
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) {
            Write-Error 'Smoke FAIL (MSI): drawpaper process did not present a main window whose title contains "drawpaper" within 20s'
          }
          Write-Host "Smoke OK (MSI): process alive and main window title contains 'drawpaper'"

      - name: 'Smoke (x64 MSI): silent uninstall, install dir removed'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (Join-Path ${env:ProgramFiles(x86)} 'drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper')
          )
          $installDir = $null
          foreach ($c in $candidates) { if ($c -and (Test-Path $c)) { $installDir = $c; break } }
          if (-not $installDir) {
            Write-Host "MSI install dir already absent; nothing to uninstall"
            exit 0
          }
          Write-Host "Install dir = $installDir"
          # Best-effort kill of any running app / WebView2 children so the MSI
          # does not hit a files-in-use dialog.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # Re-locate the MSI to uninstall by product code path too, but the
          # simplest deterministic handle is the original .msi file on disk.
          $msi = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*.msi' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' } | Select-Object -First 1
          if (-not $msi) { Write-Error 'Smoke FAIL (MSI): cannot find .msi for uninstall' }
          $log = Join-Path $env:RUNNER_TEMP 'drawpaper-msi-uninstall.log'
          Write-Host "Running: msiexec /x <msi> /qn /norestart /lv* <log>"
          $u = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList '/x', "`"$($msi.FullName)`"", '/qn', '/norestart', '/lv*', "`"$log`"" `
            -PassThru
          for ($w = 0; $w -lt 120; $w++) {
            Start-Sleep -Seconds 1
            $u.Refresh()
            if ($u.HasExited) { break }
          }
          Write-Host "msiexec /x exited = $($u.HasExited)"
          if ($u.HasExited) { Write-Host "msiexec /x exit code = $($u.ExitCode)" }
          # Poll for dir removal up to 60s.
          $removed = $false
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Test-Path $installDir)) { $removed = $true; break }
          }
          if (-not $removed) {
            Write-Host "::group::Remaining files under $installDir"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "::group::MSI uninstall log tail"
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL (MSI): install dir still present 60s after msiexec /x'
          }
          Write-Host "Smoke OK (MSI): install dir removed after silent uninstall"

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsis-${{ matrix.arch }}
          path: |
            apps/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe.sig
          # The .sig sidecars only exist on signed (tag) builds; .exe always
          # exists, so the upload never fails on unsigned branch runs.
          if-no-files-found: error
          retention-days: 30

      - name: Upload MSI installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-${{ matrix.arch }}
          path: |
            apps/desktop-tauri/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    # Only publish a release on tag pushes; branch/dispatch runs only validate
    # that the Windows toolchain produces installers (artifacts stay on the run).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NSIS installers (x64)
        # download-artifact@v4: name a single artifact per step. v4 does NOT
        # support the v3 "download all unnamed artifacts into one dir" pattern;
        # without `name` it fans each artifact into its own subdir, which is
        # fragile here. Explicit downloads to distinct paths are deterministic.
        uses: actions/download-artifact@v4
        with:
          name: nsis-x64
          path: artifacts/nsis-x64

      - name: Download NSIS installers (arm64)
        uses: actions/download-artifact@v4
        with:
          name: nsis-arm64
          path: artifacts/nsis-arm64

      - name: Download MSI installers (x64)
        uses: actions/download-artifact@v4
        with:
          name: msi-x64
          path: artifacts/msi-x64

      - name: Download MSI installers (arm64)
        uses: actions/download-artifact@v4
        with:
          name: msi-arm64
          path: artifacts/msi-arm64

      - name: List installers
        run: |
          echo "::group::Installers collected"
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' \) -print | sort
          echo "::endgroup::"

      - name: Generate SHA256SUMS.txt
        # One line per installer (NSIS *-setup.exe AND WiX *.msi):
        # "<sha256>  <basename>". Basename (no arch subdir) so a user who
        # downloads all four installers + the sums file into one folder can run
        # `sha256sum -c SHA256SUMS.txt` directly.
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS.txt
          # shellcheck disable=SC2044
          for f in $(find nsis-x64 nsis-arm64 msi-x64 msi-arm64 \( -name '*-setup.exe' -o -name '*.msi' \) -type f | sort); do
            hash="$(sha256sum "$f" | cut -d' ' -f1)"
            base="$(basename "$f")"
            printf '%s  %s\n' "$hash" "$base" >> SHA256SUMS.txt
          done
          echo "::group::SHA256SUMS.txt"
          cat SHA256SUMS.txt
          echo "::endgroup::"
          # Four installers: NSIS x64/arm64 + MSI x64/arm64.
          test "$(wc -l < SHA256SUMS.txt)" -ge 4

      - name: Generate latest.json (Tauri updater manifest)
        # Wave15 A: builds the static updater manifest the desktop shell pulls
        # from .../releases/latest/download/latest.json. Whole publish job is
        # tag-gated. If the .sig sidecars are absent (tag cut before the
        # TAURI_SIGNING_KEY secret is configured), skip gracefully — installers
        # still publish, just without in-app updates (users download manually).
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          X64_EXE="$(find artifacts/nsis-x64 -name '*-setup.exe' -type f | head -n1 || true)"
          ARM64_EXE="$(find artifacts/nsis-arm64 -name '*-setup.exe' -type f | head -n1 || true)"
          X64_SIG="$(find artifacts/nsis-x64 -name '*-setup.exe.sig' -type f | head -n1 || true)"
          ARM64_SIG="$(find artifacts/nsis-arm64 -name '*-setup.exe.sig' -type f | head -n1 || true)"
          if [ -z "${X64_EXE:-}" ] || [ -z "${ARM64_EXE:-}" ] || [ -z "${X64_SIG:-}" ] || [ -z "${ARM64_SIG:-}" ]; then
            echo "::warning::updater .sig sidecars missing (TAURI_SIGNING_KEY secret not configured?) — skipping latest.json; installers still publish, in-app updates will fall back to the Releases web page."
            exit 0
          fi
          X64_BASE="$(basename "$X64_EXE")"
          ARM64_BASE="$(basename "$ARM64_EXE")"
          VERSION="$(python3 -c 'import json;print(json.load(open("apps/desktop-tauri/src-tauri/tauri.conf.json"))["version"])')"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$BASE" "$TAG" "$X64_BASE" "$ARM64_BASE" "$X64_SIG" "$ARM64_SIG" "$VERSION" "$PUB_DATE" <<'PY'
          import sys, json
          base, tag, x64_base, arm64_base, x64_sig, arm64_sig, version, pub_date = sys.argv[1:9]
          manifest = {
            "version": version,
            "notes": "drawpaper %s 预发布。完整更新说明见仓库 CHANGELOG.md。" % tag,
            "pub_date": pub_date,
            "platforms": {
              "windows-x86_64": {
                "url": "%s/%s" % (base, x64_base),
                "signature": open(x64_sig).read().strip(),
              },
              "windows-aarch64": {
                "url": "%s/%s" % (base, arm64_base),
                "signature": open(arm64_sig).read().strip(),
              },
            },
          }
          open("artifacts/latest.json", "w").write(json.dumps(manifest, indent=2, ensure_ascii=False))
          print("::group::latest.json")
          print(open("artifacts/latest.json").read())
          print("::endgroup::")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: drawpaper ${{ github.ref_name }}
          # This workflow is only cut for RC/beta/pre-release tags; pin
          # prerelease: true explicitly instead of inferring from the tag shape,
          # so a stable vX.Y.Z must flip this deliberately rather than by accident.
          prerelease: true
          files: |
            artifacts/nsis-x64/**/*.exe
            artifacts/nsis-arm64/**/*.exe
            artifacts/nsis-x64/**/*.sig
            artifacts/nsis-arm64/**/*.sig
            artifacts/latest.json
            artifacts/msi-x64/**/*.msi
            artifacts/msi-arm64/**/*.msi
            artifacts/SHA256SUMS.txt
          generate_release_notes: false
          body: |
            ## drawpaper ${{ github.ref_name }}（预发布）

            Windows 桌面安装包（Win10/11，NSIS 与 WiX MSI 双格式 × x64/ARM64）。本地优先：所有数据留在本机，无账号、无云同步。

            **NSIS（推荐，与以往版本一致）**
            - `drawpaper_*_x64-setup.exe` — 64 位 Intel/AMD
            - `drawpaper_*_arm64-setup.exe` — ARM64（Copilot+、Surface Pro X 等）
            - `latest.json` + `*.sig` — 应用内「帮助 → 检查更新…」原生更新清单与签名（仅在配置了 updater 签名私钥后生效；未配置时应用自动回退到本网页手动下载）。

            **WiX MSI（企业 / 批量部署场景）**
            - `drawpaper_*_x64_en-US.msi` — 64 位 Intel/AMD（按机器安装到 Program Files）
            - `drawpaper_*_arm64_en-US.msi` — ARM64

            - `SHA256SUMS.txt` — 四个安装包（NSIS×2 + MSI×2）的 SHA-256 校验和（下载后 `sha256sum -c SHA256SUMS.txt` 校验）。

            升级方式：若本版已带 `latest.json`，旧版应用点「帮助 → 检查更新…」即可原生更新；否则手动下载新安装包覆盖安装（用户数据不动）。详见仓库 `CHANGELOG.md` 与 `docs/RELEASE.md`。
