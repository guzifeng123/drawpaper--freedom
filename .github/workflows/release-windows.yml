name: release-windows

# Builds Windows NSIS installers (x64 + ARM64) and publishes them to a
# GitHub Release for the pushed tag.
#
# Strategy: two matrix jobs run the Tauri CLI directly to BUILD the installers
# and upload them as workflow artifacts (the CLI build does not touch GitHub
# releases, so parallel jobs cannot race to create the same release). A third
# `publish` job collects both artifacts and creates the GitHub release.
#
# The build jobs also run on feat/p2-tauri-ci pushes and manual dispatch so the
# Windows toolchain is exercised BEFORE a release tag is cut. The publish job
# only runs on tag pushes.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'develop'
      - 'feat/p2-tauri-ci'
      - 'feat/desktop-shell-polish'
      - 'chore/windows-ci-smoke'
      - 'feat/desktop-native-gaps'
      - 'chore/nsis-smoke2-guide'
      - 'fix/desktop-open-zoom'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      npm_config_registry: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            extra_args: '--bundles nsis'
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            extra_args: '--bundles nsis --target aarch64-pc-windows-msvc'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Install Tauri CLI (desktop shell, outside the pnpm workspace)
        working-directory: apps/desktop-tauri
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org/

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build web frontend
        run: pnpm -r build

      - name: Tauri build (NSIS, ${{ matrix.arch }})
        working-directory: apps/desktop-tauri
        shell: bash
        run: |
          set +e
          echo "::group::tauri CLI version"
          ./node_modules/.bin/tauri --version
          echo "::endgroup::"
          # Invoke the CLI binary directly: the desktop shell lives outside the
          # pnpm workspace, so `pnpm exec` resolves against the root and fails
          # to find the local tauri binary. Normalize CR so cargo progress does
          # not collapse into one giant line.
          start_ts=$(date +%s)
          ./node_modules/.bin/tauri build --ci ${{ matrix.extra_args }} 2>&1 | tr '\r' '\n' | tee /tmp/tauri-build.log
          code=${PIPESTATUS[0]}
          echo "tauri build exit=$code elapsed=$(( $(date +%s)-start_ts ))s"
          if [ "$code" != "0" ]; then
            echo "::group::tauri build failure tail"
            tail -n 20 /tmp/tauri-build.log
            echo "::endgroup::"
            # Annotations are readable on the run page anonymously. GitHub caps
            # each level at 10 per step, so emit the previous 10 lines as
            # warnings and the LAST 10 as errors.
            tail -n 20 /tmp/tauri-build.log | sed -n '1,10p' | while IFS= read -r line; do
              echo "::warning title=tauri-${{ matrix.arch }}-ctx::${line:0:900}"
            done
            tail -n 20 /tmp/tauri-build.log | sed -n '11,20p' | while IFS= read -r line; do
              echo "::error title=tauri-${{ matrix.arch }}-tail::${line:0:900}"
            done
            exit "$code"
          fi

      # ------------------------------------------------------------------
      # Smoke tests (Wave 12 C). See docs/wave12/windows-smoke.md for design.
      #
      # - "fresh web assets" runs on BOTH arches: it only inspects files on
      #   disk, no execution.
      # - install / launch / uninstall steps are gated to `matrix.arch ==
      #   'x64'`: the windows-latest runner is x64 hardware, so an aarch64
      #   PE built here cannot be launched (Win32 loader rejects it). The
      #   steps stay in the YAML for arm64 but are skipped, never faked green.
      # ------------------------------------------------------------------
      - name: 'Smoke (both arches): bundled web assets contain a fresh index-*.js'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Search both the raw frontend build output (packages/web/dist,
          # produced by `pnpm -r build` in the previous step) and the Tauri
          # target tree (where tauri copies the bundle for packaging). The
          # actual copy location differs between the default x64 target dir
          # and the aarch64-pc-windows-msvc cross target, so cast a wide net.
          $roots = @(
            'packages/web/dist',
            'apps/desktop-tauri/src-tauri/target'
          )
          Write-Host "::group::Scanning roots for index-*.js"
          $files = @()
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $found = Get-ChildItem -Path $r -Recurse -Filter 'index-*.js' -File -ErrorAction SilentlyContinue
              if ($found) { $files += $found }
              Write-Host "  scanned: $r"
            } else {
              Write-Host "  (missing root, skipped): $r"
            }
          }
          if (-not $files) {
            Write-Error "Smoke FAIL: no index-*.js found under any of: $($roots -join ', ') (packaged web bundle may be missing)"
          }
          $newest = $files | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          Write-Host ("Found {0} index-*.js file(s):" -f $files.Count)
          $files | ForEach-Object { Write-Host ("  - {0}  ({1:o})" -f $_.FullName, $_.LastWriteTimeUtc) }
          $ageMin = (New-TimeSpan -Start $newest.LastWriteTimeUtc -End (Get-Date).ToUniversalTime()).TotalMinutes
          Write-Host ("Newest index-*.js age = {0:N1} min" -f $ageMin)
          if ($ageMin -gt 15) {
            Write-Error ("Smoke FAIL: newest index-*.js is {0:N1} min old (>15 min); packaged resources look stale" -f $ageMin)
          }
          Write-Host "Smoke OK: bundled web assets are fresh"
          Write-Host "::endgroup::"

      - name: 'Smoke (x64): silent NSIS install, exe present, ProductVersion matches tauri.conf'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          # 1) Expected version straight from tauri.conf.json (branch runs have
          #    no release tag name; the source of truth is the conf file).
          $tauriConf = Get-Content -Raw 'apps/desktop-tauri/src-tauri/tauri.conf.json' | ConvertFrom-Json
          $expectedVersion = $tauriConf.version
          Write-Host "tauri.conf.json version (raw) = '$expectedVersion'"

          # 2) Locate the NSIS installer produced by `tauri build`.
          $installer = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1
          if (-not $installer) { Write-Error 'Smoke FAIL: NSIS *-setup.exe not found under target/**/bundle/nsis' }
          Write-Host "Installer = $($installer.FullName)"

          # 3) Silent install. nsis.installMode is "both": on an elevated
          #    runner (GitHub windows-latest runs as admin) the bare /S install
          #    defaults to perMachine and lands under Program Files. To keep the
          #    CI smoke on the stable per-user path (no UAC, predictable install
          #    dir), pass /CURRENTUSER explicitly. Tauri 2 NSIS "both" mode
          #    accepts the standard NSIS /CURRENTUSER flag; if it is ignored on
          #    a future Tauri bump, the Program Files candidates in step 4 will
          #    still catch the per-machine landing and log it for diagnosis.
          Write-Host "Running silent install: Start-Process /S /CURRENTUSER"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S','/CURRENTUSER' -PassThru
          for ($w = 0; $w -lt 120; $w++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
          }
          Write-Host "Installer exited = $($p.HasExited)"
          if (-not $p.HasExited) { Write-Error 'Smoke FAIL: silent installer did not exit within 120s (likely a blocking dialog)' }
          Write-Host "Installer exit code = $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "Smoke FAIL: silent installer exited $($p.ExitCode)" }

          # 4) Discover install dir. installMode="both" means the silent
          #    installer may land in either:
          #      - currentUser: %LOCALAPPDATA%\Programs\drawpaper
          #      - perMachine: %ProgramFiles%\drawpaper (C:\Program Files)
          #    Probe both; fall back to a generic child-dir discovery under
          #    each root.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (${env:ProgramFiles(x86)} | ForEach-Object { Join-Path $_ 'drawpaper' })
          )
          $installDir = $null
          foreach ($c in $candidates) {
            if ($c) {
              Write-Host "  candidate: $c => exists=$(Test-Path $c)"
              if ((Test-Path $c) -and -not $installDir) { $installDir = $c }
            }
          }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) {
            Write-Host "::group::Leftover dirs under %LOCALAPPDATA% / Program Files"
            Get-ChildItem $env:LOCALAPPDATA -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem $env:ProgramFiles -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL: install dir not found after silent install (tried LOCALAPPDATA\Programs\drawpaper, LOCALAPPDATA\drawpaper, ProgramFiles\drawpaper, ProgramFiles(x86)\drawpaper)'
          }
          Write-Host "Install dir (matched) = $installDir"

          # 5) Locate drawpaper.exe.
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { Write-Error "Smoke FAIL: drawpaper.exe not found under $installDir" }
          Write-Host "App exe = $exe"

          # 6) Version assertion with normalization.
          #    Windows ProductVersion can rewrite a pre-release tag:
          #    tauri.conf '0.1.0-rc.4' may come back as '0.1.0.4' (the 'rc'
          #    label dropped, revision number bumped). We therefore compare
          #    the NUMERIC token sequences (split on any non-digit run),
          #    padding the shorter side with trailing zeros, and print both
          #    raw values for the log.
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed exe ProductVersion (raw) = '$productVersion'"
          Write-Host "tauri.conf version           (raw) = '$expectedVersion'"
          function Get-NumTokens([string]$v) {
            if (-not $v) { return @() }
            return @([regex]::Matches($v, '\d+') | ForEach-Object { [int]$_.Value })
          }
          $exp = Get-NumTokens $expectedVersion
          $got = Get-NumTokens $productVersion
          Write-Host ("Normalized numeric tokens - expected: [{0}]" -f ($exp -join '.'))
          Write-Host ("Normalized numeric tokens - got:      [{0}]" -f ($got -join '.'))
          # Pad to equal length with trailing zeros.
          $max = [Math]::Max($exp.Count, $got.Count)
          while ($exp.Count -lt $max) { $exp += 0 }
          while ($got.Count -lt $max) { $got += 0 }
          $mismatch = @(Compare-Object $exp $got -SyncWindow 0)
          if ($mismatch.Count -ne 0) {
            Write-Error ("Smoke FAIL: version mismatch. tauri.conf='$expectedVersion' vs ProductVersion='$productVersion'")
          }
          Write-Host "Smoke OK: installed exe present and numeric version tokens match"

      - name: 'Smoke (x64): .kbnote registry association registered (HKCU/HKLM)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: Tauri fileAssociations (bundle.fileAssociations[].ext =
          # ["kbnote"]) makes the NSIS installer write a per-ext registration.
          # For installMode=currentUser the hive is HKCU:\Software\Classes;
          # for a per-machine (elevated) install it lands in HKLM. Probe BOTH
          # hives and accept whichever exists with a non-empty default value
          # (the default value is the ProgID). This way the step stays green
          # whether the runner installed per-user (currentUser) or per-machine
          # (both + UAC).
          $hives = @(
            'HKCU:\Software\Classes\.kbnote',
            'HKLM:\Software\Classes\.kbnote'
          )
          $hit = $null
          foreach ($h in $hives) {
            $exists = Test-Path $h
            $default = ''
            if ($exists) {
              try {
                $item = Get-Item -Path $h -ErrorAction Stop
                $default = [string]$item.GetValue('')
              } catch {
                $default = ''
              }
            }
            Write-Host ("  probe {0} => exists={1} default='{2}'" -f $h, $exists, $default)
            if ($exists -and $default.Trim() -ne '') { $hit = $h; break }
          }
          if (-not $hit) {
            Write-Host "::group::HKCU/HKLM Classes\.kbnote dump"
            foreach ($h in $hives) {
              if (Test-Path $h) {
                Write-Host "  $h :"
                Get-ItemProperty -Path $h -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
              } else {
                Write-Host "  $h : (missing)"
              }
            }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL: .kbnote registry association not found (HKCU or HKLM) with non-empty default value'
          }
          Write-Host "Smoke OK: .kbnote file association registered at $hit (ProgID default non-empty)"

      - name: 'Smoke (x64): desktop + start-menu shortcuts present (user/public)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: NSIS installer should drop a drawpaper.lnk on the desktop
          # and an entry under Start Menu. installMode=currentUser writes to the
          # per-user desktop ([Environment]::GetFolderPath('Desktop') resolves
          # localized "桌面" correctly) and per-user Start Menu Programs.
          # installMode=both with elevation additionally writes to public/common
          # desktop and common Start Menu. Probe BOTH user and public locations;
          # at least one desktop lnk and at least one start-menu lnk must exist.
          $desktopUser = [Environment]::GetFolderPath('Desktop')
          $desktopCommon = [Environment]::GetFolderPath('CommonDesktopDirectory')
          Write-Host ("  user desktop   = '{0}'" -f $desktopUser)
          Write-Host ("  public desktop = '{0}'" -f $desktopCommon)
          $desktopHits = @()
          foreach ($d in @($desktopUser, $desktopCommon)) {
            if ($d -and (Test-Path $d)) {
              $lnk = Join-Path $d 'drawpaper.lnk'
              Write-Host ("    probe {0} => exists={1}" -f $lnk, (Test-Path $lnk))
              if (Test-Path $lnk) { $desktopHits += $lnk }
            }
          }
          $smRoots = @(
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'),
            (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs')
          )
          $smHits = @()
          foreach ($r in $smRoots) {
            Write-Host ("  start menu root: {0} => exists={1}" -f $r, (Test-Path $r))
            if (Test-Path $r) {
              $found = Get-ChildItem -Path $r -Recurse -Filter 'drawpaper*.lnk' -File -ErrorAction SilentlyContinue
              if ($found) { $smHits += $found.FullName }
            }
          }
          Write-Host ("Desktop shortcut hits ({0}):" -f $desktopHits.Count)
          $desktopHits | ForEach-Object { Write-Host "  - $_" }
          Write-Host ("Start-menu shortcut hits ({0}):" -f $smHits.Count)
          $smHits | ForEach-Object { Write-Host "  - $_" }
          if ($desktopHits.Count -lt 1) {
            Write-Error 'Smoke FAIL: no drawpaper.lnk found on user or public desktop'
          }
          if ($smHits.Count -lt 1) {
            Write-Error 'Smoke FAIL: no drawpaper*.lnk found under user or common Start Menu Programs'
          }
          Write-Host "Smoke OK: desktop and start-menu shortcuts present"

      - name: 'Smoke (x64): launch exe, main window title contains drawpaper, then kill'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve install dir the same way the install step does. installMode
          # "both" may land per-user (%LOCALAPPDATA%\Programs\drawpaper) or
          # per-machine (%ProgramFiles%\drawpaper); probe both.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at launch time' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host ("Start-Process returned pid={0}" -f $proc.Id)
          $ok = $false
          # WebView2 main window title can lag several seconds behind process
          # start; poll up to 20s, Refresh() each sample so MainWindowTitle is
          # re-read live, and accept ANY sample whose title contains drawpaper.
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              for ($s = 1; $s -le 3; $s++) {
                $p.Refresh()
                $title = $p.MainWindowTitle
                Write-Host ("t={0,2}s sample={1} pid={2} MainWindowTitle='{3}'" -f $i, $s, $p.Id, $title)
                if ($title -and ($title.ToLower().Contains('drawpaper'))) {
                  $ok = $true
                  break
                }
                Start-Sleep -Milliseconds 300
              }
            } else {
              Write-Host ("t={0,2}s: drawpaper process not found yet" -f $i)
            }
            if ($ok) { break }
          }
          # Best-effort cleanup of any leftover drawpaper AND its WebView2
          # child processes; otherwise the uninstaller below can hit a
          # "files in use" dialog and hang on Start-Process -Wait.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) {
            Write-Error 'Smoke FAIL: drawpaper process did not present a main window whose title contains "drawpaper" within 20s'
          }
          Write-Host "Smoke OK: process alive and main window title contains 'drawpaper'"

      - name: 'Smoke (x64): second launch absorbed by running instance (single-instance)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: tauri-plugin-single-instance is registered first in
          # Builder::default() (see apps/desktop-tauri/src-tauri/src/lib.rs).
          # Launching drawpaper.exe a second time while one instance is already
          # running must NOT spawn a second drawpaper.exe process — the plugin
          # forwards the argv (the .kbnote path, if any) to the running window
          # via the `second-instance` event and exits the second process. We
          # assert that after two Start-Process calls, the count of
          # "drawpaper" processes is exactly 1. WebView2 child processes are
          # named msedgewebview2.exe, so they do not inflate this count.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at single-instance check' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Clean slate: any leftover from the window-title step should already
          # be dead, but be explicit so the count assertion below is not
          # polluted by a previous run.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # First launch. Poll up to 20s for the process to be alive.
          Write-Host "First launch"
          $null = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          $firstAlive = $false
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $alive = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
            if ($alive) {
              Write-Host ("t={0,2}s first instance alive, count={1}" -f $i, ($alive | Measure-Object).Count)
              $firstAlive = $true
              break
            }
            Write-Host ("t={0,2}s waiting for first instance..." -f $i)
          }
          if (-not $firstAlive) {
            Write-Error 'Smoke FAIL: first drawpaper instance did not stay alive'
          }

          # Second launch — same exe, same working directory. The single-
          # instance plugin should make this second process exit itself after
          # forwarding argv to the running instance.
          Write-Host "Second launch (must be absorbed by the running instance)"
          $p2 = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          Write-Host ("Second Start-Process returned pid={0}" -f $p2.Id)

          # Poll up to 15s for the drawpaper process count to settle at 1.
          # Pass as soon as we see count==1; fail if it stays >1.
          $count = 0
          for ($i = 1; $i -le 15; $i++) {
            Start-Sleep -Seconds 1
            $procs = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
            $count = ($procs | Measure-Object).Count
            Write-Host ("t=+{0,2}s after second launch, drawpaper count = {1}" -f $i, $count)
            if ($count -eq 1) { break }
          }

          # Cleanup all drawpaper + its WebView2 children before uninstall step.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          if ($count -ne 1) {
            Write-Error ("Smoke FAIL: expected exactly 1 drawpaper process after second launch, observed {0} (single-instance not holding?)" -f $count)
          }
          Write-Host "Smoke OK: second launch absorbed by running instance (process count = 1)"

      - name: 'Smoke (x64): silent uninstall, install dir removed'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) {
            Write-Host "Install dir already absent; nothing to uninstall"
            exit 0
          }
          Write-Host "Install dir = $installDir"
          # Tauri NSIS currentUser uninstaller is unins000.exe in the install dir.
          $uninst = Get-ChildItem $installDir -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninst) { $uninst = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -File | Select-Object -First 1 }
          if (-not $uninst) {
            Write-Host "Entries under $installDir :"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "Smoke FAIL: uninstaller exe (unins*.exe / Uninstall*.exe) not found in $installDir"
          }
          Write-Host "Uninstaller = $($uninst.FullName)"
          # NSIS uninstaller accepts /S; some Tauri builds expect /SILENT.
          # Try /SILENT first, fall back to /S. Do NOT use -Wait blindly: a
          # "files in use" dialog would hang the step forever. Instead poll
          # the uninstaller process for up to 60s, then poll dir removal.
          $removed = $false
          foreach ($arg in @('/SILENT', '/S')) {
            Write-Host "Running uninstaller with arg '$arg'"
            $u = Start-Process -FilePath $uninst.FullName -ArgumentList $arg -PassThru
            # Wait up to 60s for the uninstaller process itself to exit.
            for ($w = 0; $w -lt 60; $w++) {
              Start-Sleep -Seconds 1
              $u.Refresh()
              if ($u.HasExited) { break }
            }
            Write-Host "Uninstaller ($arg) exited = $($u.HasExited)"
            for ($i = 1; $i -le 20; $i++) {
              Start-Sleep -Seconds 1
              if (-not (Test-Path $installDir)) { $removed = $true; break }
            }
            if ($removed) { break }
            Write-Host "  dir still present after '$arg'; trying next arg..."
          }
          if (-not $removed) {
            Write-Host "Remaining files under $installDir :"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "Smoke FAIL: install dir still present 20s after silent uninstall (tried /SILENT and /S)"
          }
          Write-Host "Smoke OK: install dir removed after silent uninstall"

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsis-${{ matrix.arch }}
          path: |
            apps/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    # Only publish a release on tag pushes; branch/dispatch runs only validate
    # that the Windows toolchain produces installers (artifacts stay on the run).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NSIS installers (x64)
        # download-artifact@v4: name a single artifact per step. v4 does NOT
        # support the v3 "download all unnamed artifacts into one dir" pattern;
        # without `name` it fans each artifact into its own subdir, which is
        # fragile here. Two explicit downloads to two distinct paths is the
        # deterministic form.
        uses: actions/download-artifact@v4
        with:
          name: nsis-x64
          path: artifacts/nsis-x64

      - name: Download NSIS installers (arm64)
        uses: actions/download-artifact@v4
        with:
          name: nsis-arm64
          path: artifacts/nsis-arm64

      - name: List installers
        run: |
          echo "::group::Installers collected"
          find artifacts -type f -name '*.exe' -print
          echo "::endgroup::"

      - name: Generate SHA256SUMS.txt
        # One line per installer: "<sha256>  <basename>". Basename (no arch
        # subdir) so a user who downloads both exes + the sums file into one
        # folder can run `sha256sum -c SHA256SUMS.txt` directly.
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS.txt
          # shellcheck disable=SC2044
          for exe in $(find nsis-x64 nsis-arm64 -name '*-setup.exe' -type f | sort); do
            hash="$(sha256sum "$exe" | cut -d' ' -f1)"
            base="$(basename "$exe")"
            printf '%s  %s\n' "$hash" "$base" >> SHA256SUMS.txt
          done
          echo "::group::SHA256SUMS.txt"
          cat SHA256SUMS.txt
          echo "::endgroup::"
          test "$(wc -l < SHA256SUMS.txt)" -ge 2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: drawpaper ${{ github.ref_name }}
          # This workflow is only cut for RC/beta/pre-release tags; pin
          # prerelease: true explicitly instead of inferring from the tag shape,
          # so a stable vX.Y.Z must flip this deliberately rather than by accident.
          prerelease: true
          files: |
            artifacts/nsis-x64/**/*.exe
            artifacts/nsis-arm64/**/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: false
          body: |
            ## drawpaper ${{ github.ref_name }}（预发布）

            Windows 桌面安装包（NSIS，Win10/11）。本地优先：所有数据留在本机，无账号、无云同步。

            - `drawpaper_*_x64-setup.exe` — 64 位 Intel/AMD
            - `drawpaper_*_arm64-setup.exe` — ARM64（Copilot+、Surface Pro X 等）
            - `SHA256SUMS.txt` — 两个安装包的 SHA-256 校验和（下载后 `sha256sum -c SHA256SUMS.txt` 校验）。

            本版为预发布（RC），尚未启用自动更新：升级请手动下载新安装包覆盖安装。详见仓库 `CHANGELOG.md` 与 `docs/RELEASE.md`。
