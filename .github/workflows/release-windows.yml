name: release-windows

# Builds Windows NSIS installers (x64 + ARM64) and publishes them to a
# GitHub Release for the pushed tag.
#
# Strategy: two matrix jobs run the Tauri CLI directly to BUILD the installers
# and upload them as workflow artifacts (the CLI build does not touch GitHub
# releases, so parallel jobs cannot race to create the same release). A third
# `publish` job collects both artifacts and creates the GitHub release.
#
# The build jobs also run on feat/p2-tauri-ci pushes and manual dispatch so the
# Windows toolchain is exercised BEFORE a release tag is cut. The publish job
# only runs on tag pushes.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'develop'
      - 'feat/p2-tauri-ci'
      - 'feat/desktop-shell-polish'
      - 'chore/windows-ci-smoke'
      - 'feat/desktop-native-gaps'
      - 'chore/nsis-smoke2-guide'
      - 'fix/desktop-open-zoom'
      - 'feat/win-portable-mode'
      - 'feat/win-updater'
      - 'feat/win-msi-bundle'
      - 'chore/win-smoke-gap-audit'
      - 'feat/win-diagnostics-webview2'
      - 'feat/desktop-coldstart-race'
      - 'feat/desktop-folder-autosave'
      - 'feat/desktop-global-shortcuts'
      - 'feat/msi-bilingual'
      - 'fix/msi-zhcn-smoke'
      - 'chore/portable-smoke-ci'
      - 'chore/ci-exe-hardening'
      - 'chore/arm64-runner-smoke'
      - 'feat/updater-fallback-probe'
      - 'chore/arm64-cli-smoke'
      - 'feat/webview2-bootstrapper-embed'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      npm_config_registry: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            extra_args: '--bundles nsis,msi'
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            extra_args: '--bundles nsis,msi --target aarch64-pc-windows-msvc'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Install Tauri CLI (desktop shell, outside the pnpm workspace)
        working-directory: apps/desktop-tauri
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org/

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build web frontend
        run: pnpm -r build

      # Wave15 C: run the pure-Rust unit tests (diagnostics privacy walk / log
      # tail cap / filename). Gates to x64: the runner CPU is x64, so the host
      # triple tests compile and link natively. arm64 matrix skips (never faked).
      - name: 'cargo test (x64): diagnostics privacy unit tests'
        if: matrix.arch == 'x64'
        working-directory: apps/desktop-tauri/src-tauri
        shell: bash
        timeout-minutes: 20
        env:
          # src-tauri/Cargo.toml enables the `protocol-asset` feature but tauri.conf.json
          # does not declare an `assetProtocol` block. When cargo runs the tauri-build
          # script directly (not via `tauri build`), that feature/allowlist mismatch makes
          # the build script exit 1. Merging assetProtocol.enable here satisfies the same
          # check the CLI performs — no tauri.conf.json change.
          TAURI_CONFIG: '{"app":{"security":{"assetProtocol":{"enable":true}}}}'
        run: |
          set -euo pipefail
          # NOTE: no --locked — Wave15 C adds the `zip` crate; Cargo.lock is refreshed
          # by cargo in the runner workspace. The lockfile update is NOT committed.
          cargo test 2>&1 | tr '\r' '\n' | tee /tmp/cargo-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "::error title=cargo-test::unit tests failed"
            tail -n 60 /tmp/cargo-test.log
            exit "$code"
          fi

      - name: Tauri build (NSIS + MSI, ${{ matrix.arch }})
        working-directory: apps/desktop-tauri
        shell: bash
        env:
          # Wave15 A: updater signing key, read from repo secrets. On branch
          # runs these secrets are NOT configured -> empty -> we skip signing
          # (build still produces the installers, just no .sig sidecars). On
          # tag releases the maintainer sets them and `tauri build` additionally
          # writes <installer>.exe.sig next to each bundle.
          TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set +e
          # Map the (optional) secrets onto the env vars the Tauri CLI actually
          # reads. Only export when a key is present, so a missing secret (the
          # branch-run norm) means "skip signing", never "fail the build".
          if [ -n "${TAURI_SIGNING_KEY:-}" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$TAURI_SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_KEY_PASSWORD:-}"
            echo "updater signing: ENABLED (private key loaded from TAURI_SIGNING_KEY secret)"
          else
            echo "updater signing: SKIPPED (TAURI_SIGNING_KEY secret not set) — installers built unsigned, no .sig produced"
          fi
          echo "::group::tauri CLI version"
          ./node_modules/.bin/tauri --version
          echo "::endgroup::"
          # Invoke the CLI binary directly: the desktop shell lives outside the
          # pnpm workspace, so `pnpm exec` resolves against the root and fails
          # to find the local tauri binary. Normalize CR so cargo progress does
          # not collapse into one giant line.
          start_ts=$(date +%s)
          ./node_modules/.bin/tauri build --ci ${{ matrix.extra_args }} 2>&1 | tr '\r' '\n' | tee /tmp/tauri-build.log
          code=${PIPESTATUS[0]}
          echo "tauri build exit=$code elapsed=$(( $(date +%s)-start_ts ))s"
          if [ "$code" != "0" ]; then
            echo "::group::tauri build failure tail"
            tail -n 20 /tmp/tauri-build.log
            echo "::endgroup::"
            # Annotations are readable on the run page anonymously. GitHub caps
            # each level at 10 per step, so emit the previous 10 lines as
            # warnings and the LAST 10 as errors.
            tail -n 20 /tmp/tauri-build.log | sed -n '1,10p' | while IFS= read -r line; do
              echo "::warning title=tauri-${{ matrix.arch }}-ctx::${line:0:900}"
            done
            tail -n 20 /tmp/tauri-build.log | sed -n '11,20p' | while IFS= read -r line; do
              echo "::error title=tauri-${{ matrix.arch }}-tail::${line:0:900}"
            done
            exit "$code"
          fi

      # ------------------------------------------------------------------
      # Wave24: webviewInstallMode 已正式切换为 embedBootstrapper（落盘在
      # tauri.conf.json bundle.windows.nsis.webviewInstallMode）。
      #   (a) NSIS package size AFTER the switch (embedBootstrapper stub bundled
      #       into setup.exe). The "before" number (downloadBootstrapper = 4.65 MB
      #       x64) is from Wave15 run 37609717113, see docs/wave24/webview2-bootstrapper-embed.md.
      #   (c) Microsoft Evergreen Standalone (offline) Runtime installer sizes —
      #       kept as the restore source for the no-WebView2 smoke below and as
      #       the size reference for the offline-runtime job.
      # Wave15's Measure(b) (inline --config override build) is gone:
      # embedBootstrapper is now the committed default, so the normal tauri
      # build above already produces the embed package; no override/restore-rebuild
      # cycle is needed.
      # ------------------------------------------------------------------
      - name: 'Measure (a): NSIS installer size (embedBootstrapper, after)'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Select-Object -First 1
          $mb = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "::notice title=wv2-embedAfter-${{ matrix.arch }}::NSIS setup.exe (embedBootstrapper) = $mb MB ($($installer.Name))"
          Write-Host "EMBED_NSIS_MB_${{ matrix.arch }}=$mb"

      - name: 'Measure (c): download Evergreen Standalone Runtime installers, print sizes'
        shell: bash
        timeout-minutes: 10
        # Informational data collection only (records offline runtime sizes for
        # the WebView2 bundling decision AND serves as the restore source for the
        # no-WebView2 smoke). Microsoft fwlinks occasionally drop the transfer on
        # shared runners (curl exit 18); a failed download must never gate the
        # release: retry, then warn and continue. The no-WebView2 smoke below uses
        # these files to REINSTALL WebView2 after the environment-prep uninstall.
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p /tmp/wv2
          # Microsoft fwlinks: Evergreen Standalone (offline) installers.
          #   x64 = LinkId 2124703, x86 = 2124701, arm64 = 2124699
          declare -A LINKS=(
            [x64]="https://go.microsoft.com/fwlink/p/?LinkId=2124703"
            [x86]="https://go.microsoft.com/fwlink/p/?LinkId=2124701"
            [arm64]="https://go.microsoft.com/fwlink/p/?LinkId=2124699"
          )
          for arch in x64 x86 arm64; do
            out="/tmp/wv2/MicrosoftEdgeWebView2RuntimeInstaller${arch}.exe"
            code=$(curl -L --silent --show-error --retry 3 --retry-all-errors               --output "$out" --write-out '%{http_code}' "${LINKS[$arch]}" || echo "000")
            sz=$(stat -c %s "$out" 2>/dev/null || echo 0)
            mb=$(awk "BEGIN{printf \"%.2f\", $sz/1048576}")
            echo "::notice title=wv2-standalone-$arch::HTTP $code, Evergreen Standalone $arch = $mb MB ($sz bytes)"
          done
          ls -la /tmp/wv2 || true

      # ------------------------------------------------------------------
      # Smoke tests (Wave 12 C). See docs/wave12/windows-smoke.md for design.
      #
      # - "fresh web assets" runs on BOTH arches: it only inspects files on
      #   disk, no execution.
      # - install / launch / uninstall steps are gated to `matrix.arch ==
      #   'x64'`: the windows-latest runner is x64 hardware, so an aarch64
      #   PE built here cannot be launched (Win32 loader rejects it). The
      #   steps stay in the YAML for arm64 but are skipped, never faked green.
      # ------------------------------------------------------------------
      - name: 'Smoke (both arches): bundled web assets contain a fresh index-*.js'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Search both the raw frontend build output (packages/web/dist,
          # produced by `pnpm -r build` in the previous step) and the Tauri
          # target tree (where tauri copies the bundle for packaging). The
          # actual copy location differs between the default x64 target dir
          # and the aarch64-pc-windows-msvc cross target, so cast a wide net.
          $roots = @(
            'packages/web/dist',
            'apps/desktop-tauri/src-tauri/target'
          )
          Write-Host "::group::Scanning roots for index-*.js"
          $files = @()
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $found = Get-ChildItem -Path $r -Recurse -Filter 'index-*.js' -File -ErrorAction SilentlyContinue
              if ($found) { $files += $found }
              Write-Host "  scanned: $r"
            } else {
              Write-Host "  (missing root, skipped): $r"
            }
          }
          if (-not $files) {
            Write-Error "Smoke FAIL: no index-*.js found under any of: $($roots -join ', ') (packaged web bundle may be missing)"
          }
          $newest = $files | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          Write-Host ("Found {0} index-*.js file(s):" -f $files.Count)
          $files | ForEach-Object { Write-Host ("  - {0}  ({1:o})" -f $_.FullName, $_.LastWriteTimeUtc) }
          $ageMin = (New-TimeSpan -Start $newest.LastWriteTimeUtc -End (Get-Date).ToUniversalTime()).TotalMinutes
          Write-Host ("Newest index-*.js age = {0:N1} min" -f $ageMin)
          if ($ageMin -gt 15) {
            Write-Error ("Smoke FAIL: newest index-*.js is {0:N1} min old (>15 min); packaged resources look stale" -f $ageMin)
          }
          Write-Host "Smoke OK: bundled web assets are fresh"
          Write-Host "::endgroup::"

      # ------------------------------------------------------------------
      # Wave24 HARD GATE: no-WebView2 -> embedded bootstrapper -> main window.
      #
      # This proves the embedBootstrapper package actually rescues a machine
      # that has NO WebView2 runtime installed: the NSIS setup.exe must run its
      # bundled bootstrapper, install the Evergreen runtime from Microsoft CDN,
      # and launch the drawpaper main window.
      #
      # Env prep (uninstall WebView2) is best-effort (try/catch, never throws)
      # because hosted runners may protect the preinstalled runtime; the
      # install / exit-code / main-window assertions below are HARD gates.
      # See docs/wave24/webview2-bootstrapper-embed.md.
      # ------------------------------------------------------------------
      - name: 'Smoke (x64): no-WebView2 -> embedded bootstrapper -> main window (HARD GATE)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-WebView2Present {
            # Evergreen runtime marker: msedgewebview2.exe under Application dir,
            # or the EdgeUpdate client-state registry key.
            $exe = Get-ChildItem -Path 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Filter 'msedgewebview2.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { return $true }
            $reg = Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
            if ($reg) { return $true }
            return $false
          }

          # ---- env prep (best-effort, never throws) ----
          $beforeWv2 = Test-WebView2Present
          Write-Host "WebView2 present BEFORE env prep: $beforeWv2"
          $wv2Destroyed = $false
          try {
            Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            $uninst = Get-ChildItem -Path 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Recurse -Filter 'setup.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Installer[\\/]setup\.exe$' } | Select-Object -First 1
            if ($uninst) {
              Write-Host "Running WebView2 uninstaller: $($uninst.FullName)"
              $u = Start-Process -FilePath $uninst.FullName -ArgumentList '--uninstall','--mswebview-runtime','--system-level','/silent','/norestart' -PassThru -Wait
              Write-Host "WebView2 uninstaller exit code: $($u.ExitCode)"
            } else {
              Write-Host "::warning title=wv2-uninstaller::No EdgeWebView setup.exe found (runner may lack WebView2 or layout changed)"
            }
            Start-Sleep -Seconds 3
            $afterWv2 = Test-WebView2Present
            Write-Host "WebView2 present AFTER uninstall attempt: $afterWv2"
            if ($beforeWv2 -and -not $afterWv2) { $wv2Destroyed = $true }
            Write-Host "wv2Destroyed = $wv2Destroyed (before=$beforeWv2 after=$afterWv2)"
          } catch {
            Write-Host "::warning title=wv2-env-prep::WebView2 env prep threw (best-effort, continuing): $_"
          }

          # ---- HARD GATE: silent install of the embed package ----
          $installer = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Select-Object -First 1
          if (-not $installer) { Write-Error 'Smoke FAIL: NSIS *-setup.exe not found under target/**/bundle/nsis' }
          Write-Host "Embed setup.exe = $($installer.FullName) ($([math]::Round($installer.Length/1MB,2)) MB)"

          Write-Host "Running silent embed install: /S /CURRENTUSER"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S','/CURRENTUSER' -PassThru
          $bootstrapperSeen = $false
          for ($w = 0; $w -lt 150; $w++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if (-not $p.HasExited) {
              $bv = Get-Process -ErrorAction SilentlyContinue | Where-Object {
                $_.ProcessName -match '(?i)(webview.*boot|MicrosoftEdgeWebView2RuntimeInstaller)' -or
                ($_.Path -and $_.Path -match '(?i)WebView2.*Bootstrapper')
              }
              if ($bv) {
                $bootstrapperSeen = $true
                Write-Host ("t={0,3}s bootstrapper child seen: {1} (pid {2}) path={3}" -f ($w/2), $bv[0].ProcessName, $bv[0].Id, $bv[0].Path)
              }
            }
            if ($p.HasExited) { break }
          }
          Write-Host "Installer exited = $($p.HasExited)"
          if (-not $p.HasExited) { Write-Error 'Smoke FAIL: embed installer did not exit within 75s (likely a blocking dialog)' }
          Write-Host "Installer exit code = $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "Smoke FAIL: embed installer exited $($p.ExitCode)" }

          Write-Host "bootstrapper process observed during install: $bootstrapperSeen"
          if ($wv2Destroyed -and -not $bootstrapperSeen) {
            Write-Host "::warning title=wv2-bootstrapper-anchor::WebView2 was destroyed but no bootstrapper child process observed (pattern may have missed; install/exit still green)"
          }
          if (-not $wv2Destroyed) {
            Write-Host "::notice title=wv2-bootstrapper-anchor::WebView2 was pre-installed (env-prep could not remove it); bootstrapper anchor not exercised. Installer exit 0 still proven."
          }

          # ---- HARD GATE: drawpaper installed ----
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if ($c -and (Test-Path $c)) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: drawpaper install dir not found after embed install' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $exe -or -not (Test-Path $exe)) { Write-Error "Smoke FAIL: drawpaper.exe not found under $installDir" }
          Write-Host "Installed drawpaper.exe = $exe"

          # ---- HARD GATE: main window title contains drawpaper (bounded 30s) ----
          Write-Host "Launching drawpaper.exe for main-window assertion"
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 1
            $dp = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dp) {
              $dp.Refresh()
              $title = $dp.MainWindowTitle
              if ($i % 5 -eq 0 -or $title) {
                Write-Host ("t={0,2}s pid={1} MainWindowTitle='{2}'" -f $i, $dp.Id, $title)
              }
              if ($title -and $title.ToLower().Contains('drawpaper')) { $ok = $true; break }
            }
          }
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) {
            Write-Error 'Smoke FAIL: drawpaper main window title did not contain "drawpaper" within 30s after embed-install first launch'
          }
          Write-Host "Smoke OK: embed bootstrapper first-install — installer exit 0, drawpaper.exe present, main window title contains 'drawpaper'"

          # ---- cleanup: uninstall drawpaper so the standard smoke flow starts clean ----
          $uninst = Get-ChildItem $installDir -Filter 'uninst*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninst) { $uninst = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($uninst) {
            Write-Host "Cleanup: running uninstaller $($uninst.FullName) /S"
            $u = Start-Process -FilePath $uninst.FullName -ArgumentList '/S' -PassThru
            for ($w = 0; $w -lt 60; $w++) { Start-Sleep -Seconds 1; $u.Refresh(); if ($u.HasExited) { break } }
            Write-Host "Uninstaller exited = $($u.HasExited) code = $($u.ExitCode)"
            Start-Sleep -Seconds 2
          } else {
            Write-Host "::warning title=wv2-cleanup-uninst::No uninstaller in $installDir (subsequent smoke will install over)"
          }

          # ---- restore WebView2 for downstream smokes ----
          $afterRestore = Test-WebView2Present
          Write-Host "WebView2 present after smoke (before restore): $afterRestore"
          if (-not $afterRestore) {
            $standalone = 'C:\tmp\wv2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
            # Measure(c) writes to /tmp/wv2 under bash shell, which maps to C:\Users\runneradmin\AppData\Local\Temp on Windows.
            if (-not (Test-Path $standalone)) {
              $standalone = Join-Path $env:RUNNER_TEMP 'wv2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
            }
            if (-not (Test-Path $standalone)) {
              # Fallback: search common temp locations.
              $found = Get-ChildItem -Path $env:TEMP -Recurse -Filter 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $standalone = $found.FullName }
            }
            if (Test-Path $standalone) {
              Write-Host "Restoring WebView2 via Evergreen Standalone: $standalone"
              $r = Start-Process -FilePath $standalone -ArgumentList '/silent','/norestart' -PassThru -Wait
              Write-Host "Standalone installer exit code: $($r.ExitCode)"
              Start-Sleep -Seconds 3
            } else {
              Write-Host "::warning title=wv2-restore::WebView2 missing and standalone installer not found (Measure(c) download may have failed)"
            }
          }
          $finalWv2 = Test-WebView2Present
          Write-Host "WebView2 present FINAL: $finalWv2"
          Write-Host "::notice title=wv2-embed-smoke::no-WebView2 embed-install smoke complete (wv2Destroyed=$wv2Destroyed bootstrapperSeen=$bootstrapperSeen windowTitleOK=$ok wv2Final=$finalWv2)"

      - name: 'Smoke (x64): silent NSIS install, exe present, ProductVersion matches tauri.conf'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          # 1) Expected version straight from tauri.conf.json (branch runs have
          #    no release tag name; the source of truth is the conf file).
          $tauriConf = Get-Content -Raw 'apps/desktop-tauri/src-tauri/tauri.conf.json' | ConvertFrom-Json
          $expectedVersion = $tauriConf.version
          Write-Host "tauri.conf.json version (raw) = '$expectedVersion'"

          # 2) Locate the NSIS installer produced by `tauri build`.
          $installer = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1
          if (-not $installer) { Write-Error 'Smoke FAIL: NSIS *-setup.exe not found under target/**/bundle/nsis' }
          Write-Host "Installer = $($installer.FullName)"

          # 3) Silent install. nsis.installMode is "both": on an elevated
          #    runner (GitHub windows-latest runs as admin) the bare /S install
          #    defaults to perMachine and lands under Program Files. To keep the
          #    CI smoke on the stable per-user path (no UAC, predictable install
          #    dir), pass /CURRENTUSER explicitly. Tauri 2 NSIS "both" mode
          #    accepts the standard NSIS /CURRENTUSER flag; if it is ignored on
          #    a future Tauri bump, the Program Files candidates in step 4 will
          #    still catch the per-machine landing and log it for diagnosis.
          Write-Host "Running silent install: Start-Process /S /CURRENTUSER"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S','/CURRENTUSER' -PassThru
          for ($w = 0; $w -lt 120; $w++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
          }
          Write-Host "Installer exited = $($p.HasExited)"
          if (-not $p.HasExited) { Write-Error 'Smoke FAIL: silent installer did not exit within 120s (likely a blocking dialog)' }
          Write-Host "Installer exit code = $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "Smoke FAIL: silent installer exited $($p.ExitCode)" }

          # 4) Discover install dir. installMode="both" means the silent
          #    installer may land in either:
          #      - currentUser: %LOCALAPPDATA%\Programs\drawpaper
          #      - perMachine: %ProgramFiles%\drawpaper (C:\Program Files)
          #    Probe both; fall back to a generic child-dir discovery under
          #    each root.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (${env:ProgramFiles(x86)} | ForEach-Object { Join-Path $_ 'drawpaper' })
          )
          $installDir = $null
          foreach ($c in $candidates) {
            if ($c) {
              Write-Host "  candidate: $c => exists=$(Test-Path $c)"
              if ((Test-Path $c) -and -not $installDir) { $installDir = $c }
            }
          }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) {
            Write-Host "::group::Leftover dirs under %LOCALAPPDATA% / Program Files"
            Get-ChildItem $env:LOCALAPPDATA -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem $env:ProgramFiles -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL: install dir not found after silent install (tried LOCALAPPDATA\Programs\drawpaper, LOCALAPPDATA\drawpaper, ProgramFiles\drawpaper, ProgramFiles(x86)\drawpaper)'
          }
          Write-Host "Install dir (matched) = $installDir"

          # 5) Locate drawpaper.exe.
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { Write-Error "Smoke FAIL: drawpaper.exe not found under $installDir" }
          Write-Host "App exe = $exe"

          # 6) Version assertion with normalization.
          #    Windows ProductVersion can rewrite a pre-release tag:
          #    tauri.conf '0.1.0-rc.4' may come back as '0.1.0.4' (the 'rc'
          #    label dropped, revision number bumped). We therefore compare
          #    the NUMERIC token sequences (split on any non-digit run),
          #    padding the shorter side with trailing zeros, and print both
          #    raw values for the log.
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed exe ProductVersion (raw) = '$productVersion'"
          Write-Host "tauri.conf version           (raw) = '$expectedVersion'"
          function Get-NumTokens([string]$v) {
            if (-not $v) { return @() }
            return @([regex]::Matches($v, '\d+') | ForEach-Object { [int]$_.Value })
          }
          $exp = Get-NumTokens $expectedVersion
          $got = Get-NumTokens $productVersion
          Write-Host ("Normalized numeric tokens - expected: [{0}]" -f ($exp -join '.'))
          Write-Host ("Normalized numeric tokens - got:      [{0}]" -f ($got -join '.'))
          # Pad to equal length with trailing zeros.
          $max = [Math]::Max($exp.Count, $got.Count)
          while ($exp.Count -lt $max) { $exp += 0 }
          while ($got.Count -lt $max) { $got += 0 }
          $mismatch = @(Compare-Object $exp $got -SyncWindow 0)
          if ($mismatch.Count -ne 0) {
            Write-Error ("Smoke FAIL: version mismatch. tauri.conf='$expectedVersion' vs ProductVersion='$productVersion'")
          }
          Write-Host "Smoke OK: installed exe present and numeric version tokens match"

      - name: 'Smoke (x64): .kbnote registry association registered (HKCU/HKLM)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: Tauri fileAssociations (bundle.fileAssociations[].ext =
          # ["kbnote"]) makes the NSIS installer write a per-ext registration.
          # For installMode=currentUser the hive is HKCU:\Software\Classes;
          # for a per-machine (elevated) install it lands in HKLM. Probe BOTH
          # hives and accept whichever exists with a non-empty default value
          # (the default value is the ProgID). This way the step stays green
          # whether the runner installed per-user (currentUser) or per-machine
          # (both + UAC).
          $hives = @(
            'HKCU:\Software\Classes\.kbnote',
            'HKLM:\Software\Classes\.kbnote'
          )
          $hit = $null
          foreach ($h in $hives) {
            $exists = Test-Path $h
            $default = ''
            if ($exists) {
              try {
                $item = Get-Item -Path $h -ErrorAction Stop
                $default = [string]$item.GetValue('')
              } catch {
                $default = ''
              }
            }
            Write-Host ("  probe {0} => exists={1} default='{2}'" -f $h, $exists, $default)
            if ($exists -and $default.Trim() -ne '') { $hit = $h; break }
          }
          if (-not $hit) {
            Write-Host "::group::HKCU/HKLM Classes\.kbnote dump"
            foreach ($h in $hives) {
              if (Test-Path $h) {
                Write-Host "  $h :"
                Get-ItemProperty -Path $h -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
              } else {
                Write-Host "  $h : (missing)"
              }
            }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL: .kbnote registry association not found (HKCU or HKLM) with non-empty default value'
          }
          Write-Host "Smoke OK: .kbnote file association registered at $hit (ProgID default non-empty)"

      - name: 'Smoke (x64): desktop + start-menu shortcuts present (user/public)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: NSIS installer should drop a drawpaper.lnk on the desktop
          # and an entry under Start Menu. installMode=currentUser writes to the
          # per-user desktop ([Environment]::GetFolderPath('Desktop') resolves
          # localized "桌面" correctly) and per-user Start Menu Programs.
          # installMode=both with elevation additionally writes to public/common
          # desktop and common Start Menu. Probe BOTH user and public locations;
          # at least one desktop lnk and at least one start-menu lnk must exist.
          $desktopUser = [Environment]::GetFolderPath('Desktop')
          $desktopCommon = [Environment]::GetFolderPath('CommonDesktopDirectory')
          Write-Host ("  user desktop   = '{0}'" -f $desktopUser)
          Write-Host ("  public desktop = '{0}'" -f $desktopCommon)
          $desktopHits = @()
          foreach ($d in @($desktopUser, $desktopCommon)) {
            if ($d -and (Test-Path $d)) {
              $lnk = Join-Path $d 'drawpaper.lnk'
              Write-Host ("    probe {0} => exists={1}" -f $lnk, (Test-Path $lnk))
              if (Test-Path $lnk) { $desktopHits += $lnk }
            }
          }
          $smRoots = @(
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'),
            (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs')
          )
          $smHits = @()
          foreach ($r in $smRoots) {
            Write-Host ("  start menu root: {0} => exists={1}" -f $r, (Test-Path $r))
            if (Test-Path $r) {
              $found = Get-ChildItem -Path $r -Recurse -Filter 'drawpaper*.lnk' -File -ErrorAction SilentlyContinue
              if ($found) { $smHits += $found.FullName }
            }
          }
          Write-Host ("Desktop shortcut hits ({0}):" -f $desktopHits.Count)
          $desktopHits | ForEach-Object { Write-Host "  - $_" }
          Write-Host ("Start-menu shortcut hits ({0}):" -f $smHits.Count)
          $smHits | ForEach-Object { Write-Host "  - $_" }
          if ($desktopHits.Count -lt 1) {
            Write-Error 'Smoke FAIL: no drawpaper.lnk found on user or public desktop'
          }
          if ($smHits.Count -lt 1) {
            Write-Error 'Smoke FAIL: no drawpaper*.lnk found under user or common Start Menu Programs'
          }
          Write-Host "Smoke OK: desktop and start-menu shortcuts present"

      - name: 'Smoke (x64): launch exe, main window title contains drawpaper, then kill'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve install dir the same way the install step does. installMode
          # "both" may land per-user (%LOCALAPPDATA%\Programs\drawpaper) or
          # per-machine (%ProgramFiles%\drawpaper); probe both.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at launch time' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host ("Start-Process returned pid={0}" -f $proc.Id)
          $ok = $false
          # WebView2 main window title can lag several seconds behind process
          # start; poll up to 20s, Refresh() each sample so MainWindowTitle is
          # re-read live, and accept ANY sample whose title contains drawpaper.
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              for ($s = 1; $s -le 3; $s++) {
                $p.Refresh()
                $title = $p.MainWindowTitle
                Write-Host ("t={0,2}s sample={1} pid={2} MainWindowTitle='{3}'" -f $i, $s, $p.Id, $title)
                if ($title -and ($title.ToLower().Contains('drawpaper'))) {
                  $ok = $true
                  break
                }
                Start-Sleep -Milliseconds 300
              }
            } else {
              Write-Host ("t={0,2}s: drawpaper process not found yet" -f $i)
            }
            if ($ok) { break }
          }
          # Best-effort cleanup of any leftover drawpaper AND its WebView2
          # child processes; otherwise the uninstaller below can hit a
          # "files in use" dialog and hang on Start-Process -Wait.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) {
            Write-Error 'Smoke FAIL: drawpaper process did not present a main window whose title contains "drawpaper" within 20s'
          }
          Write-Host "Smoke OK: process alive and main window title contains 'drawpaper'"

      - name: 'Smoke (x64): global shortcuts register without crashing'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve install dir the same way the install step does.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found for global-shortcut smoke' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru

          # The Rust side logs an anchor on startup:
          #   "global-shortcuts: registered N of M bindings"
          # We assert the process stays alive AND the anchor shows up in
          # drawpaper.log. We do NOT simulate the actual hotkey press from CI
          # (that requires focus, which is a manual QA item).
          $dataRoots = @($env:APPDATA, $env:LOCALAPPDATA) | ForEach-Object { Join-Path $_ 'com.drawpaper.app' }
          $anchor = 'global-shortcuts: registered'
          $found = $false
          for ($i = 1; $i -le 25; $i++) {
            Start-Sleep -Seconds 1
            # Process must stay alive (a panic during shortcut registration would kill it).
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $p) { break }
            foreach ($root in $dataRoots) {
              $logCand = Join-Path $root 'logs\drawpaper.log'
              if (-not (Test-Path $logCand)) {
                $alt = Get-ChildItem -Path $root -Recurse -Filter 'drawpaper.log' -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($alt) { $logCand = $alt.FullName }
              }
              if (Test-Path $logCand) {
                # Copy first: the appender may hold the log open.
                $copy = Join-Path $env:TEMP ('gssh-logcopy-' + [guid]::NewGuid().ToString('N') + '.log')
                Copy-Item $logCand $copy -Force -ErrorAction SilentlyContinue
                $content = Get-Content -Raw $copy -ErrorAction SilentlyContinue
                if ($content -and $content.Contains($anchor)) { $found = $true; break }
              }
            }
            if ($found) { break }
            if (($i % 5) -eq 0) { Write-Host ("t={0,2}s anchorFound={1}" -f $i, $found) }
          }

          # Cleanup before the next step.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          if (-not $p) { Write-Error 'Smoke FAIL: drawpaper process died during/after global-shortcut registration (check drawpaper.log for panic)' }
          if (-not $found) { Write-Error "Smoke FAIL: drawpaper.log did not contain '$anchor' within 25s (registration may have failed silently; see log dump)" }
          Write-Host "Smoke OK: process survived global-shortcut registration and log anchor seen"

      - name: 'Smoke (x64): second launch absorbed by running instance (single-instance)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          # Wave13 C: tauri-plugin-single-instance is registered first in
          # Builder::default() (see apps/desktop-tauri/src-tauri/src/lib.rs).
          # Launching drawpaper.exe a second time while one instance is already
          # running must NOT spawn a second drawpaper.exe process — the plugin
          # forwards the argv (the .kbnote path, if any) to the running window
          # via the `second-instance` event and exits the second process. We
          # assert that after two Start-Process calls, the count of
          # "drawpaper" processes is exactly 1. WebView2 child processes are
          # named msedgewebview2.exe, so they do not inflate this count.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at single-instance check' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Clean slate: any leftover from the window-title step should already
          # be dead, but be explicit so the count assertion below is not
          # polluted by a previous run.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # First launch. Poll up to 20s for the process to be alive.
          Write-Host "First launch"
          $null = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          $firstAlive = $false
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $alive = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
            if ($alive) {
              Write-Host ("t={0,2}s first instance alive, count={1}" -f $i, ($alive | Measure-Object).Count)
              $firstAlive = $true
              break
            }
            Write-Host ("t={0,2}s waiting for first instance..." -f $i)
          }
          if (-not $firstAlive) {
            Write-Error 'Smoke FAIL: first drawpaper instance did not stay alive'
          }

          # Second launch — same exe, same working directory. The single-
          # instance plugin should make this second process exit itself after
          # forwarding argv to the running instance.
          Write-Host "Second launch (must be absorbed by the running instance)"
          $p2 = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          Write-Host ("Second Start-Process returned pid={0}" -f $p2.Id)

          # Poll up to 15s for the drawpaper process count to settle at 1.
          # Pass as soon as we see count==1; fail if it stays >1.
          $count = 0
          for ($i = 1; $i -le 15; $i++) {
            Start-Sleep -Seconds 1
            $procs = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
            $count = ($procs | Measure-Object).Count
            Write-Host ("t=+{0,2}s after second launch, drawpaper count = {1}" -f $i, $count)
            if ($count -eq 1) { break }
          }

          # Cleanup all drawpaper + its WebView2 children before uninstall step.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          if ($count -ne 1) {
            Write-Error ("Smoke FAIL: expected exactly 1 drawpaper process after second launch, observed {0} (single-instance not holding?)" -f $count)
          }
          Write-Host "Smoke OK: second launch absorbed by running instance (process count = 1)"

      # ------------------------------------------------------------------
      # Wave15 D: three extra x64 smokes on top of the original seven.
      # Each repeats the installDir probe (same as above), cleans up leftover
      # drawpaper + its WebView2 children on entry/exit, and uses bounded polls
      # (no bare -Wait) so a hung dialog can never hang the job. arm64 steps are
      # skipped by the matrix gate, never faked green.
      # ------------------------------------------------------------------
      - name: 'Smoke (x64): cold-start .kbnote file association (canary log + recents)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve install dir (identical probe to the install/launch steps).
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found for cold-start file assoc' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Clean slate (single-instance absorb would otherwise swallow the launch).
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # Write a minimal valid .kbnote carrying a unique canary token into a
          # temp dir, then launch drawpaper.exe WITH that path as argv[1] — this
          # mimics Explorer / command-line file-association open.
          $canary = 'CANARY-' + ([guid]::NewGuid().ToString('N'))
          $tmpDir = Join-Path $env:TEMP ('dp-smoke-' + ([guid]::NewGuid().ToString('N')))
          New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
          $docPath = Join-Path $tmpDir ($canary + '.kbnote')
          # Build a minimal valid .kbnote via a hashtable -> JSON (avoids a
          # PowerShell here-string, whose '@' closer must sit at column 0 and
          # would prematurely end this YAML block scalar).
          $doc = [ordered]@{
            format    = 'knowledge-block-notes'
            version   = 1
            id        = 'doc_coldstart_canary'
            title     = $canary
            board     = [ordered]@{ createdAt = 0; updatedAt = 0 }
            nodes     = @()
            edges     = @()
            tags      = @()
            layout    = [ordered]@{ mode = 'mindmap-right'; rankSpacing = 90; nodeSpacing = 28 }
            viewport  = [ordered]@{ x = 0; y = 0; zoom = 1 }
            page      = [ordered]@{ size='A4'; orientation='portrait'; marginMm=15; mode='fit'; showPageBreak=$true; colorMode='color'; header=$false; footer=$false; showPageNumbers=$false; edgeLabels=$true; pageBreaks=@() }
            assetRefs = @()
          }
          [System.IO.File]::WriteAllText($docPath, ($doc | ConvertTo-Json -Depth 6), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Canary doc = $docPath (token=$canary)"

          Write-Host "Launching: drawpaper.exe <canary.kbnote>"
          $null = Start-Process -FilePath $exe -ArgumentList $docPath -WorkingDirectory $installDir -PassThru

          # Bounded poll: process alive + main window title contains drawpaper.
          $ok = $false
          for ($i = 1; $i -le 25; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              $p.Refresh()
              $title = $p.MainWindowTitle
              Write-Host ("t={0,2}s pid={1} MainWindowTitle='{2}'" -f $i, $p.Id, $title)
              if ($title -and ($title.ToLower().Contains('drawpaper'))) { $ok = $true; break }
            } else {
              Write-Host ("t={0,2}s: drawpaper process not found" -f $i)
            }
          }
          if (-not $ok) {
            Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Error 'Smoke FAIL: cold-start .kbnote launch did not present a drawpaper window within 25s'
          }

          # Evidence: drawpaper.log must record the open-file (Wave15 D added the
          # success-path log line; the error path already logged). The recents JSON
          # must contain the canary path. NOTE BOUNDARY: this proves the OS->Rust
          # hand-off (argv[1] read, current_path bound, recents pushed); whether the
          # WebView canvas actually rendered the doc on cold start depends on the
          # known setup()-phase event race (see docs/wave15/desktop-gap-audit.md),
          # which CI UI automation does not assert.
          #
          # PATH DISCOVERY (not assumption): tauri-plugin-log's app_log_dir and the
          # recents app_config_dir may resolve to Roaming (%APPDATA%) OR Local
          # (%LOCALAPPDATA%) com.drawpaper.app depending on the Tauri version.
          # Search BOTH and discover where they actually landed instead of hardcoding.
          $dataRoots = @($env:APPDATA, $env:LOCALAPPDATA) | ForEach-Object { Join-Path $_ 'com.drawpaper.app' }
          Write-Host ("Searching data roots: {0}" -f ($dataRoots -join ' ; '))
          $logHit = $false
          $recentsHit = $false
          $unreadableSeen = $false
          $foundLog = $null
          $foundRecents = $null
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 1
            foreach ($root in $dataRoots) {
              $logCand = Join-Path $root 'logs\drawpaper.log'
              if (-not (Test-Path $logCand)) {
                $alt = Get-ChildItem -Path $root -Recurse -Filter 'drawpaper.log' -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($alt) { $logCand = $alt.FullName }
              }
              $recCand = Join-Path $root 'drawpaper-recents.json'
              if ((-not $logHit) -and (Test-Path $logCand)) {
                $foundLog = $logCand
                # Copy first: the appender may hold the log open; reading via a
                # copy avoids a sharing-violation on the live file.
                $copy = Join-Path $env:TEMP ('logcopy-' + [guid]::NewGuid().ToString('N') + '.log')
                Copy-Item $logCand $copy -Force
                $content = Get-Content -Raw $copy -ErrorAction SilentlyContinue
                if ($content) {
                  if (($content -match 'open-file') -and $content.Contains($canary)) { $logHit = $true }
                  if ($content -match 'unreadable') { $unreadableSeen = $true }
                }
              }
              if ((-not $recentsHit) -and (Test-Path $recCand)) {
                $foundRecents = $recCand
                $rc = Get-Content -Raw $recCand -ErrorAction SilentlyContinue
                if ($rc -and $rc.Contains($canary)) { $recentsHit = $true }
              }
            }
            if (($i % 3) -eq 0 -or $logHit -or $recentsHit) {
              Write-Host ("t=+{0,2}s logHit={1} recentsHit={2} unreadable={3} foundLog={4}" -f $i, $logHit, $recentsHit, $unreadableSeen, $foundLog)
            }
            if ($logHit -and $recentsHit) { break }
          }

          # Diagnostics dump: show exactly what landed under each data root so any
          # path mismatch is visible in the run log even on failure.
          Write-Host "::group::data tree dump (cold-start)"
          Write-Host ("APPDATA={0} ; LOCALAPPDATA={1}" -f $env:APPDATA, $env:LOCALAPPDATA)
          foreach ($root in $dataRoots) {
            Write-Host " root: $root exists=$(Test-Path $root)"
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 40 |
                ForEach-Object { Write-Host ("   {0}  ({1} bytes)" -f $_.FullName.Substring($root.Length), $_.Length) }
            }
          }
          if ($foundLog) {
            Write-Host "--- drawpaper.log tail ---"
            Get-Content $foundLog -Tail 25 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "--- no drawpaper.log found under any searched root ---"
          }
          Write-Host "::endgroup::"

          # Cleanup before the next step.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          if ($unreadableSeen) { Write-Error 'Smoke FAIL: Rust reported the canary .kbnote as unreadable (see log dump above)' }
          if (-not $logHit) { Write-Error 'Smoke FAIL: no open-file log record for the canary .kbnote (searched Roaming+Local com.drawpaper.app\logs\drawpaper.log; see data tree dump)' }
          if (-not $recentsHit) { Write-Error 'Smoke FAIL: drawpaper-recents.json does not contain the canary path (searched Roaming+Local; see data tree dump)' }
          Write-Host "Smoke OK: cold-start .kbnote association — process alive, title ok, log+recents prove Rust processed the file"

      - name: 'Smoke (x64): cold-start open-file delivered 10/10 (no event loss)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve install dir (identical probe to the cold-start step above).
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found for 10x cold-start open-file loop' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Data roots: search BOTH Roaming (%APPDATA%) and Local (%LOCALAPPDATA%)
          # com.drawpaper.app (do not hardcode %APPDATA%; tauri-plugin-log may
          # resolve to either, same as the single cold-start smoke above).
          $dataRoots = @($env:APPDATA, $env:LOCALAPPDATA) | ForEach-Object { Join-Path $_ 'com.drawpaper.app' }
          $tmpRoot = Join-Path $env:TEMP ('dp-coldloop-' + ([guid]::NewGuid().ToString('N')))
          New-Item -ItemType Directory -Path $tmpRoot -Force | Out-Null

          function Stop-Drawpaper {
            Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

          $passCount = 0
          for ($n = 1; $n -le 10; $n++) {
            Write-Host "::group==> cold-start iteration $n / 10"
            Stop-Drawpaper

            # Unique canary: GUID + iteration index baked into filename and body.
            $guid = [guid]::NewGuid().ToString('N')
            $canary = "CANARY-$n-$guid"
            $docPath = Join-Path $tmpRoot ("$canary.kbnote")
            $doc = [ordered]@{
              format    = 'knowledge-block-notes'
              version   = 1
              id        = "doc_coldloop_$n"
              title     = $canary
              board     = [ordered]@{ createdAt = 0; updatedAt = 0 }
              nodes     = @()
              edges     = @()
              tags      = @()
              layout    = [ordered]@{ mode = 'mindmap-right'; rankSpacing = 90; nodeSpacing = 28 }
              viewport  = [ordered]@{ x = 0; y = 0; zoom = 1 }
              page      = [ordered]@{ size='A4'; orientation='portrait'; marginMm=15; mode='fit'; showPageBreak=$true; colorMode='color'; header=$false; footer=$false; showPageNumbers=$false; edgeLabels=$true; pageBreaks=@() }
              assetRefs = @()
            }
            [System.IO.File]::WriteAllText($docPath, ($doc | ConvertTo-Json -Depth 6), (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "  canary[$n] = $docPath"

            $null = Start-Process -FilePath $exe -ArgumentList $docPath -WorkingDirectory $installDir -PassThru

            # Bounded poll: window appears (title contains drawpaper).
            $winOk = $false
            for ($i = 1; $i -le 25; $i++) {
              Start-Sleep -Seconds 1
              $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($p) { $p.Refresh(); if ($p.MainWindowTitle -and ($p.MainWindowTitle.ToLower().Contains('drawpaper'))) { $winOk = $true; break } }
            }
            if (-not $winOk) { Write-Host "  FAIL[$n]: no drawpaper window within 25s" }

            # Bounded evidence poll: drawpaper.log must record THIS canary's open-file
            # AND recents.json must contain the canary path. This proves the event
            # was delivered to (and processed by) the app — not just received by Rust.
            $logHit = $false
            $recHit = $false
            for ($i = 1; $i -le 20; $i++) {
              Start-Sleep -Seconds 1
              foreach ($root in $dataRoots) {
                $logCand = Join-Path $root 'logs\drawpaper.log'
                if (-not (Test-Path $logCand)) {
                  $alt = Get-ChildItem -Path $root -Recurse -Filter 'drawpaper.log' -File -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($alt) { $logCand = $alt.FullName }
                }
                if ((-not $logHit) -and (Test-Path $logCand)) {
                  $copy = Join-Path $env:TEMP ('logcopy-' + [guid]::NewGuid().ToString('N') + '.log')
                  Copy-Item $logCand $copy -Force
                  $content = Get-Content -Raw $copy -ErrorAction SilentlyContinue
                  if ($content -and $content.Contains($canary)) { $logHit = $true }
                }
                $recCand = Join-Path $root 'drawpaper-recents.json'
                if ((-not $recHit) -and (Test-Path $recCand)) {
                  $rc = Get-Content -Raw $recCand -ErrorAction SilentlyContinue
                  if ($rc -and $rc.Contains($canary)) { $recHit = $true }
                }
              }
              if ($logHit -and $recHit) { break }
            }
            Write-Host ("  iter[$n] winOk={0} logHit={1} recHit={2}" -f $winOk, $logHit, $recHit)
            Stop-Drawpaper
            if ($winOk -and $logHit -and $recHit) { $passCount++; Write-Host "  PASS[$n]" } else { Write-Host "  FAIL[$n] (winOk=$winOk logHit=$logHit recHit=$recHit)" }
            Write-Host "::endgroup::"
          }

          # Cleanup temp dir.
          Remove-Item -Path $tmpRoot -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host ("==== cold-start open-file delivery: {0}/10 ====" -f $passCount)
          if ($passCount -ne 10) {
            Write-Error ("Smoke FAIL: cold-start open-file delivered only {0}/10 (expected 10/10, no event loss)" -f $passCount)
          }
          Write-Host "Smoke OK: cold-start open-file delivered 10/10 across 10 fresh launches (no event loss)"

      - name: 'Smoke (x64): first-run welcome doc lands in WebView2 leveldb, no dup on 2nd run'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found for welcome-doc check' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }

          # Wipe/search BOTH Roaming (%APPDATA%) and Local (%LOCALAPPDATA%)
          # com.drawpaper.app roots — the WebView2 EBWebView user-data folder may
          # land in either depending on the Tauri version. Do not assume one.
          $dataRoots = @($env:APPDATA, $env:LOCALAPPDATA) | ForEach-Object { Join-Path $_ 'com.drawpaper.app' }

          # Kill, then wipe the WHOLE app data dir(s) so this is a true first run
          # (the earlier launch steps already wrote the welcome flag once).
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          foreach ($root in $dataRoots) {
            if (Test-Path $root) {
              Write-Host "Wiping app data dir to force first run: $root"
              Remove-Item -Path $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          # Also wipe any pre-existing EBWebView anywhere under Local/Roaming so the
          # welcome flag is truly gone regardless of where WebView2 put it.
          foreach ($root in @($env:LOCALAPPDATA, $env:APPDATA)) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Directory -Filter 'EBWebView' -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "Wiping EBWebView: $($_.FullName)"; Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
            }
          }

          # Locate EBWebView anywhere under Local/Roaming AND next to the exe —
          # Tauri 2 may place the WebView2 user-data folder outside com.drawpaper.app.
          function Find-EBWebView {
            $dirs = @()
            foreach ($root in @($env:LOCALAPPDATA, $env:APPDATA, $installDir)) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Recurse -Directory -Filter 'EBWebView' -ErrorAction SilentlyContinue
              if ($hit) { $dirs += ($hit | ForEach-Object { $_.FullName }) }
            }
            return ($dirs | Select-Object -Unique)
          }
          # Byte-level substring search. Select-String treats leveldb as text lines
          # and binary framing breaks matching; reading raw bytes + ASCII Contains
          # reliably finds the marker strings in both the uncompressed WAL (.log)
          # and any already-compacted .ldb.
          function Test-WelcomeMarkers {
            # Returns the number of files containing either welcome marker string.
            $hits = 0
            foreach ($ebRoot in (Find-EBWebView)) {
              $files = Get-ChildItem -Path $ebRoot -Recurse -File -ErrorAction SilentlyContinue
              foreach ($f in $files) {
                try {
                  $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
                  $text = [System.Text.Encoding]::ASCII.GetString($bytes)
                  if ($text.Contains('doc_welcome_v1') -or $text.Contains('drawpaper:welcome-doc-v1')) {
                    $hits += 1
                  }
                } catch { /* locked/skip */ }
              }
            }
            return $hits
          }

          Write-Host "First launch (fresh app data)"
          $null = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru

          # Confirm the app actually booted before polling leveldb (WebView2 cold
          # init after a full wipe is slow; a crash here would otherwise look like
          # 'no welcome markers').
          $booted = $false
          for ($i = 1; $i -le 25; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) { $p.Refresh(); if ($p.MainWindowTitle -and $p.MainWindowTitle.ToLower().Contains('drawpaper')) { $booted = $true; break } }
          }
          Write-Host "App booted (window title ok) = $booted"

          # Give the app time to boot React, run bootstrap(), create the welcome
          # doc and write the localStorage flag.
          Start-Sleep -Seconds 20
          # Gracefully close (WM_CLOSE) so WebView2 flushes localStorage/IndexedDB
          # to disk before we grep — an abrupt Stop-Process -Force loses the
          # in-memory writes. Fall back to force-kill if it won't close.
          $dp = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
          if ($dp) { $dp | ForEach-Object { $_.CloseMainWindow() | Out-Null } }
          for ($i = 1; $i -le 10; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue)) { break }
          }
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $firstHits = Test-WelcomeMarkers
          Write-Host "First-run welcome-marker files = $firstHits"

          # Diagnostics: show where EBWebView landed and what files exist.
          Write-Host "::group::welcome-doc diagnostics"
          Write-Host ("EBWebView dirs found: {0}" -f ((Find-EBWebView) -join ' ; '))
          foreach ($root in $dataRoots) {
            Write-Host " root: $root exists=$(Test-Path $root)"
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 50 |
                ForEach-Object { Write-Host ("   {0}  ({1} bytes)" -f $_.FullName.Substring($root.Length), $_.Length) }
            }
          }
          Write-Host "::endgroup::"

          # The log plugin forwards webview console to drawpaper.log — dump it to
          # reveal any boot error (e.g. __TAURI__ missing, bootstrap throw).
          foreach ($root in $dataRoots) {
            $logCand = Join-Path $root 'logs\drawpaper.log'
            if (Test-Path $logCand) {
              Write-Host "::group::drawpaper.log tail (welcome-doc step) :: $logCand"
              Get-Content $logCand -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
              Write-Host "::endgroup::"
            }
          }

          if ($firstHits -lt 1) {
            Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Error 'Smoke FAIL: welcome markers (doc_welcome_v1 / drawpaper:welcome-doc-v1) not found in EBWebView leveldb within 60s after confirmed boot'
          }

          # Kill, relaunch; the localStorage flag must already be set so the
          # welcome doc is NOT re-created.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Write-Host "Second launch (must not re-create welcome doc)"
          $null = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 15
          # Graceful close so WebView2 flushes, then grep.
          $dp2 = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue
          if ($dp2) { $dp2 | ForEach-Object { $_.CloseMainWindow() | Out-Null } }
          for ($i = 1; $i -le 10; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue)) { break }
          }
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $secondHits = Test-WelcomeMarkers
          Write-Host "Second-run welcome-marker files = $secondHits (first = $firstHits)"

          # Marker must still be present on the second run (persistence). The
          # no-recreate guarantee is the localStorage flag already being set.
          if ($secondHits -lt 1) {
            Write-Error ("Smoke FAIL: welcome markers vanished on second run (first={0}, second={1})" -f $firstHits, $secondHits)
          }
          Write-Host "Smoke OK: welcome doc created on first run, flag persisted on second (marker files $firstHits -> $secondHits)"

      # Wave23 E: the headless CLI assertion suite (version / usage-marker /
      # bounded headless lifecycle / --diag-export privacy canary) used to live
      # inline here. It is now extracted to the SHARED script
      # apps/desktop-tauri/ci/smoke-cli.ps1 so the identical suite also runs on
      # the native arm64 runner. The script's assertion set is equal-or-stronger
      # than this inline block: it keeps the full privacy canary (no *.kbnote,
      # no assets/, canary string zero hits, system.json fields, manifest
      # exactly name/size/mtime) and additionally re-checks BOTH the exe file
      # ProductVersion AND the diag system.json.version against tauri.conf.
      - name: 'Smoke (x64): headless CLI suite (version / usage / lifecycle + diag privacy canary)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          # Discover install dir the same way the prior steps do.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at CLI smoke' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"
          & 'apps/desktop-tauri/ci/smoke-cli.ps1' -ExePath $exe -Arch x64
          Write-Host "Smoke OK: headless CLI suite passed (x64)"

      - name: 'Smoke (x64): portable mode (marker + data-dir trigger + isolation + reinstall)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve the already-installed drawpaper.exe the same way the install
          # step does (installMode="both" may land per-user or per-machine).
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: portable smoke could not locate install dir for the installed drawpaper.exe' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { Write-Error "Smoke FAIL: installed exe not found at $exe" }
          Write-Host "Installed exe to copy into portable trees: $exe"

          # Case c reuses the NSIS *-setup.exe this build just produced (same
          # version). The embedBootstrapper measure rebuilds were followed by a
          # normal nsis rebuild, so the on-disk bundle/nsis installer matches the
          # installed app.
          $setup = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1
          if ($setup) { Write-Host "NSIS setup for reinstall case c: $($setup.FullName)" }
          else { Write-Host '::notice title=portable-smoke::NSIS *-setup.exe not found — case c will self-skip' }

          # Self-contained script (a marker+isolation / b data-dir trigger / c
          # reinstall). It kills all drawpaper before each launch, bounded-polls,
          # and does a final global process sweep so the uninstall step below is
          # never blocked by a leftover portable process. Run it in this pwsh
          # process; its own `exit 0/1` sets the step result directly.
          $script = 'apps/desktop-tauri/ci/smoke-portable.ps1'
          Write-Host "Running: $script -ExePath $exe -WaitSeconds 15$(if ($setup) { ' -SetupExePath <setup.exe>' })"
          if ($setup) {
            & $script -ExePath $exe -WaitSeconds 15 -SetupExePath $setup.FullName
          } else {
            & $script -ExePath $exe -WaitSeconds 15
          }
          Write-Host "Smoke OK: portable-mode cases passed"
      # Wave18 P1: native-autosave headless selftest. The installed exe carries a
      # hidden pre-Tauri-builder CLI (`--native-autosave-selftest <dir>`) that writes
      # one test .kbnote + one test asset under a unique temp dir, asserts its own
      # readback, and proves join_within() rejects ../ traversal and absolute paths.
      # We mirror the diag canary's `cmd /c ... > log 2>&1` capture: drawpaper.exe is
      # a GUI-subsystem binary, so PowerShell native redirect can lose the handle.
      - name: 'Smoke (x64): native-autosave headless selftest (mirror files + traversal rejection)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          # Discover install dir / exe exactly like the prior smoke steps.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at native-autosave selftest' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Isolate this run: unique temp dir so no prior run can contaminate.
          $selftestDir = Join-Path $env:TEMP ("dp-selftest-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $selftestDir | Out-Null
          $outLog = Join-Path $env:TEMP ('dp-selftest-' + [guid]::NewGuid().ToString('N') + '.log')
          $expectedDoc  = '{"format":"knowledge-block-notes","version":4}'
          $expectedAsset = 'FAKE-ASSET-BYTES'

          function Invoke-Selftest($dir, $logPath) {
            Remove-Item $logPath -ErrorAction SilentlyContinue
            # Build the cmd /c line with an OUTER quoted pair around the whole
            # payload: Start-Process joins -ArgumentList raw (no re-quoting), so
            # cmd.exe would otherwise see six raw quotes and apply its "strip
            # first+last quote" rule, mangling the exe path. Wrapping the payload
            # in extra outer quotes makes cmd strip THOSE instead — the inner
            # quoting survives exactly like the diag canary's direct pwsh call.
            $argLine = '/c "' + '"' + $exe + '" --native-autosave-selftest "' + $dir + '" > "' + $logPath + '" 2>&1"'
            Write-Host "Running: cmd.exe $argLine"
            $cp = Start-Process -FilePath 'cmd.exe' -ArgumentList $argLine -PassThru -WindowStyle Hidden
            for ($w = 0; $w -lt 60; $w++) {
              Start-Sleep -Seconds 1
              $cp.Refresh()
              if ($cp.HasExited) { break }
            }
            if (-not $cp.HasExited) {
              Stop-Process -Id $cp.Id -Force -ErrorAction SilentlyContinue
              Write-Error 'Smoke FAIL: --native-autosave-selftest did not exit within 60s'
            }
            return $cp.ExitCode
          }

          # --- Run 1: full assertions. -------------------------------------
          $code = Invoke-Selftest $selftestDir $outLog
          Write-Host "selftest run-1 exit code = $code"
          Write-Host "::group::selftest captured stdout/stderr"
          if (Test-Path $outLog) { Get-Content $outLog | ForEach-Object { Write-Host "  | $_" } } else { Write-Host "  (no output file)" }
          Write-Host "::endgroup::"
          if ($code -ne 0) { Write-Error "Smoke FAIL: native-autosave selftest exited $code on run 1" }
          $logText = if (Test-Path $outLog) { Get-Content -Raw $outLog } else { '' }
          if ($logText -notmatch 'selftest OK') { Write-Error "Smoke FAIL: selftest output missing 'selftest OK' marker (got: $logText)" }

          $docPath = Join-Path $selftestDir 'selftest-doc.kbnote'
          if (-not (Test-Path $docPath)) { Write-Error "Smoke FAIL: $docPath not written" }
          $docBytes = [System.IO.File]::ReadAllBytes($docPath)
          $docText = [System.Text.Encoding]::UTF8.GetString($docBytes)
          Write-Host ("doc bytes = {0} (expected {1})" -f $docBytes.Length, $expectedDoc.Length)
          if ($docText -cne $expectedDoc) { Write-Error ("Smoke FAIL: selftest-doc.kbnote content mismatch: got '{0}'" -f $docText) }

          $assetPath = Join-Path $selftestDir 'assets\abc123def'
          if (-not (Test-Path $assetPath)) { Write-Error "Smoke FAIL: $assetPath not written" }
          $assetBytes = [System.IO.File]::ReadAllBytes($assetPath)
          Write-Host ("asset bytes = {0} (content = {1})" -f $assetBytes.Length, [System.Text.Encoding]::ASCII.GetString($assetBytes))
          if ($assetBytes.Length -ne $expectedAsset.Length) { Write-Error ("Smoke FAIL: asset length {0} != {1}" -f $assetBytes.Length, $expectedAsset.Length) }
          if ([System.Text.Encoding]::ASCII.GetString($assetBytes) -cne $expectedAsset) { Write-Error 'Smoke FAIL: asset bytes != FAKE-ASSET-BYTES' }

          # Traversal must have been REJECTED: no evil*.kbnote inside the temp
          # dir, and nothing written one level UP (../evil.kbnote would land here).
          $leakedInDir  = Get-ChildItem $selftestDir -Recurse -Filter 'evil*.kbnote' -File -ErrorAction SilentlyContinue
          $leakedParent = Get-ChildItem (Split-Path $selftestDir -Parent) -Filter 'evil*.kbnote' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-5) }
          if ($leakedInDir -or $leakedParent) {
            $leakedInDir  | ForEach-Object { Write-Host "TRAVERSAL LEAK: $($_.FullName)" }
            $leakedParent | ForEach-Object { Write-Host "TRAVERSAL LEAK (parent): $($_.FullName)" }
            Write-Error 'Smoke FAIL: traversal-rejected paths still produced an evil*.kbnote on disk'
          }
          Write-Host 'Traversal rejection OK: no evil*.kbnote in temp dir or its parent'

          # --- Run 2: idempotency against the SAME dir (overwrite path). ---
          $code2 = Invoke-Selftest $selftestDir $outLog
          Write-Host "selftest run-2 (idempotent) exit code = $code2"
          if ($code2 -ne 0) { Write-Error "Smoke FAIL: native-autosave selftest exit $code2 on repeated run (must be idempotent)" }
          if ((Get-Content -Raw $outLog) -notmatch 'selftest OK') { Write-Error 'Smoke FAIL: second selftest run output missing OK marker' }

          # Cleanup.
          Remove-Item $selftestDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $outLog -ErrorAction SilentlyContinue
          Write-Host "Smoke OK: native-autosave selftest passed (run 1 + idempotent run 2, mirror files exact, traversal rejected)"

      # ------------------------------------------------------------------
      # Wave18 P4 (updater offline fallback / diagnostics-menu UI): 时间盒评估结论——
      # SendKeys 驱动原生菜单/保存对话框在 hosted runner 上不具备确定性（桌面会话焦点、
      # 菜单动画、IME），按收紧口径不接 workflow（不用 continue-on-error 掩盖）。
      # 脚本保留在 apps/desktop-tauri/ci/ 供手动调用；手动步骤与调研结论见
      # docs/wave18/ci-hardening.md。同路径的隐私断言已由上方 --diag-export 金丝雀覆盖。
      # ------------------------------------------------------------------

      # Wave19 C: headless updater-fallback probe smoke. The installed exe carries
      # a hidden pre-builder CLI (`--update-check-probe <endpoint>`) that does ONE
      # blocking GET (8s timeout, no retry) and prints `decision=...`. We point it
      # at a closed loopback port (127.0.0.1:1 = connection refused = unreachable)
      # and assert: exit 0, stdout contains `decision=fallback-releases`, and the
      # process actually exits within 30s (proves no hang, no dialog, no webview).
      # The 404 / malformed-manifest / up-to-date / update-available branches are
      # covered by the pure-function `cargo test` above (no network needed).
      - name: 'Smoke (x64): updater fallback probe (unreachable endpoint -> releases page, no hang)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at updater fallback probe' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"

          # Closed loopback port = immediate ECONNREFUSED -> unreachable -> fallback.
          $endpoint = 'http://127.0.0.1:1/'
          $outLog = Join-Path $env:TEMP ('dp-updater-probe-' + [guid]::NewGuid().ToString('N') + '.log')
          $diagFile = Join-Path $env:TEMP 'drawpaper-updater-probe.txt'
          Remove-Item $outLog -ErrorAction SilentlyContinue
          Remove-Item $diagFile -ErrorAction SilentlyContinue
          # Same outer-quote wrapping trick as the native-autosave selftest smoke.
          $argLine = '/c "' + '"' + $exe + '" --update-check-probe "' + $endpoint + '" > "' + $outLog + '" 2>&1"'
          Write-Host "Running: cmd.exe $argLine"
          $cp = Start-Process -FilePath 'cmd.exe' -ArgumentList $argLine -PassThru -WindowStyle Hidden
          for ($w = 0; $w -lt 60; $w++) {
            Start-Sleep -Seconds 1
            $cp.Refresh()
            if ($cp.HasExited) { break }
          }
          if (-not $cp.HasExited) {
            Stop-Process -Id $cp.Id -Force -ErrorAction SilentlyContinue
            Write-Error 'Smoke FAIL: --update-check-probe did not exit within 60s (hang / dialog / webview leaked)'
          }
          $code = $cp.ExitCode
          Write-Host "updater-probe exit code = $code"
          # The exe writes its stage anchors + decision to $diagFile (authoritative,
          # disk-backed; stdout capture from a GUI-subsystem process is unreliable).
          # Poll it briefly so we catch a late flush.
          $diagText = ''
          for ($w = 0; $w -lt 10; $w++) {
            $diagText = if (Test-Path $diagFile) { Get-Content -Raw $diagFile } else { '' }
            if ($diagText -match 'decision=') { break }
            Start-Sleep -Seconds 1
          }
          $logText = if (Test-Path $outLog) { Get-Content -Raw $outLog } else { '' }
          Write-Host "::group::updater-probe diag file + stdout/stderr"
          Write-Host "  | diag: $diagText"
          Write-Host "  | stdout: $logText"
          Write-Host "::endgroup::"
          # Surface diagnostics as ::error annotations so they are visible without
          # expanding the raw (sign-in-gated) step log.
          if ($code -ne 0) {
            Write-Host "::error file=updater-probe::updater-probe exited code=$code diag=$diagText stdout=$logText"
            Write-Error "Smoke FAIL: updater-probe exited $code"
          }
          if ($diagText -notmatch 'decision=fallback-releases') {
            Write-Host "::error file=updater-probe::updater-probe diag missing fallback-releases diag=$diagText stdout=$logText"
            Write-Error "Smoke FAIL: updater-probe diag missing 'decision=fallback-releases'"
          }
          Write-Host "Smoke OK: updater-probe unreachable endpoint -> fallback-releases, exit 0, no hang"

      - name: 'Smoke (x64): silent uninstall, install dir removed'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) {
            Write-Host "Install dir already absent; nothing to uninstall"
            exit 0
          }
          Write-Host "Install dir = $installDir"
          # Tauri NSIS currentUser uninstaller is unins000.exe in the install dir.
          $uninst = Get-ChildItem $installDir -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninst) { $uninst = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -File | Select-Object -First 1 }
          if (-not $uninst) {
            Write-Host "Entries under $installDir :"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "Smoke FAIL: uninstaller exe (unins*.exe / Uninstall*.exe) not found in $installDir"
          }
          Write-Host "Uninstaller = $($uninst.FullName)"
          # NSIS uninstaller accepts /S; some Tauri builds expect /SILENT.
          # Try /SILENT first, fall back to /S. Do NOT use -Wait blindly: a
          # "files in use" dialog would hang the step forever. Instead poll
          # the uninstaller process for up to 60s, then poll dir removal.
          $removed = $false
          foreach ($arg in @('/SILENT', '/S')) {
            Write-Host "Running uninstaller with arg '$arg'"
            $u = Start-Process -FilePath $uninst.FullName -ArgumentList $arg -PassThru
            # Wait up to 60s for the uninstaller process itself to exit.
            for ($w = 0; $w -lt 60; $w++) {
              Start-Sleep -Seconds 1
              $u.Refresh()
              if ($u.HasExited) { break }
            }
            Write-Host "Uninstaller ($arg) exited = $($u.HasExited)"
            for ($i = 1; $i -le 20; $i++) {
              Start-Sleep -Seconds 1
              if (-not (Test-Path $installDir)) { $removed = $true; break }
            }
            if ($removed) { break }
            Write-Host "  dir still present after '$arg'; trying next arg..."
          }
          if (-not $removed) {
            # Wave18 P2: last-resort sweep before declaring failure. Wave15 saw
            # one false-red on a loaded runner where the dir lingered only
            # because a residual drawpaper / uninstaller child still held a
            # handle. Kill known residual owners ONCE, print the action, then
            # re-poll 10s. This only ADDS a recovery path: if the dir still
            # survives, we still Write-Error below — a real uninstall failure
            # must stay red.
            Write-Host "::warning title=uninstall-residual-sweep::install dir still present; sweeping residual drawpaper/unins* processes before re-poll"
            Write-Host "Remaining files under $installDir (pre-sweep) :"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            $victims = Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'drawpaper*' -or $_.Name -like 'unins*' -or $_.Name -like 'uninstall*' }
            if ($victims) {
              $victims | ForEach-Object { Write-Host "  killing residual process: $($_.Name) (PID $($_.Id))" }
              $victims | Stop-Process -Force -ErrorAction SilentlyContinue
            } else {
              Write-Host '  no residual drawpaper/unins* process found'
            }
            Start-Sleep -Seconds 2
            for ($i = 1; $i -le 10; $i++) {
              Start-Sleep -Seconds 1
              if (-not (Test-Path $installDir)) { $removed = $true; break }
            }
            Write-Host "post-sweep re-poll: dir removed = $removed"
          }
          if (-not $removed) {
            Write-Host "Remaining files under $installDir (final) :"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "Smoke FAIL: install dir still present after silent uninstall (tried /SILENT and /S, residual-process sweep + 10s re-poll)"
          }
          Write-Host "Smoke OK: install dir removed after silent uninstall"

      # ------------------------------------------------------------------
      # MSI smoke tests (Wave 15 B). Runs ONLY on x64 and ONLY after the NSIS
      # uninstall step above has restored a clean machine. The WiX MSI is a
      # per-machine package (InstallScope=perMachine), so msiexec /qn lands
      # under C:\Program Files\drawpaper on the (admin) runner — a different
      # directory from the per-user NSIS install, so the two never overlap.
      # arm64 MSI is built but NOT executed (no ARM runner); gated below.
      # ------------------------------------------------------------------
      - name: 'Smoke (x64): silent MSI install, exe present, ProductVersion matches tauri.conf'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          # 1) Expected version straight from tauri.conf.json.
          $tauriConf = Get-Content -Raw 'apps/desktop-tauri/src-tauri/tauri.conf.json' | ConvertFrom-Json
          $expectedVersion = $tauriConf.version
          Write-Host "tauri.conf.json version (raw) = '$expectedVersion'"

          # 2) Locate the WiX MSI produced by `tauri build --bundles nsis,msi`.
          #    Wave19 A: wix.language=[en-US,zh-CN] -> two MSIs per arch land in
          #    the same bundle/msi dir. Pin the en-US culture explicitly (a bare
          #    *.msi + Select -First 1 would be ambiguous once both cultures exist).
          $msi = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*_x64_en-US.msi' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' } |
            Select-Object -First 1
          if (-not $msi) { Write-Error 'Smoke FAIL: *_x64_en-US.msi not found under target/**/bundle/msi' }
          Write-Host "MSI = $($msi.FullName) ($([math]::Round($msi.Length/1MB,2)) MB)"

          # 3) Silent per-machine install with a verbose log. /norestart keeps
          #    the runner from rebooting; 3010 == "success, reboot recommended"
          #    which we treat as success.
          $log = Join-Path $env:RUNNER_TEMP 'drawpaper-msi-install.log'
          Write-Host "Running: msiexec /i <msi> /qn /norestart /lv* <log>"
          $p = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/lv*', "`"$log`"" `
            -PassThru
          for ($w = 0; $w -lt 180; $w++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
          }
          Write-Host "msiexec exited = $($p.HasExited)"
          if (-not $p.HasExited) { Write-Error 'Smoke FAIL: msiexec did not exit within 180s' }
          Write-Host "msiexec exit code = $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Write-Host "::group::MSI install log tail"
            Get-Content $log -Tail 50 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            Write-Error "Smoke FAIL: msiexec /i exited $($p.ExitCode) (expected 0 or 3010)"
          }

          # 4) Discover install dir. Tauri WiX MSI is perMachine -> Program Files
          #    on x64. Probe Program Files / Program Files(x86) / LOCALAPPDATA and
          #    PRINT every hit so a landing change is obvious from the log.
          $candidates = @(
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (Join-Path ${env:ProgramFiles(x86)} 'drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper')
          )
          $script:msiInstallDir = $null
          foreach ($c in $candidates) {
            if ($c) {
              $exists = Test-Path $c
              Write-Host "  candidate: $c => exists=$exists"
              if ($exists -and -not $script:msiInstallDir) { $script:msiInstallDir = $c }
            }
          }
          if (-not $script:msiInstallDir) {
            Write-Host "::group::Leftover drawpaper dirs"
            Get-ChildItem $env:ProgramFiles -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'drawpaper*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL: MSI install dir not found (Program Files / Program Files(x86) / LOCALAPPDATA\Programs)'
          }
          Write-Host "MSI install dir (matched) = $($script:msiInstallDir)"

          # 5) Locate drawpaper.exe.
          $exe = Join-Path $script:msiInstallDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $script:msiInstallDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { Write-Error "Smoke FAIL: drawpaper.exe not found under $($script:msiInstallDir)" }
          Write-Host "App exe = $exe"

          # 6) Version assertion with the SAME numeric-token normalization the
          #    NSIS smoke uses (Windows can rewrite a pre-release tag).
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed exe ProductVersion (raw) = '$productVersion'"
          Write-Host "tauri.conf version           (raw) = '$expectedVersion'"
          function Get-NumTokens([string]$v) {
            if (-not $v) { return @() }
            return @([regex]::Matches($v, '\d+') | ForEach-Object { [int]$_.Value })
          }
          $exp = Get-NumTokens $expectedVersion
          $got = Get-NumTokens $productVersion
          Write-Host ("Normalized numeric tokens - expected: [{0}]" -f ($exp -join '.'))
          Write-Host ("Normalized numeric tokens - got:      [{0}]" -f ($got -join '.'))
          $max = [Math]::Max($exp.Count, $got.Count)
          while ($exp.Count -lt $max) { $exp += 0 }
          while ($got.Count -lt $max) { $got += 0 }
          $mismatch = @(Compare-Object $exp $got -SyncWindow 0)
          if ($mismatch.Count -ne 0) {
            Write-Error ("Smoke FAIL: MSI version mismatch. tauri.conf='$expectedVersion' vs ProductVersion='$productVersion'")
          }
          Write-Host "Smoke OK: MSI installed exe present and numeric version tokens match"

      - name: 'Smoke (x64 MSI): .kbnote registry association registered (HKCU/HKLM)'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Per-machine MSI should write HKLM\Software\Classes\.kbnote. Probe
          # both hives (mirrors the NSIS smoke) and accept a non-empty default.
          $hives = @(
            'HKLM:\Software\Classes\.kbnote',
            'HKCU:\Software\Classes\.kbnote'
          )
          $hit = $null
          foreach ($h in $hives) {
            $exists = Test-Path $h
            $default = ''
            if ($exists) {
              try {
                $item = Get-Item -Path $h -ErrorAction Stop
                $default = [string]$item.GetValue('')
              } catch { $default = '' }
            }
            Write-Host ("  probe {0} => exists={1} default='{2}'" -f $h, $exists, $default)
            if ($exists -and $default.Trim() -ne '') { $hit = $h; break }
          }
          if (-not $hit) {
            Write-Host "::group::HKCU/HKLM Classes\.kbnote dump"
            foreach ($h in $hives) {
              if (Test-Path $h) {
                Write-Host "  $h :"
                Get-ItemProperty -Path $h -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
              } else {
                Write-Host "  $h : (missing)"
              }
            }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL (MSI): .kbnote registry association not found (HKLM or HKCU) with non-empty default'
          }
          Write-Host "Smoke OK (MSI): .kbnote file association registered at $hit (ProgID default non-empty)"

      - name: 'Smoke (x64 MSI): desktop + start-menu shortcuts present'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          # Per-machine install writes to COMMON desktop + common Start Menu.
          # Probe both user and common locations; at least one desktop lnk and
          # at least one start-menu lnk must exist (same contract as NSIS).
          $desktopUser = [Environment]::GetFolderPath('Desktop')
          $desktopCommon = [Environment]::GetFolderPath('CommonDesktopDirectory')
          Write-Host ("  user desktop   = '{0}'" -f $desktopUser)
          Write-Host ("  public desktop = '{0}'" -f $desktopCommon)
          $desktopHits = @()
          foreach ($d in @($desktopUser, $desktopCommon)) {
            if ($d -and (Test-Path $d)) {
              $lnk = Join-Path $d 'drawpaper.lnk'
              Write-Host ("    probe {0} => exists={1}" -f $lnk, (Test-Path $lnk))
              if (Test-Path $lnk) { $desktopHits += $lnk }
            }
          }
          $smRoots = @(
            (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs')
          )
          $smHits = @()
          foreach ($r in $smRoots) {
            Write-Host ("  start menu root: {0} => exists={1}" -f $r, (Test-Path $r))
            if (Test-Path $r) {
              $found = Get-ChildItem -Path $r -Recurse -Filter 'drawpaper*.lnk' -File -ErrorAction SilentlyContinue
              if ($found) { $smHits += $found.FullName }
            }
          }
          Write-Host ("Desktop shortcut hits ({0}):" -f $desktopHits.Count)
          $desktopHits | ForEach-Object { Write-Host "  - $_" }
          Write-Host ("Start-menu shortcut hits ({0}):" -f $smHits.Count)
          $smHits | ForEach-Object { Write-Host "  - $_" }
          if ($desktopHits.Count -lt 1) {
            Write-Error 'Smoke FAIL (MSI): no drawpaper.lnk found on user or public desktop'
          }
          if ($smHits.Count -lt 1) {
            Write-Error 'Smoke FAIL (MSI): no drawpaper*.lnk found under user or common Start Menu Programs'
          }
          Write-Host "Smoke OK (MSI): desktop and start-menu shortcuts present"

      - name: 'Smoke (x64 MSI): launch exe, main window title contains drawpaper, then kill'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (Join-Path ${env:ProgramFiles(x86)} 'drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper')
          )
          $installDir = $null
          foreach ($c in $candidates) { if ($c -and (Test-Path $c)) { $installDir = $c; break } }
          if (-not $installDir) { Write-Error 'Smoke FAIL (MSI): install dir not found at launch time' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host ("Start-Process returned pid={0}" -f $proc.Id)
          $ok = $false
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              for ($s = 1; $s -le 3; $s++) {
                $p.Refresh()
                $title = $p.MainWindowTitle
                Write-Host ("t={0,2}s sample={1} pid={2} MainWindowTitle='{3}'" -f $i, $s, $p.Id, $title)
                if ($title -and ($title.ToLower().Contains('drawpaper'))) { $ok = $true; break }
                Start-Sleep -Milliseconds 300
              }
            } else {
              Write-Host ("t={0,2}s: drawpaper process not found yet" -f $i)
            }
            if ($ok) { break }
          }
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) {
            Write-Error 'Smoke FAIL (MSI): drawpaper process did not present a main window whose title contains "drawpaper" within 20s'
          }
          Write-Host "Smoke OK (MSI): process alive and main window title contains 'drawpaper'"

      - name: 'Smoke (x64 MSI): silent uninstall, install dir removed'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (Join-Path ${env:ProgramFiles(x86)} 'drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper')
          )
          $installDir = $null
          foreach ($c in $candidates) { if ($c -and (Test-Path $c)) { $installDir = $c; break } }
          if (-not $installDir) {
            Write-Host "MSI install dir already absent; nothing to uninstall"
            exit 0
          }
          Write-Host "Install dir = $installDir"
          # Best-effort kill of any running app / WebView2 children so the MSI
          # does not hit a files-in-use dialog.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # Re-locate the MSI to uninstall by product code path too, but the
          # simplest deterministic handle is the original .msi file on disk.
          # Wave19 A: bilingual MSIs coexist in bundle/msi; this step uninstalls
          # whatever the en-US install round above registered, so pin en-US.
          $msi = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*_x64_en-US.msi' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' } | Select-Object -First 1
          if (-not $msi) { Write-Error 'Smoke FAIL (MSI): cannot find *_x64_en-US.msi for uninstall' }
          $log = Join-Path $env:RUNNER_TEMP 'drawpaper-msi-uninstall.log'
          Write-Host "Running: msiexec /x <msi> /qn /norestart /lv* <log>"
          $u = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList '/x', "`"$($msi.FullName)`"", '/qn', '/norestart', '/lv*', "`"$log`"" `
            -PassThru
          for ($w = 0; $w -lt 120; $w++) {
            Start-Sleep -Seconds 1
            $u.Refresh()
            if ($u.HasExited) { break }
          }
          Write-Host "msiexec /x exited = $($u.HasExited)"
          if ($u.HasExited) { Write-Host "msiexec /x exit code = $($u.ExitCode)" }
          # Poll for dir removal up to 60s.
          $removed = $false
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Test-Path $installDir)) { $removed = $true; break }
          }
          if (-not $removed) {
            Write-Host "::group::Remaining files under $installDir"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "::group::MSI uninstall log tail"
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            Write-Error 'Smoke FAIL (MSI): install dir still present 60s after msiexec /x'
          }
          Write-Host "Smoke OK (MSI): install dir removed after silent uninstall"

      # ------------------------------------------------------------------
      # Wave19 A: zh-CN culture MSI smoke, HEAVILY instrumented so the
      # diagnostics are visible via check-run annotations (::error/::notice),
      # which the anonymous GitHub API can read without log access. Runs ONLY
      # on x64, strictly after the en-US round above fully uninstalled.
      # en-US and zh-CN share ProductCode/UpgradeCode; we poll the Uninstall
      # registry keys to confirm en-US is really deregistered before zh-CN.
      # ------------------------------------------------------------------
      - name: 'Smoke (x64 MSI zh-CN): silent install + uninstall, instrumented'
        if: matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-MsiProperty([string]$path, [string]$prop) {
            $wi = New-Object -ComObject WindowsInstaller.Installer
            $db = $wi.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$wi,@($path,0))
            $view = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@("SELECT Value FROM Property WHERE Property = '$prop'"))
            $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null)
            $rec = $view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)
            if ($null -eq $rec) { return $null }
            return $rec.GetType().InvokeMember('StringData','GetProperty',$null,$rec,1)
          }
          function Find-DrawpaperUninstallEntries {
            $k = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                   'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
                   'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall')
            $hits = @()
            foreach ($root in $k) {
              Get-ChildItem $root -ErrorAction SilentlyContinue | ForEach-Object {
                $p = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
                if ($p.DisplayName -like '*drawpaper*') {
                  $hits += ("{0} | DisplayName='{1}' | PSChildName={2}" -f $root, $p.DisplayName, $_.PSChildName)
                }
              }
            }
            return $hits
          }

          # 0) Inventory both culture MSIs: ProductCode/ProductLanguage/UpgradeCode.
          $msiDir = 'apps/desktop-tauri/src-tauri/target'
          $enMsi = Get-ChildItem -Path $msiDir -Recurse -Filter '*_x64_en-US.msi' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' } | Select-Object -First 1
          $zhMsi = Get-ChildItem -Path $msiDir -Recurse -Filter '*_x64_zh-CN.msi' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' } | Select-Object -First 1
          Write-Host "ALL MSIs under bundle/msi:"
          Get-ChildItem -Path $msiDir -Recurse -Filter '*.msi' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' } |
            ForEach-Object { Write-Host ("  {0}  ({1} bytes)" -f $_.Name, $_.Length) }
          if (-not $enMsi) { Write-Error 'zh-CN probe: en-US MSI not found' }
          if (-not $zhMsi) { Write-Host "::error title=zhcn-msi-missing::expected *_x64_zh-CN.msi not found in bundle/msi" ; Write-Error 'zh-CN probe: zh-CN MSI not found' }
          Write-Host "::notice title=zhcn-props::en-US ProductCode=$(Get-MsiProperty $enMsi.FullName 'ProductCode') ProductLanguage=$(Get-MsiProperty $enMsi.FullName 'ProductLanguage') UpgradeCode=$(Get-MsiProperty $enMsi.FullName 'UpgradeCode')"
          Write-Host "::notice title=zhcn-props::zh-CN ProductCode=$(Get-MsiProperty $zhMsi.FullName 'ProductCode') ProductLanguage=$(Get-MsiProperty $zhMsi.FullName 'ProductLanguage') UpgradeCode=$(Get-MsiProperty $zhMsi.FullName 'UpgradeCode')"

          # 1) Precondition: en-US round must have deregistered + removed dir.
          $pre = Join-Path $env:ProgramFiles 'drawpaper'
          if (Test-Path $pre) {
            Write-Host "::error title=zhcn-pre::install dir still present before zh-CN: $pre"
            Write-Error "zh-CN probe: $pre still present (en-US round did not clean up)"
          }
          $regHits = Find-DrawpaperUninstallEntries
          Write-Host "Uninstall entries for drawpaper BEFORE zh-CN install: $($regHits.Count)"
          $regHits | ForEach-Object { Write-Host "::notice title=zhcn-reg-before::$_" }

          # 2) Silent install zh-CN; emit exit code + log tail as annotations.
          $log = Join-Path $env:RUNNER_TEMP 'zhcn-install.log'
          Write-Host "Running: msiexec /i <zh-CN msi> /qn /norestart /lv* <log>"
          $p = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList '/i', "`"$($zhMsi.FullName)`"", '/qn', '/norestart', '/lv*', "`"$log`"" `
            -PassThru
          for ($w = 0; $w -lt 180; $w++) { Start-Sleep -Seconds 1; $p.Refresh(); if ($p.HasExited) { break } }
          if (-not $p.HasExited) { Write-Host "::error title=zhcn-install::msiexec did not exit within 180s" ; Write-Error 'zh-CN probe: install msiexec timeout 180s' }
          Write-Host "::notice title=zhcn-install::exitcode=$($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Write-Host "::error title=zhcn-install::unexpected exitcode=$($p.ExitCode) (want 0 or 3010)" ; Write-Error "zh-CN install failed, exitcode=$($p.ExitCode)" }
          # Definitive install outcome line + scope/dir hints.
          Get-Content $log -ErrorAction SilentlyContinue |
            Where-Object { $_ -match 'Installation success or error status|InstallScope|InstallDir|ProductCode|Adding schedule|Deleting|Created Install|Note: 1:|returned actual|value 3|MainEngineThread' } |
            Select-Object -Last 25 | ForEach-Object { Write-Host "::notice title=zhcn-install-key::$_" }

          # 3) Assert install: broad forensic search for where drawpaper.exe landed.
          $cands = @(
            (Join-Path $env:ProgramFiles 'drawpaper'),
            (${env:ProgramFiles(x86)} + '\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper')
          )
          foreach ($c in $cands) { Write-Host "::notice title=zhcn-dir-cand::Test-Path [$c] = $(Test-Path $c)" }
          $exe = $null
          foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)}, (Join-Path $env:LOCALAPPDATA 'Programs'))) {
            if (Test-Path $root) {
              $found = Get-ChildItem -Path $root -Recurse -Filter 'drawpaper.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $exe = $found.FullName; break }
            }
          }
          Write-Host "::notice title=zhcn-assert::drawpaper.exe found at = [$exe]"
          if (-not $exe) { Write-Host "::error title=zhcn-assert::drawpaper.exe not found anywhere under Program Files/LOCALAPPDATA" ; Write-Error 'zh-CN probe: exe not found after install exit 0' }
          Write-Host "::notice title=zhcn-assert::installed ProductVersion=$((Get-Item $exe).VersionInfo.ProductVersion)"
          $installDir = Split-Path $exe -Parent

          # 4) Uninstall zh-CN; emit exit code + log tail.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $ulog = Join-Path $env:RUNNER_TEMP 'zhcn-uninstall.log'
          Write-Host "Running: msiexec /x <zh-CN msi> /qn /norestart /lv* <log>"
          $u = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList '/x', "`"$($zhMsi.FullName)`"", '/qn', '/norestart', '/lv*', "`"$ulog`"" `
            -PassThru
          for ($w = 0; $w -lt 120; $w++) { Start-Sleep -Seconds 1; $u.Refresh(); if ($u.HasExited) { break } }
          Write-Host "::notice title=zhcn-uninstall::exitcode=$($u.ExitCode)"
          if ($u.ExitCode -ne 0 -and $u.ExitCode -ne 3010) { Write-Host "::error title=zhcn-uninstall::unexpected exitcode=$($u.ExitCode) (want 0 or 3010)" ; Write-Error "zh-CN uninstall failed, exitcode=$($u.ExitCode)" }
          Get-Content $ulog -Tail 60 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::notice title=zhcn-uninstall-log::$_" }
          $removed = $false
          for ($i = 1; $i -le 60; $i++) { Start-Sleep -Seconds 1; if (-not (Test-Path $installDir)) { $removed = $true; break } }
          Write-Host "::notice title=zhcn-uninstall::dir-removed=$removed"
          $regAfter = Find-DrawpaperUninstallEntries
          Write-Host "Uninstall entries for drawpaper AFTER zh-CN uninstall: $($regAfter.Count)"
          $regAfter | ForEach-Object { Write-Host "::notice title=zhcn-reg-after::$_" }
          if (-not $removed) { Write-Error 'zh-CN probe: install dir still present 60s after uninstall' }
          Write-Host "Smoke OK (zh-CN): install/uninstall probe complete"

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsis-${{ matrix.arch }}
          path: |
            apps/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe.sig
          # The .sig sidecars only exist on signed (tag) builds; .exe always
          # exists, so the upload never fails on unsigned branch runs.
          if-no-files-found: error
          retention-days: 30

      - name: List MSI artifacts to upload (name + size evidence)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*.msi' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]msi[\\/]' } | Sort-Object Name
          Write-Host ("MSI files under bundle/msi ({0}):" -f $msis.Count)
          foreach ($m in $msis) {
            Write-Host "::notice title=msi-file::$($m.Name) = $($m.Length) bytes"
          }
          if ($msis.Count -lt 1) { Write-Error 'No MSI files found under bundle/msi' }

      - name: Upload MSI installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-${{ matrix.arch }}
          path: |
            apps/desktop-tauri/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # Wave19: NATIVE arm64 smoke on the hosted `windows-11-arm` runner.
  #
  # This job is intentionally INDEPENDENT of build/publish:
  #   - it does its own checkout/toolchain/build and proves the arm64
  #     installers INSTALL, RUN and UNINSTALL on real ARM64 hardware;
  #   - it feeds NOTHING into publish — publish still ships the arm64
  #     installers produced by the x64 CROSS build (nsis-arm64/msi-arm64
  #     artifacts). Uploading our bundles here would collide with those
  #     artifact names, so we upload only failure logs.
  # Hard evidence of real ARM64 (asserted in the first step):
  #   PROCESSOR_ARCHITECTURE == ARM64 AND rustc host triple == aarch64-pc-windows-msvc.
  # ------------------------------------------------------------------
  arm64-native:
    runs-on: windows-11-arm
    env:
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arch evidence — assert this runner is REALLY native ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PROCESSOR_ARCHITECTURE = '$env:PROCESSOR_ARCHITECTURE'"
          Write-Host "PROCESSOR_IDENTIFIER  = '$env:PROCESSOR_IDENTIFIER'"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            Write-Error "FAIL: expected PROCESSOR_ARCHITECTURE=ARM64 on windows-11-arm runner, got '$env:PROCESSOR_ARCHITECTURE'"
          }
          Write-Host '::group::rustc -vV'
          rustc -vV
          Write-Host '::endgroup::'
          $rustcHost = ((rustc -vV) | Select-String '^host:').ToString().Trim()
          Write-Host "rustc host line: '$rustcHost'"
          if ($rustcHost -notmatch 'host: aarch64-pc-windows-msvc') {
            Write-Error "FAIL: rustc host triple is not aarch64-pc-windows-msvc (got '$rustcHost') — native compile not confirmed"
          }
          Write-Host "OK: runner is native ARM64 (PROCESSOR_ARCHITECTURE=ARM64, rustc host=aarch64-pc-windows-msvc)"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Install Tauri CLI (desktop shell, outside the pnpm workspace)
        working-directory: apps/desktop-tauri
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org/

      - name: Add Rust target (native arm64 host; explicit parity with build matrix)
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build web frontend
        run: pnpm -r build

      - name: Tauri build arm64 (NSIS + MSI, native runner)
        working-directory: apps/desktop-tauri
        shell: bash
        env:
          # Same signing logic as the build matrix job: on branch runs the
          # secret is absent -> signing skipped (unsigned installers), never a
          # build failure.
          TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set +e
          if [ -n "${TAURI_SIGNING_KEY:-}" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$TAURI_SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_KEY_PASSWORD:-}"
            echo "updater signing: ENABLED (private key loaded from TAURI_SIGNING_KEY secret)"
          else
            echo "updater signing: SKIPPED (TAURI_SIGNING_KEY secret not set) — installers built unsigned, no .sig produced"
          fi
          echo "::group::tauri CLI version"
          ./node_modules/.bin/tauri --version
          echo "::endgroup::"
          start_ts=$(date +%s)
          ./node_modules/.bin/tauri build --ci --bundles nsis,msi --target aarch64-pc-windows-msvc 2>&1 | tr '\r' '\n' | tee tauri-build.log
          code=${PIPESTATUS[0]}
          echo "tauri build exit=$code elapsed=$(( $(date +%s)-start_ts ))s"
          if [ "$code" != "0" ]; then
            echo "::group::tauri build failure tail"
            tail -n 30 tauri-build.log
            echo "::endgroup::"
            # Annotations are readable on the run page anonymously. GitHub caps
            # each level at 10 per step: warnings for the prev 10, errors for
            # the LAST 10 (Wave18-verified forensics pattern).
            tail -n 30 tauri-build.log | sed -n '1,20p' | while IFS= read -r line; do
              echo "::warning title=tauri-arm64native-ctx::${line:0:900}"
            done
            tail -n 30 tauri-build.log | sed -n '21,30p' | while IFS= read -r line; do
              echo "::error title=tauri-arm64native-tail::${line:0:900}"
            done
            exit "$code"
          fi

      - name: 'Smoke (arm64 native): silent NSIS install, exe present, ProductVersion matches tauri.conf'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "[arch] PROCESSOR_ARCHITECTURE='$env:PROCESSOR_ARCHITECTURE'"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { Write-Error "FAIL: not on ARM64 runner" }
          # 1) Expected version straight from tauri.conf.json.
          $tauriConf = Get-Content -Raw 'apps/desktop-tauri/src-tauri/tauri.conf.json' | ConvertFrom-Json
          $expectedVersion = $tauriConf.version
          Write-Host "tauri.conf.json version (raw) = '$expectedVersion'"
          # 2) Locate the NSIS installer produced by `tauri build`.
          $installer = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Select-Object -First 1
          if (-not $installer) { Write-Error 'Smoke FAIL: NSIS *-setup.exe not found under target/**/bundle/nsis' }
          Write-Host "Installer = $($installer.FullName)"
          # 3) Silent install: /S + /CURRENTUSER keeps the smoke on the stable
          #    per-user path (no UAC, predictable install dir), same as x64.
          Write-Host "Running silent install: Start-Process /S /CURRENTUSER"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S','/CURRENTUSER' -PassThru
          for ($w = 0; $w -lt 120; $w++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
          }
          if (-not $p.HasExited) { Write-Error 'Smoke FAIL: silent installer did not exit within 120s (likely a blocking dialog)' }
          Write-Host "Installer exit code = $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "Smoke FAIL: silent installer exited $($p.ExitCode)" }
          # 4) Discover install dir (installMode="both": per-user or per-machine).
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found after silent install' }
          Write-Host "Install dir (matched) = $installDir"
          # 5) Locate drawpaper.exe.
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { Write-Error "Smoke FAIL: drawpaper.exe not found under $installDir" }
          Write-Host "App exe = $exe"
          # 6) Version assertion: compare NUMERIC token sequences (Windows may
          #    rewrite 0.1.0-rc.10 -> 0.1.0.10).
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed exe ProductVersion (raw) = '$productVersion'"
          Write-Host "tauri.conf version           (raw) = '$expectedVersion'"
          function Get-NumTokens([string]$v) {
            if (-not $v) { return @() }
            return @([regex]::Matches($v, '\d+') | ForEach-Object { [int]$_.Value })
          }
          $exp = Get-NumTokens $expectedVersion
          $got = Get-NumTokens $productVersion
          $max = [Math]::Max($exp.Count, $got.Count)
          while ($exp.Count -lt $max) { $exp += 0 }
          while ($got.Count -lt $max) { $got += 0 }
          if (@(Compare-Object $exp $got -SyncWindow 0).Count -ne 0) {
            Write-Error "Smoke FAIL: version mismatch. tauri.conf='$expectedVersion' vs ProductVersion='$productVersion'"
          }
          Write-Host "Smoke OK: installed arm64 exe present and numeric version tokens match"

      - name: 'Smoke (arm64 native): launch exe, main window title contains drawpaper, then kill'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "[arch] PROCESSOR_ARCHITECTURE='$env:PROCESSOR_ARCHITECTURE'"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { Write-Error "FAIL: not on ARM64 runner" }
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at launch time' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "Launching $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host ("Start-Process returned pid={0}" -f $proc.Id)
          $ok = $false
          # Bounded poll up to 20s for a main window whose title contains drawpaper.
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $p = Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($p) {
              for ($s = 1; $s -le 3; $s++) {
                $p.Refresh()
                $title = $p.MainWindowTitle
                Write-Host ("t={0,2}s sample={1} pid={2} MainWindowTitle='{3}'" -f $i, $s, $p.Id, $title)
                if ($title -and ($title.ToLower().Contains('drawpaper'))) { $ok = $true; break }
                Start-Sleep -Milliseconds 300
              }
            } else {
              Write-Host ("t={0,2}s: drawpaper process not found yet" -f $i)
            }
            if ($ok) { break }
          }
          # Best-effort cleanup of drawpaper AND its WebView2 children.
          Get-Process -Name 'drawpaper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) {
            Write-Error 'Smoke FAIL: drawpaper process did not present a main window whose title contains "drawpaper" within 20s'
          }
          Write-Host "Smoke OK: arm64 process alive and main window title contains 'drawpaper'"

      # Wave23 E: the SAME headless CLI assertion suite the x64 build job runs is
      # executed here against the NATIVE arm64 install. This upgrades arm64-native
      # from "install / GUI-window-title / uninstall" to also covering the
      # headless CLI surface (version / usage-marker / bounded headless lifecycle /
      # --diag-export privacy canary). The window-title step above stays as-is
      # (it is not a GUI interaction smoke); arm64-native still uploads NO
      # release assets (publish continues to ship the cross-built arm64 bundle).
      - name: 'Smoke (arm64 native): headless CLI suite (version / usage / lifecycle + diag privacy canary)'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "[arch] PROCESSOR_ARCHITECTURE='$env:PROCESSOR_ARCHITECTURE'"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { Write-Error "FAIL: not on ARM64 runner" }
          # Discover install dir / exe exactly like the install step above.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) { Write-Error 'Smoke FAIL: install dir not found at CLI smoke' }
          $exe = Join-Path $installDir 'drawpaper.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem $installDir -Recurse -Filter 'drawpaper.exe' -File | Select-Object -First 1 -ExpandProperty FullName }
          Write-Host "App exe = $exe"
          & 'apps/desktop-tauri/ci/smoke-cli.ps1' -ExePath $exe -Arch arm64
          Write-Host "Smoke OK: headless CLI suite passed (arm64 native)"

      - name: 'Smoke (arm64 native): silent uninstall, install dir removed'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "[arch] PROCESSOR_ARCHITECTURE='$env:PROCESSOR_ARCHITECTURE'"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { Write-Error "FAIL: not on ARM64 runner" }
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\drawpaper'),
            (Join-Path $env:LOCALAPPDATA 'drawpaper'),
            (Join-Path $env:ProgramFiles 'drawpaper')
          )
          if (${env:ProgramFiles(x86)}) { $candidates += (Join-Path ${env:ProgramFiles(x86)} 'drawpaper') }
          $installDir = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $installDir = $c; break } }
          if (-not $installDir) {
            foreach ($root in @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem $root -Filter 'drawpaper' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { $installDir = $hit.FullName; break }
              }
            }
          }
          if (-not $installDir) {
            Write-Host "Install dir already absent; nothing to uninstall"
            exit 0
          }
          Write-Host "Install dir = $installDir"
          $uninst = Get-ChildItem $installDir -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninst) { $uninst = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -File | Select-Object -First 1 }
          if (-not $uninst) {
            Write-Host "Entries under $installDir :"
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "Smoke FAIL: uninstaller exe (unins*.exe / Uninstall*.exe) not found in $installDir"
          }
          Write-Host "Uninstaller = $($uninst.FullName)"
          # Try /SILENT first, fall back to /S. Never blind -Wait: poll instead.
          $removed = $false
          foreach ($arg in @('/SILENT', '/S')) {
            Write-Host "Running uninstaller with arg '$arg'"
            $u = Start-Process -FilePath $uninst.FullName -ArgumentList $arg -PassThru
            for ($w = 0; $w -lt 60; $w++) {
              Start-Sleep -Seconds 1
              $u.Refresh()
              if ($u.HasExited) { break }
            }
            Write-Host "Uninstaller ($arg) exited = $($u.HasExited)"
            for ($i = 1; $i -le 20; $i++) {
              Start-Sleep -Seconds 1
              if (-not (Test-Path $installDir)) { $removed = $true; break }
            }
            if ($removed) { break }
            Write-Host "  dir still present after '$arg'; trying next arg..."
          }
          if (-not $removed) {
            # Wave18 P2 residual-process sweep before declaring failure.
            Write-Host "::warning title=uninstall-residual-sweep::install dir still present; sweeping residual drawpaper/unins* processes before re-poll"
            $victims = Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'drawpaper*' -or $_.Name -like 'unins*' -or $_.Name -like 'uninstall*' }
            if ($victims) {
              $victims | ForEach-Object { Write-Host "  killing residual process: $($_.Name) (PID $($_.Id))" }
              $victims | Stop-Process -Force -ErrorAction SilentlyContinue
            } else {
              Write-Host '  no residual drawpaper/unins* process found'
            }
            Start-Sleep -Seconds 2
            for ($i = 1; $i -le 10; $i++) {
              Start-Sleep -Seconds 1
              if (-not (Test-Path $installDir)) { $removed = $true; break }
            }
            Write-Host "post-sweep re-poll: dir removed = $removed"
          }
          if (-not $removed) {
            Write-Host "Remaining files under $installDir (final) :"
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "Smoke FAIL: install dir still present after silent uninstall (tried /SILENT and /S, residual-process sweep + 10s re-poll)"
          }
          Write-Host "Smoke OK: install dir removed after silent uninstall"

      # Failure forensics only: release assets are NEVER uploaded here (publish
      # still ships the cross-built nsis-arm64/msi-arm64 artifacts).
      - name: Upload arm64-native logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-native-logs
          path: apps/desktop-tauri/tauri-build.log
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # Wave24: independent offline-runtime job.
  #
  # Builds a FULLY OFFLINE NSIS installer by embedding the WebView2 Evergreen
  # Standalone Runtime (~200 MB) via Tauri `offlineInstaller: true`. This job is
  # intentionally INDEPENDENT:
  #   - no `needs:` — it runs in parallel with build/arm64-native;
  #   - publish.needs stays `build` only, so this asset NEVER blocks or feeds
  #     the GitHub Release;
  #   - artifact name `nsis-offline-x64` does NOT collide with `nsis-x64`.
  #
  # On branch pushes the artifact stays on the run page (evidence). A maintainer
  # can later attach *-offline-setup.exe to a release manually for air-gapped
  # users. 200 MB is well under GitHub's 2 GB per-file release limit.
  # ------------------------------------------------------------------
  offline-runtime:
    runs-on: windows-latest
    env:
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Install Tauri CLI (desktop shell, outside the pnpm workspace)
        working-directory: apps/desktop-tauri
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org/

      - name: Add Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build web frontend
        run: pnpm -r build

      - name: Tauri build (offline NSIS, x64 — embeds WebView2 Evergreen Standalone)
        working-directory: apps/desktop-tauri
        shell: bash
        timeout-minutes: 40
        env:
          TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_KEY:-}" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$TAURI_SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_KEY_PASSWORD:-}"
          fi
          echo "::group::tauri CLI version"
          ./node_modules/.bin/tauri --version
          echo "::endgroup::"
          start_ts=$(date +%s)
          # offlineInstaller:true makes Tauri download the Evergreen Standalone
          # (~200 MB from Microsoft) at build time and embed it into the NSIS exe.
          ./node_modules/.bin/tauri build --ci --bundles nsis \
            --config '{"bundle":{"windows":{"nsis":{"webviewInstallMode":{"type":"offlineInstaller"}}}}}' 2>&1 | tr '\r' '\n' | tee /tmp/tauri-offline.log
          echo "tauri build exit=0 elapsed=$(( $(date +%s)-start_ts ))s"

      - name: Rename offline installer and print size
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'apps/desktop-tauri/src-tauri/target' -Recurse -Filter '*-setup.exe' -File |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } | Select-Object -First 1
          if (-not $installer) { Write-Error 'offline FAIL: NSIS *-setup.exe not found after offline build' }
          $mb = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "::notice title=wv2-offline-size::Fully-offline setup.exe = $mb MB ($($installer.Name))"
          # Rename to *-offline-setup.exe so it is unmistakable on the run page.
          $newName = $installer.Name -replace '-setup\.exe$', '-offline-setup.exe'
          $newPath = Join-Path $installer.DirectoryName $newName
          Copy-Item -Path $installer.FullName -Destination $newPath -Force
          Write-Host "Renamed copy: $newPath = $([math]::Round((Get-Item $newPath).Length/1MB,2)) MB"

      - name: Upload offline NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsis-offline-x64
          path: |
            apps/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*-offline-setup.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    # Only publish a release on tag pushes; branch/dispatch runs only validate
    # that the Windows toolchain produces installers (artifacts stay on the run).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NSIS installers (x64)
        # download-artifact@v4: name a single artifact per step. v4 does NOT
        # support the v3 "download all unnamed artifacts into one dir" pattern;
        # without `name` it fans each artifact into its own subdir, which is
        # fragile here. Explicit downloads to distinct paths are deterministic.
        uses: actions/download-artifact@v4
        with:
          name: nsis-x64
          path: artifacts/nsis-x64

      - name: Download NSIS installers (arm64)
        uses: actions/download-artifact@v4
        with:
          name: nsis-arm64
          path: artifacts/nsis-arm64

      - name: Download MSI installers (x64)
        uses: actions/download-artifact@v4
        with:
          name: msi-x64
          path: artifacts/msi-x64

      - name: Download MSI installers (arm64)
        uses: actions/download-artifact@v4
        with:
          name: msi-arm64
          path: artifacts/msi-arm64

      - name: List installers
        run: |
          echo "::group::Installers collected"
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' \) -print | sort
          echo "::endgroup::"

      - name: Generate SHA256SUMS.txt
        # One line per installer (NSIS *-setup.exe AND WiX *.msi):
        # "<sha256>  <basename>". Basename (no arch subdir) so a user who
        # downloads all four installers + the sums file into one folder can run
        # `sha256sum -c SHA256SUMS.txt` directly.
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS.txt
          # shellcheck disable=SC2044
          for f in $(find nsis-x64 nsis-arm64 msi-x64 msi-arm64 \( -name '*-setup.exe' -o -name '*.msi' \) -type f | sort); do
            hash="$(sha256sum "$f" | cut -d' ' -f1)"
            base="$(basename "$f")"
            printf '%s  %s\n' "$hash" "$base" >> SHA256SUMS.txt
          done
          echo "::group::SHA256SUMS.txt"
          cat SHA256SUMS.txt
          echo "::endgroup::"
          # Wave19 A: bilingual MSI -> 6 installers total, hard-pinned:
          #   NSIS x64/arm64                              = 2 (*-setup.exe)
          #   MSI  x64/arm64 x 2 cultures (en-US, zh-CN) = 4 (*.msi)
          #   = 2 + 4 = 6. Fail loudly if the culture matrix drifts.
          n_lines="$(wc -l < SHA256SUMS.txt)"
          echo "SHA256SUMS lines = $n_lines (expected 6)"
          test "$n_lines" -eq 6

      - name: Generate latest.json (Tauri updater manifest)
        # Wave15 A: builds the static updater manifest the desktop shell pulls
        # from .../releases/latest/download/latest.json. Whole publish job is
        # tag-gated. If the .sig sidecars are absent (tag cut before the
        # TAURI_SIGNING_KEY secret is configured), skip gracefully — installers
        # still publish, just without in-app updates (users download manually).
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          X64_EXE="$(find artifacts/nsis-x64 -name '*-setup.exe' -type f | head -n1 || true)"
          ARM64_EXE="$(find artifacts/nsis-arm64 -name '*-setup.exe' -type f | head -n1 || true)"
          X64_SIG="$(find artifacts/nsis-x64 -name '*-setup.exe.sig' -type f | head -n1 || true)"
          ARM64_SIG="$(find artifacts/nsis-arm64 -name '*-setup.exe.sig' -type f | head -n1 || true)"
          if [ -z "${X64_EXE:-}" ] || [ -z "${ARM64_EXE:-}" ] || [ -z "${X64_SIG:-}" ] || [ -z "${ARM64_SIG:-}" ]; then
            echo "::warning::updater .sig sidecars missing (TAURI_SIGNING_KEY secret not configured?) — skipping latest.json; installers still publish, in-app updates will fall back to the Releases web page."
            exit 0
          fi
          X64_BASE="$(basename "$X64_EXE")"
          ARM64_BASE="$(basename "$ARM64_EXE")"
          VERSION="$(python3 -c 'import json;print(json.load(open("apps/desktop-tauri/src-tauri/tauri.conf.json"))["version"])')"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$BASE" "$TAG" "$X64_BASE" "$ARM64_BASE" "$X64_SIG" "$ARM64_SIG" "$VERSION" "$PUB_DATE" <<'PY'
          import sys, json
          base, tag, x64_base, arm64_base, x64_sig, arm64_sig, version, pub_date = sys.argv[1:9]
          manifest = {
            "version": version,
            "notes": "drawpaper %s 预发布。完整更新说明见仓库 CHANGELOG.md。" % tag,
            "pub_date": pub_date,
            "platforms": {
              "windows-x86_64": {
                "url": "%s/%s" % (base, x64_base),
                "signature": open(x64_sig).read().strip(),
              },
              "windows-aarch64": {
                "url": "%s/%s" % (base, arm64_base),
                "signature": open(arm64_sig).read().strip(),
              },
            },
          }
          open("artifacts/latest.json", "w").write(json.dumps(manifest, indent=2, ensure_ascii=False))
          print("::group::latest.json")
          print(open("artifacts/latest.json").read())
          print("::endgroup::")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: drawpaper ${{ github.ref_name }}
          # This workflow is only cut for RC/beta/pre-release tags; pin
          # prerelease: true explicitly instead of inferring from the tag shape,
          # so a stable vX.Y.Z must flip this deliberately rather than by accident.
          prerelease: true
          files: |
            artifacts/nsis-x64/**/*.exe
            artifacts/nsis-arm64/**/*.exe
            artifacts/nsis-x64/**/*.sig
            artifacts/nsis-arm64/**/*.sig
            artifacts/latest.json
            artifacts/msi-x64/**/*.msi
            artifacts/msi-arm64/**/*.msi
            artifacts/SHA256SUMS.txt
          generate_release_notes: false
          body: |
            ## drawpaper ${{ github.ref_name }}（预发布）

            Windows 桌面安装包（Win10/11，NSIS 与 WiX MSI 双格式 × x64/ARM64）。本地优先：所有数据留在本机，无账号、无云同步。

            **NSIS（推荐，与以往版本一致）**
            - `drawpaper_*_x64-setup.exe` — 64 位 Intel/AMD
            - `drawpaper_*_arm64-setup.exe` — ARM64（Copilot+、Surface Pro X 等）
            - `latest.json` + `*.sig` — 应用内「帮助 → 检查更新…」原生更新清单与签名（仅在配置了 updater 签名私钥后生效；未配置时应用自动回退到本网页手动下载）。

            **WiX MSI（企业 / 批量部署场景）**
            - `drawpaper_*_x64_en-US.msi` / `drawpaper_*_x64_zh-CN.msi` — 64 位 Intel/AMD（按机器安装到 Program Files；en-US / zh-CN 两种安装界面 culture，二选一部署）
            - `drawpaper_*_arm64_en-US.msi` / `drawpaper_*_arm64_zh-CN.msi` — ARM64

            - `SHA256SUMS.txt` — 六个安装包（NSIS×2 + MSI×4：x64/arm64 × en-US/zh-CN）的 SHA-256 校验和（下载后 `sha256sum -c SHA256SUMS.txt` 校验）。

            升级方式：若本版已带 `latest.json`，旧版应用点「帮助 → 检查更新…」即可原生更新；否则手动下载新安装包覆盖安装（用户数据不动）。详见仓库 `CHANGELOG.md` 与 `docs/RELEASE.md`。
