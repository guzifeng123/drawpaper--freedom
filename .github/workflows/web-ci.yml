name: web-ci

on:
  push:
    branches:
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - develop

# Cancel in-flight runs on the same ref to save CI minutes.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

# .npmrc pins registry.npmmirror.com (fast for local China dev).
# GitHub runners are in the US; override to the official registry so CI
# doesn't flake on mirror connectivity.
env:
  npm_config_registry: https://registry.npmjs.org/

jobs:
  # ── Chromium 全量 e2e（既有门禁，零回归）──────────────────────────────
  # install / build / typecheck / lint / unit / precache / chromium e2e / offline e2e。
  chromium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 'Diagnostic: pnpm/node/registry versions'
        run: |
          pnpm --version
          node --version
          pnpm config get registry

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/ --reporter=append-only

      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (core + web)
        run: pnpm -r test

      - name: Verify PWA precache completeness
        run: node packages/web/scripts/verify-precache.mjs

      - name: Install Playwright chromium
        working-directory: packages/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright e2e
        working-directory: packages/web
        run: npx playwright test
        env:
          CI: '1'

      # 生产构建（vite preview + Service Worker）下的真实断网回归：
      # 该配置的 webServer 会自行 build 并起 preview（OFFLINE_PORT 默认 4188）。
      - name: Playwright offline e2e (production preview + Service Worker)
        working-directory: packages/web
        run: npx playwright test --config playwright.offline.config.ts
        env:
          CI: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7
          if-no-files-found: warn

  # ── WebKit 兼容降级 e2e（Wave21 闭环）─────────────────────────────────
  # ubuntu-latest 有 sudo，可 apt 装 WebKit 系统库（--with-deps webkit）。
  # 与 chromium job 并行，只跑 wave21-webkit-compat.spec.ts（5 例）。
  # 硬门：失败即红，不允许 continue-on-error / fixme / skip 凑绿。
  webkit:
    runs-on: ubuntu-latest
    env:
      # 取证假设：CI runner 带 http_proxy/https_proxy，WebKitGTK(libsoup) 可能把
      # 127.0.0.1 也走代理导致引擎侧导航挂起（node 侧正常）。强制本地回环绕过代理。
      # 注意：GitHub Actions env 键大小写不敏感，no_proxy 与 NO_PROXY 不能同块出现。
      no_proxy: '127.0.0.1,localhost,::1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/ --reporter=append-only

      # webServer 走 pnpm dev，但 @drawpaper/core 的 exports 指向 dist，需先构建。
      - name: Build all packages
        run: pnpm -r build

      - name: Install Playwright webkit (+ system deps)
        working-directory: packages/web
        run: pnpm exec playwright install --with-deps webkit

      # 先独立起 dev server（detach），供取证脚本与 e2e 共用（e2e 用 WEBKIT_REUSE_SERVER=1 复用）。
      - name: Start Vite dev server (webkit)
        working-directory: packages/web
        run: |
          nohup pnpm dev --host 127.0.0.1 --port 4190 --strictPort > /tmp/webkit-dev.log 2>&1 &
          echo $! > /tmp/webkit-dev.pid
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:4190/ >/dev/null; then
              echo "dev server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev server did not become ready in 60s"; cat /tmp/webkit-dev.log; exit 1

      # 取证：node 侧 request vs 引擎侧 goto 对比 + 外网对照，全部写 GITHUB_STEP_SUMMARY。
      # 本步退出码恒 0（取证不挡 CI）；后续 e2e 仍是硬门。
      - name: WebKit nav forensics
        working-directory: packages/web
        if: always()
        run: |
          {
            echo "## env proxy"
            env | grep -iE 'proxy' || echo '(no proxy env)'
            echo
            echo "## curl -sI (node/普通 HTTP)"
            curl -sI --max-time 10 http://127.0.0.1:4190/ | head -10
            echo
            echo "## curl HTML head"
            curl -s --max-time 10 http://127.0.0.1:4190/ | head -30
            echo
            node scripts/webkit-nav-forensics.mjs
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Playwright webkit e2e (wave21 compat)
        working-directory: packages/web
        run: npx playwright test --config playwright.webkit.config.ts
        env:
          CI: '1'
          WEBKIT_REUSE_SERVER: '1'

      - name: Upload Playwright report (webkit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7
          if-no-files-found: warn
