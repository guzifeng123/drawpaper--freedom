<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="本地优先的无限画布知识块连线笔记工具" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>drawpaper · 知识块连线笔记</title>
    <!-- Wave3-H 主题首屏无闪烁：React 挂载前同步决定 <html> 是否加 .dark。
         localStorage key 与 panels/lib/theme.ts 的 drawpaper-theme 保持一致。 -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('drawpaper-theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Wave24 首帧占位：React 首次 render 会清空 #root；JS 下载期间先给品牌色
           画布，避免死白屏（零 JS、零外网；.dark 由上面内联脚本提前决定）。 -->
      <style>
        #root-boot-splash {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0f172a;
          color: #e2e8f0;
          font: 500 15px/1.5 system-ui, sans-serif;
          letter-spacing: 0.04em;
        }
        html:not(.dark) #root-boot-splash { background: #ffffff; color: #0f172a; }
      </style>
      <div id="root-boot-splash">drawpaper</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
